<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 650" width="820" height="650" role="img" xml:lang="en" aria-labelledby="sem02-expansion-order-title sem02-expansion-order-desc">
  <title id="sem02-expansion-order-title">Bash Expansion Order</title>
  <desc id="sem02-expansion-order-desc">Bash performs brace and tilde expansion, then parameter, arithmetic and command substitution, then word splitting, pathname expansion and quote removal where the command context permits them. For N=5, {1..$N} becomes the single word {1..5}, not a sequence.</desc>
  <defs>
    <marker id="sem02-expansion-order-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="650" fill="#f8fafc"/>
  <text x="410.0" y="30" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold" id="sem02-expansion-order-text-1">Bash Expansion Order</text>
  <rect x="85" y="55" width="650" height="53" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="76" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" id="sem02-expansion-order-text-2">1  Brace expansion</text>
  <text x="105" y="97" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem02-expansion-order-text-3">{1..5} → five words: 1 2 3 4 5</text>
  <path d="M 410 108 L 410 119" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem02-expansion-order-arrow)"/>
  <rect x="85" y="120" width="650" height="53" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="141" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" id="sem02-expansion-order-text-4">2  Tilde expansion</text>
  <text x="105" y="162" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem02-expansion-order-text-5">~ → the home directory in an eligible context</text>
  <path d="M 410 173 L 410 184" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem02-expansion-order-arrow)"/>
  <rect x="85" y="185" width="650" height="53" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="206" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" id="sem02-expansion-order-text-6">3  Parameter, arithmetic and command substitution</text>
  <text x="105" y="227" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem02-expansion-order-text-7">Same stage, left to right: $VAR, $((1+2)), $(command)</text>
  <path d="M 410 238 L 410 249" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem02-expansion-order-arrow)"/>
  <rect x="85" y="250" width="650" height="53" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="271" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" id="sem02-expansion-order-text-8">4  Word splitting</text>
  <text x="105" y="292" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem02-expansion-order-text-9">Unquoted expansion results: fields determined by IFS</text>
  <path d="M 410 303 L 410 314" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem02-expansion-order-arrow)"/>
  <rect x="85" y="315" width="650" height="53" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="336" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" id="sem02-expansion-order-text-10">5  Pathname expansion</text>
  <text x="105" y="357" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem02-expansion-order-text-11">Eligible *, ? and [...] patterns → matching filenames</text>
  <path d="M 410 368 L 410 379" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem02-expansion-order-arrow)"/>
  <rect x="85" y="380" width="650" height="53" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="401" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" id="sem02-expansion-order-text-12">6  Quote removal</text>
  <text x="105" y="422" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem02-expansion-order-text-13">Remove syntactic quotes; quoted characters remain protected</text>
  <text x="410" y="460" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem02-expansion-order-text-14">Quoting and command context control which stages apply.</text>
  <text x="410" y="480" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem02-expansion-order-text-15">Process substitution, where supported, occurs alongside stage 3.</text>
  <rect x="30" y="495" width="760" height="67" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="410" y="519" font-family="monospace" font-size="15" fill="#9a3412" text-anchor="middle" id="sem02-expansion-order-text-16">N=5; printf '%s\n' {1..$N}</text>
  <text x="410" y="545" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" id="sem02-expansion-order-text-17">Output: {1..5} — one word. Brace expansion is not repeated after $N expands.</text>
  <rect x="30" y="575" width="760" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="410" y="596" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem02-expansion-order-text-18">Alternative loop headers, for a validated positive integer N:</text>
  <text x="220" y="620" font-family="monospace" font-size="12" fill="#166534" text-anchor="middle" id="sem02-expansion-order-text-19">for i in $(seq 1 "$N")</text>
  <text x="600" y="620" font-family="monospace" font-size="12" fill="#166534" text-anchor="middle" id="sem02-expansion-order-text-20">for ((i=1; i&lt;=N; i++))</text>
</svg>
