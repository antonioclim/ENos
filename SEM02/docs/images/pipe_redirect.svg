<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" xml:lang="en" aria-labelledby="sem02-pipe-redirect-title sem02-pipe-redirect-desc">
  <title id="sem02-pipe-redirect-title">Pipes and I/O Redirection</title><desc id="sem02-pipe-redirect-desc">A command reads stdin descriptor 0 and writes stdout descriptor 1 and stderr descriptor 2. Pipes connect stdout to the next stdin. The lower examples independently show overwrite, append, stderr duplication and redirected file input.</desc><defs>
    <style>
      .sem02-pipe-redirect-process { fill: #2c5282; stroke: #4299e1; stroke-width: 2; rx: 6; }
      .sem02-pipe-redirect-file { fill: #276749; stroke: #48bb78; stroke-width: 2; rx: 3; }
      .sem02-pipe-redirect-stream { fill: #553c9a; stroke: #9f7aea; stroke-width: 2; rx: 3; }
      .sem02-pipe-redirect-terminal { fill: #744210; stroke: #ed8936; stroke-width: 2; rx: 3; }
      .sem02-pipe-redirect-text { fill: #e2e8f0; font-family: 'Consolas', monospace; font-size: 12px; text-anchor: middle; }
      .sem02-pipe-redirect-text-title { font-size: 16px; font-weight: bold; }
      .sem02-pipe-redirect-text-label { font-size: 11px; fill: #e2e8f0; }
      .sem02-pipe-redirect-arrow { stroke: #48bb78; stroke-width: 2; fill: none; marker-end: url(#sem02-pipe-redirect-arrow-green); }
      .sem02-pipe-redirect-arrow-red { stroke: #fc8181; stroke-width: 2; fill: none; marker-end: url(#sem02-pipe-redirect-arrow-red); }
      .sem02-pipe-redirect-arrow-pipe { stroke: #4299e1; stroke-width: 3; fill: none; marker-end: url(#sem02-pipe-redirect-arrow-blue); }
      .sem02-pipe-redirect-pipe-symbol { fill: #4299e1; font-size: 24px; font-weight: bold; }
    </style>
    <marker id="sem02-pipe-redirect-arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#48bb78"/>
    </marker>
    <marker id="sem02-pipe-redirect-arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fc8181"/>
    </marker>
    <marker id="sem02-pipe-redirect-arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4299e1"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="500" fill="#1a202c"/>
  
  <!-- Title -->
  <text x="350" y="30" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-title" id="sem02-pipe-redirect-text-1">Pipes and I/O Redirection</text>
  
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- SECȚIUNEA 1: FLUX STANDARD -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  
  <text x="350" y="60" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-2">Standard streams</text>
  
  <!-- stdin -->
  <rect x="30" y="80" width="80" height="40" class="sem02-pipe-redirect-stream"/>
  <text x="70" y="105" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-3">stdin</text>
  <text x="70" y="130" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-4">fd 0</text>
  
  <!-- Process -->
  <rect x="160" y="75" width="100" height="50" class="sem02-pipe-redirect-process"/>
  <text x="210" y="105" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-5">command</text>
  
  <!--stdout [1]-->
  <rect x="310" y="70" width="80" height="35" class="sem02-pipe-redirect-stream"/>
  <text x="350" y="93" class="sem02-pipe-redirect-text" font-size="10" id="sem02-pipe-redirect-text-6">stdout [1]</text>
  <!--stderr [2]-->
  <rect x="310" y="110" width="80" height="35" class="sem02-pipe-redirect-stream"/>
  <text x="350" y="133" class="sem02-pipe-redirect-text" font-size="10" id="sem02-pipe-redirect-text-7">stderr [2]</text>
  <!-- Terminal -->
  <rect x="440" y="80" width="90" height="50" class="sem02-pipe-redirect-terminal"/>
  <text x="485" y="110" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-8">Terminal</text>
  
  <!-- Arrows -->
  <path d="M110 100 L155 100" class="sem02-pipe-redirect-arrow"/>
  <path d="M260 95 L305 88" class="sem02-pipe-redirect-arrow"/>
  <path d="M260 105 L305 127" class="sem02-pipe-redirect-arrow-red"/>
  <path d="M390 88 L435 100" class="sem02-pipe-redirect-arrow"/>
  <path d="M390 127 L435 110" class="sem02-pipe-redirect-arrow-red"/>
  
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- SECȚIUNEA 2: PIPELINE -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  
  <text x="350" y="195" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-9">Pipeline: cmd1 | cmd2 | cmd3</text>
  
  <!-- cmd1 -->
  <rect x="50" y="215" width="90" height="45" class="sem02-pipe-redirect-process"/>
  <text x="95" y="243" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-10">cmd1</text>
  
  <!-- Pipe 1 -->
  <text x="167" y="243" class="sem02-pipe-redirect-pipe-symbol" id="sem02-pipe-redirect-text-11">|</text>
  
  <!-- cmd2 -->
  <rect x="195" y="215" width="90" height="45" class="sem02-pipe-redirect-process"/>
  <text x="240" y="243" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-12">cmd2</text>
  
  <!-- Pipe 2 -->
  <text x="312" y="243" class="sem02-pipe-redirect-pipe-symbol" id="sem02-pipe-redirect-text-13">|</text>
  
  <!-- cmd3 -->
  <rect x="340" y="215" width="90" height="45" class="sem02-pipe-redirect-process"/>
  <text x="385" y="243" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-14">cmd3</text>
  
  <!-- Output -->
  <rect x="480" y="215" width="90" height="45" class="sem02-pipe-redirect-terminal"/>
  <text x="525" y="243" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-15">output</text>
  
  <!-- Arrows Pipeline -->
  <path d="M140 237 L155 237" class="sem02-pipe-redirect-arrow-pipe"/>
  <path d="M285 237 L300 237" class="sem02-pipe-redirect-arrow-pipe"/>
  <path d="M430 237 L475 237" class="sem02-pipe-redirect-arrow-pipe"/>
  
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- SECȚIUNEA 3: REDIRECȚIONĂRI -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  
  <text x="350" y="295" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-16">Redirections</text>
  
  <!-- > file -->
  <rect x="50" y="310" width="120" height="35" class="sem02-pipe-redirect-process"/>
  <text x="110" y="333" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-17">cmd &gt; file</text>
  <rect x="200" y="310" width="80" height="35" class="sem02-pipe-redirect-file"/>
  <text x="240" y="333" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-18">file.txt</text>
  <path d="M170 327 L195 327" class="sem02-pipe-redirect-arrow"/>
  <text x="110" y="360" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-19">overwrite</text>
  
  <!-- >> file -->
  <rect x="320" y="310" width="120" height="35" class="sem02-pipe-redirect-process"/>
  <text x="380" y="333" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-20">cmd &gt;&gt; file</text>
  <rect x="470" y="310" width="80" height="35" class="sem02-pipe-redirect-file"/>
  <text x="510" y="333" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-21">file.txt</text>
  <path d="M440 327 L465 327" class="sem02-pipe-redirect-arrow"/>
  <text x="380" y="360" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-22">append</text>
  
  <!-- 2>&1 -->
  <rect x="50" y="380" width="180" height="35" class="sem02-pipe-redirect-process"/>
  <text x="140" y="403" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-23">cmd &gt; f.txt 2&gt;&amp;1</text>
  <rect x="260" y="380" width="80" height="35" class="sem02-pipe-redirect-file"/>
  <text x="300" y="403" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-24">f.txt</text>
  <path d="M230 397 L255 397" class="sem02-pipe-redirect-arrow"/>
  <text x="300" y="430" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-25">stdout + stderr</text>
  
  <!-- < file -->
  <rect x="380" y="380" width="120" height="35" class="sem02-pipe-redirect-process"/>
  <text x="440" y="403" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-26">cmd &lt; file</text>
  <rect x="520" y="380" width="80" height="35" class="sem02-pipe-redirect-file"/>
  <text x="560" y="403" class="sem02-pipe-redirect-text" id="sem02-pipe-redirect-text-27">file.txt</text>
  <path d="M520 397 L500 397" class="sem02-pipe-redirect-arrow"/>
  <text x="440" y="430" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-28">input from file</text>
  
  <!-- Legend -->
  <rect x="50" y="455" width="15" height="15" class="sem02-pipe-redirect-process"/>
  <text x="99.0" y="467" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" text-anchor="start" style="text-anchor: start" id="sem02-pipe-redirect-text-29">Process</text>
  
  <rect x="150" y="455" width="15" height="15" class="sem02-pipe-redirect-file"/>
  <text x="199.0" y="467" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" text-anchor="start" style="text-anchor: start" id="sem02-pipe-redirect-text-30">File</text>
  
  <rect x="250" y="455" width="15" height="15" class="sem02-pipe-redirect-stream"/>
  <text x="299.0" y="467" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" text-anchor="start" style="text-anchor: start" id="sem02-pipe-redirect-text-31">Stream</text>
  
  <rect x="350" y="455" width="15" height="15" class="sem02-pipe-redirect-terminal"/>
  <text x="375" y="467" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" text-anchor="start" style="text-anchor: start" id="sem02-pipe-redirect-text-32">Terminal</text>
  
  <text x="630" y="467" class="sem02-pipe-redirect-text sem02-pipe-redirect-text-label" id="sem02-pipe-redirect-text-33">SEM02 OS</text>
</svg>
