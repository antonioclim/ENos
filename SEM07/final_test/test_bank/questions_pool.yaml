      - id: VC02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L14-q02
        question: Difference between Type 1 and Type 2 hypervisors?
        options:
          a: No difference
          b: 'Type 1 (bare-metal): on hardware. Type 2 (hosted): on host OS'
          c: Type 2 is faster
          d: Type 1 is software, Type 2 hardware
        answer: b
        explanation: The conventional taxonomy distinguishes a hypervisor integrated at the host hardware/system layer
          from one hosted by a general-purpose OS. Architecture and implementation details matter; the label alone does
          not prove a speed or security ranking.
        points: 0.5

      - id: VC03
