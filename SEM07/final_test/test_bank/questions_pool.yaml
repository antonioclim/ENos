          b: printf() is from libc (userspace). Kernel uses printk()
          c: Kernel has no output
          d: printf() deprecated
        answer: b
        explanation: Kernel lacks libc. printk(KERN_INFO ...) writes to kernel log (dmesg).
        points: 0.5

      - id: NA11
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L17-q07
        question: In a non-PREEMPT_RT Linux hard-IRQ handler, why is a sleeping mutex unsuitable for protecting a shared
          short critical section?
        options:
          a: Safer
          b: Mutexes can sleep; in interrupt context you cannot sleep
          c: Spinlocks slower
          d: No difference
        answer: b
        explanation: Hard-IRQ context cannot sleep. A suitable spinlock protocol must also address local interrupt reentrancy
          and keep the section short. PREEMPT_RT changes spinlock_t and often threads interrupt handling; raw_spinlock_t
          and the exact context must be considered separately.
        points: 0.75

      - id: NA12
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L17-q08
        question: What capability does eBPF provide for supported kernel hooks?
        options:
