          c: "A type of encryption"
          d: "Not necessary"
        answer: "b"
        explanation: "Guest has its own PT. Shadow PT: guest VA→host PA for hardware MMU."
        points: 0.5

      - id: VC06
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L14-q07
        question: What structural difference can reduce per-instance OS overhead for native Linux containers compared
