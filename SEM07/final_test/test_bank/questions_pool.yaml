      - id: SA20
        type: practical
        difficulty: hard
        bloom: apply
        question: Write a Bash option-parsing fragment for -v (verbose) and -o outputfile, with defaults and a non-zero
          exit on unknown/missing options. Remove consumed options from the remaining positional arguments; the fragment
          need not create the output file.
        answer: |
          VERBOSE=0
          OUTPUT=""
          OPTIND=1
          while getopts ":vo:" opt; do
              case "$opt" in
                  v) VERBOSE=1 ;;
                  o) OUTPUT="$OPTARG" ;;
                  \?|:) printf 'Usage: %s [-v] [-o file] [--] [arguments...]\n' "$0" >&2; exit 2 ;;
              esac
          done
          shift "$((OPTIND - 1))"
        points: 1.5


