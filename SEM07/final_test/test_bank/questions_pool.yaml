          c: By encrypting every file
          d: By making storage errors impossible
        answer: b
        explanation: Recovery can replay committed journal transactions and avoid exposing incomplete metadata updates.
          Which data is journalled and which durability guarantees hold depend on the filesystem, journalling mode and
          storage behaviour.
