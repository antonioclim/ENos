    questions:
      - id: SE01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L13-q01"
        question: "What does the CIA triad mean in security?"
        options:
          a: "Central Intelligence Agency"
          b: "Confidentiality, Integrity, Availability"
          c: "Create, Install, Activate"
          d: "Control, Inspect, Authenticate"
        answer: "b"
        explanation: "CIA: Confidentiality (authorised access), Integrity (unaltered), Availability (accessible)."
        points: 0.5

      - id: SE02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L13-q02
        question: What do permissions rwxr-xr-- represent?
        options:
          a: Everyone has full access
          b: 'Owner: rwx, Group: r-x, Others: r--'
          c: The permission bits establish encryption
          d: Every user has execute permission
        answer: b
        explanation: 'rwx (owner=7), r-x (group=5), r-- (others=4). Octal: 754.'
        points: 0.5

      - id: SE03
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L13-q03
        question: When honoured for a Linux executable binary, what does the set-user-ID bit request at exec time?
        options:
          a: A virus scan
          b: Set the process's effective UID to the executable owner's UID
          c: Encrypt the executable
          d: Change the owner of every output file to the caller
        answer: b
        explanation: 'The bit does not automatically imply root: that depends on the owner. Linux can suppress SUID
          effects through mount/process settings and does not ordinarily honour the bit on interpreted scripts.'
        points: 0.5

      - id: SE04
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L13-q04"
        question: "Difference between authentication and authorisation?"
        options:
          a: "Identical"
          b: "Authentication: WHO you are. Authorisation: WHAT you can do"
          c: "Authorisation comes first"
          d: "Authentication not necessary"
        answer: "b"
        explanation: "Authentication = identity verification. Authorisation = access control."
        points: 0.5

      - id: SE05
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L13-q05"
        question: "What is the 'least privilege' principle?"
        options:
          a: "All users have root"
          b: "Processes receive only minimum permissions for their task"
          c: "Privileges increase automatically"
          d: "Doesn't apply"
        answer: "b"
        explanation: "Least privilege: minimises attack surface. Compromise has limited impact."
        points: 0.5

      - id: SE06
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L13-q06"
        question: "What is a buffer overflow?"
        options:
          a: "RAM is full"
          b: "Data exceeds buffer boundary, overwriting adjacent memory"
          c: "A type of compression"
          d: "A network error"
        answer: "b"
        explanation: "Buffer overflow: can overwrite return address, enabling code execution."
        points: 0.5

      - id: SE07
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L13-q07
        question: What is ASLR?
        options:
          a: An encryption algorithm
          b: Randomises memory positions to make exploitation harder
          c: A firewall
          d: A permission type
        answer: b
        explanation: ASLR randomises selected address-space locations, making some exploitation strategies less predictable.
          Information disclosures, insufficient entropy and other conditions can weaken it; it does not remove the underlying
          memory-safety defect.
        points: 0.5

      - id: SE08
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L13-q08
        question: For a world-writable Linux directory with the sticky bit set, what additional rule normally restricts
          deleting or renaming a contained entry?
        options:
          a: The entry is encrypted
          b: The file owner, directory owner or a suitably privileged process can pass the sticky-bit ownership check
          c: The entry is compressed
          d: The entry becomes invisible
        answer: b
        explanation: Directory permissions and other checks still apply. In ordinary root-owned /tmp, the directory-owner
          exception is root; it is not absent from the general rule. On Linux CAP_FOWNER can satisfy the privilege exception.
        points: 0.5

      - id: SE09
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L13-q09
        question: Why does DEP/NX help prevent buffer overflow exploits?
        options:
          a: Encrypts memory
          b: 'Marks regions non-executable: injected data cannot run as code'
          c: Increases speed
          d: Doesn't help
        answer: b
        explanation: NX/DEP prevents direct instruction execution from pages marked non-executable. It does not repair
          the write overflow or automatically stop code-reuse techniques and logic/data-only attacks.
        points: 0.75

      - id: SE10
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L13-q10
        question: What advantage does sandboxing offer?
        options:
          a: Increases speed
          b: Limits syscalls and resources, reducing compromise impact
          c: Saves memory
          d: No advantages
        answer: b
        explanation: A sandbox restricts permitted operations and can reduce compromise impact. Its coverage depends
          on its policy, implementation and surrounding system; a flaw or misconfiguration can weaken the boundary.
        points: 0.75

      - id: SE11
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L13-q11
        question: Main risk of SUID root programs?
        options:
          a: They necessarily run too slowly
          b: An exploitable flaw may allow unintended actions with the effective privileges retained by the program
          c: They necessarily consume too much memory
          d: They cannot introduce a security risk
        answer: b
        explanation: SUID-root execution increases the potential impact of suitable defects. The bit alone, or an arbitrary
          bug, does not prove full root compromise; exploitability, privilege dropping and other controls matter.
        points: 0.75

      - id: SE12
        type: multiple_choice
        difficulty: hard
        bloom: apply
        source: L13-q12
        question: A Linux executable binary owned by root has mode -rwsr-xr-x. Which conclusion is justified from this
          metadata alone?
        options:
          a: The binary has been proven safe
          b: It requests SUID-root execution where honoured and warrants review of the privileged behaviour
          c: The file is necessarily corrupted
          d: Every user can modify the file
        answer: b
        explanation: The mode establishes the SUID request, not an exploitable flaw or successful escalation. Mount/process
          settings and the program's handling of privileges determine the actual behaviour.
        points: 0.75


