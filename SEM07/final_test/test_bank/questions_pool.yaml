      - id: VC04
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L14-q04
        question: What central CPU execution support do Intel VT-x and AMD-V provide for virtual-machine monitors?
        options:
          a: A guaranteed increase in clock speed
          b: Hardware-supported guest/host transitions and controls for virtualised execution
          c: Automatic encryption of all application data
          d: Removal of all processor privilege checks
        answer: b
        explanation: Intel distinguishes VMX root and non-root operation, with ordinary privilege levels available within
          those modes; AMD has its own host/guest virtualisation mechanisms. Ring -1 is an informal analogy, not an
          additional x86 architectural privilege ring. VM exits have costs and are not universally fast.
