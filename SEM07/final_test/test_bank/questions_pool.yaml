        type: multiple_choice
        difficulty: medium
        bloom: evaluate
        source: SEM02-q22
        question: When grep can open file directly, which statement explains the usual simplification of 'cat file |
          grep pattern'?
        options:
          a: The pipeline is always syntactically invalid
          b: grep pattern file removes an unnecessary cat process
          c: cat is guaranteed to be slower on every workload
          d: grep cannot read a pipe
        answer: b
        explanation: The direct form uses fewer processes. This is not a benchmark or a universal claim about elapsed
          time; pipelines may still be useful when constructing or streaming input.
        points: 0.5

      - id: CR25
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: SEM02-q23
        question: What does nohup do for a command?
        options:
          a: Increases scheduling priority
          b: Starts the command with SIGHUP ignored and adjusts terminal I/O as documented
          c: Automatically backgrounds every command
          d: Prevents every possible termination
        answer: b
        explanation: nohup arranges for SIGHUP to be ignored; a program may later change its signal disposition. It
          neither backgrounds the command by itself nor protects it from other signals, session policies or failures.
        points: 0.5

      - id: CR26
        type: multiple_choice
        difficulty: hard
        bloom: evaluate
        source: SEM02-q26
        question: |
          Evaluate this LLM-generated code for processing user input:
          files=$(ls $input_dir)
          for f in $files; do rm $f; done
