        type: multiple_choice
        difficulty: medium
        bloom: apply
        source: SEM02-q18
        question: In Bash with dotglob disabled and at least one non-hidden .txt match, which loop header iterates over
          those matching names?
        options:
          a: for f in ls *.txt; do
          b: for f in *.txt; do
          c: for f in (*.txt); do
          d: for f = *.txt; do
        answer: b
        explanation: The glob expands each matching pathname as one loop element, including names containing spaces.
          It can include directories; with no match it remains literal unless nullglob or failglob changes that behaviour.
        points: 0.5

      - id: CR22
        type: multiple_choice
        difficulty: medium
        bloom: apply
        source: SEM02-q19
        question: Which Bash loop header reads each line from file.txt without stripping IFS whitespace or interpreting
          backslashes, including a non-empty final line without a newline?
        options:
          a: for line in file.txt; do ...; done
          b: while IFS= read -r line || [[ -n $line ]]; do ...; done < file.txt
          c: cat file.txt | for line; do ...; done
          d: read file.txt into line
        answer: b
        explanation: IFS= prevents read from trimming or splitting fields; -r keeps backslashes literal. The || condition
          processes a final non-empty fragment when read reports EOF. NUL bytes are outside this text-line contract.
        points: 0.5

      - id: CR23
        type: practical
        difficulty: hard
        bloom: analyse
