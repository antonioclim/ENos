          b: It runs restricted programs checked by a verifier for supported operations and access constraints
          c: It is a network packet format
          d: It is an on-disk filesystem
        answer: b
        explanation: eBPF supports uses such as tracing and packet processing without a traditional loadable module.
          Verification enforces constraints and reduces classes of faults, but verifier/runtime/helper defects and configuration
          risks remain; zero crash risk is not established.
        points: 0.75

