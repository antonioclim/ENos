  - name: "Memory Management"
    lectures: [9, 10]
    seminars: []
    question_count: 24
    
    questions:
      # --- Part 1: Paging, Segmentation (Lecture 09) ---
      - id: MM01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L09-q01"
        question: "What is a logical (virtual) address?"
        options:
          a: "Physical address in RAM"
          b: "Address generated by CPU, seen by process"
          c: "Address on disk"
          d: "IP address"
        answer: "b"
        explanation: "Logical address = address seen by program; translated by MMU to physical."
        points: 0.5

      - id: MM02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L09-q02"
        question: "What is paging?"
        options:
          a: "Dividing program into functions"
          b: "Dividing memory into fixed-size blocks (pages and frames)"
          c: "Memory compression"
          d: "Data encryption"
        answer: "b"
        explanation: "Paging: logical space into pages, physical memory into frames of same size."
        points: 0.5

      - id: MM03
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L09-q04"
        question: "What's the difference between internal and external fragmentation?"
        options:
          a: "Identical"
          b: "Internal: wasted within blocks. External: free space fragmented between blocks"
          c: "External doesn't exist"
          d: "Internal only on disk"
        answer: "b"
        explanation: "Internal: last frame partially used. External: free blocks too small."
        points: 0.5

      - id: MM04
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L09-q05
        question: In a simple paging model with one fixed page/frame size, why need the frames for one process not occupy
          a single contiguous physical range?
        options:
          a: Paging always compresses every page
          b: Each page can map to any suitable free frame independently
          c: Page tables eliminate all forms of physical-memory fragmentation
          d: A frame is larger than every possible page
        answer: b
        explanation: This removes the contiguous-allocation problem for individual pages in the model. It does not eliminate
          internal fragmentation or the need for contiguous memory when allocating huge pages or particular hardware
          buffers.
        points: 0.5

      - id: MM05
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L09-q07"
        question: "What does the MMU (Memory Management Unit) do?"
        options:
          a: "Manages network"
          b: "Translates logical addresses to physical in hardware"
          c: "Compiles programs"
          d: "Stores passwords"
        answer: "b"
        explanation: "MMU = hardware for address translation and protection checking."
        points: 0.5

      - id: MM06
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L09-q09
        question: For a full 32-bit byte-addressed virtual space with 4 KiB pages, how many entries would a complete
          single-level page table require?
        options:
          a: '1024'
          b: 2^20 = 1,048,576
          c: 2^32
          d: '4096'
        answer: b
        explanation: The page offset is 12 bits and the virtual page number is 20 bits. A multilevel or sparse implementation
          need not allocate all these leaf entries at once.
        points: 0.75

      - id: MM07
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: "L09-q10"
        question: "Why are multi-level page tables used?"
        options:
          a: "For speed"
          b: "To save memory: don't allocate entries for unused pages"
          c: "For security"
          d: "Not used in practice"
        answer: "b"
        explanation: "Multi-level: allocate tables only for used regions, not entire space."
        points: 0.75

      - id: MM08
        type: multiple_choice
        difficulty: hard
        bloom: apply
        source: L09-q12
        question: For virtual address 0x00003A7F with 4 KiB pages, what is the virtual page number?
        options:
          a: '0x3A7F'
          b: '0x3'
          c: '0xA7F'
          d: '0x3A'
        answer: b
        explanation: The offset is 0xA7F (the low 12 bits); 0x00003A7F >> 12 is 0x3. Leading zeroes would not change
          the numeric answer.
        points: 0.75

      # --- Part 2: Virtual Memory, TLB (Lecture 10) ---
      - id: MM09
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L10-q01
        question: What is virtual memory?
        options:
          a: Additional physical RAM installed in a machine
          b: An address-space abstraction mapping virtual addresses to underlying storage with access controls
          c: Only a CPU data cache
          d: Read-only firmware memory
        answer: b
        explanation: Virtual memory provides mappings and isolation/protection; it can exist without swap. Demand paging
          and backing some pages with files or swap are possible mechanisms, not the definition of virtual memory.
        points: 0.5

      - id: MM10
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L10-q02
        question: What is TLB (Translation Lookaside Buffer)?
        options:
          a: The entirety of main memory holding process data
          b: A hardware cache of virtual-to-physical address translations and related attributes
          c: A page-replacement algorithm
          d: Only a software table read directly on every access
        answer: b
        explanation: The TLB caches translation information used by the MMU. It is distinct from the complete page table
          and from the physical memory whose addresses are translated.
        points: 0.5

      - id: MM11
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L10-q03
        question: On a paged architecture such as x86, which description captures the scope of a page-fault exception?
        options:
          a: It is always an unrecoverable programming error
          b: A synchronous exception arising from a failed virtual-memory translation or protection check
          c: It is always a storage-device failure
          d: It is simply any TLB cache miss
        answer: b
        explanation: A handler may populate a demand-zero page, perform copy-on-write, load backed data or reject an
          illegal access. A missing TLB entry can be resolved by a page-table walk without a page fault, and not every
          page fault requires disk I/O.
        points: 0.5

      - id: MM12
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L10-q05"
        question: "What is Belady's anomaly?"
        options:
          a: "A hardware error"
          b: "More frames can cause more page faults for FIFO"
          c: "An optimal algorithm"
          d: "An optimisation"
        answer: "b"
        explanation: "Belady: FIFO can have more faults with more frames. LRU doesn't have this."
        points: 0.5

      - id: MM13
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L10-q06
        question: Why cannot the offline OPT page-replacement algorithm generally be implemented exactly for an unknown
          future runtime reference stream?
        options:
          a: Too slow
          b: Requires knowledge of future page accesses
          c: Consumes too much memory
          d: Doesn't work
        answer: b
        explanation: OPT needs the future reference sequence to evict the page whose next use is farthest away. It can
          be simulated on a supplied trace as a comparison bound; it cannot generally know an arbitrary future workload
          online.
        points: 0.5

      - id: MM14
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L10-q08
        question: What is thrashing?
        options:
          a: An optimisation that always reduces faults
          b: Excessive page faults and page movement leave little time for useful execution
          c: A sorting algorithm
          d: A network protocol error
        answer: b
        explanation: Thrashing describes severe memory-pressure behaviour with repeated eviction and reuse. Page replacement
          may involve storage, but it should not be equated with every instance of swapping or with whole-process swapping
          alone.
        points: 0.5

      - id: MM15
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L10-q10
        question: Why does working set model help prevent thrashing?
        options:
          a: Deletes pages
          b: Allocates enough frames for process's recent active pages
          c: Increases CPU speed
          d: Doesn't help
        answer: b
        explanation: A working-set estimate approximates recently active pages. Provisioning or admitting work according
          to that demand can reduce excessive replacement; changing future access patterns and shared pages still require
          care.
        points: 0.75

      - id: MM16
        type: multiple_choice
        difficulty: hard
        bloom: apply
        source: L10-q12
        question: Assume 100 MiB is available for the distinct working-set pages of 50 concurrently active processes,
          each needing 3 MiB. What follows from these numbers alone?
        options:
          a: All working sets fit with 50 MiB to spare
          b: The aggregate 150 MiB exceeds the budget, creating memory pressure and a risk of thrashing
          c: Every process automatically receives more physical memory
          d: The disk must become faster
        answer: b
        explanation: The model has a 50 MiB shortfall. The outcome depends on access patterns, reclaim, swap availability
          and admission/OOM policies; the arithmetic alone does not prove continuous swapping.
        points: 0.75

      - id: MM17
        type: short_answer
        difficulty: medium
        bloom: apply
        question: "What Linux command displays memory usage?"
        answer: "free"
        accept_alternatives:
          - "free -h"
          - "cat /proc/meminfo"
          - "vmstat"
          - "top"
        points: 0.5

      - id: MM18
        type: short_answer
        difficulty: medium
        bloom: apply
        question: Describe Linux page reclaim without assuming that every kernel and configuration uses a single textbook
          replacement algorithm.
        answer: Linux uses evolving LRU-related reclaim policies. Traditional reclaim uses active/inactive LRU lists;
          kernels built and configured for Multi-Gen LRU can use that alternative. The relevant version and runtime/build
          configuration must be stated; Linux is not universally the textbook Clock algorithm.
        accept_alternatives:
        - LRU-related reclaim, with traditional active/inactive lists or Multi-Gen LRU depending on the kernel and configuration
        points: 0.5
        explanation: The Multi-Gen LRU documentation describes an alternative LRU implementation with build and runtime
          controls. No kernel reclaim experiment is implied by this conceptual answer.

      - id: MM19
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: What does the 'dirty bit' in a page table entry indicate?
        options:
          a: The page necessarily contains an error
          b: The page has been written since the relevant dirty state was cleared
          c: The virtual mapping is necessarily illegal
          d: The page is currently being read
        answer: b
        explanation: Dirty state tracks modification. Evicting content that must be preserved may require writeback
          or another backing mechanism; discarded/unmapped data need not always be written to disk. Accessed/reference
          state is a separate concept.
        points: 0.5

      - id: MM20
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: What is demand paging?
        options:
          a: Loading every process page at startup
          b: Providing a page when an access first requires it rather than pre-populating all pages
          c: Deleting every unused virtual address
          d: Compressing every page
        answer: b
        explanation: Fault handling can allocate/zero a page or obtain its contents from backing storage. Demand paging
          does not require disk I/O on every first access.
        points: 0.5

      - id: MM21
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: In a page-table model with a separate present/resident bit and access-permission bits, what does present=1
          indicate for a leaf entry?
        options:
          a: The page is guaranteed to contain error-free data
          b: The entry supplies a resident physical-page mapping
          c: Every read, write and execute access is automatically permitted
          d: The page can never be evicted
        answer: b
        explanation: Presence does not by itself authorise an access; permissions and other checks still apply. Some
          texts use valid for legal address-space membership, others for a usable mapping, so the model must define
          the term. A non-present entry does not alone distinguish demand allocation from an illegal address.
        points: 0.5

      - id: MM22
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        question: Why may process-specific TLB entries need invalidation when switching address spaces on a CPU that
          cannot safely distinguish those entries with address-space tags?
        options:
          a: TLB is full
          b: Each process has its own address space and page table
          c: For security only
          d: It doesn't occur
        answer: b
        explanation: A virtual address can map differently in the next process. ASID/PCID tagging and architecture-specific
          rules can retain suitable entries safely; a complete unconditional flush is not required on every context
          switch.
        points: 0.75

      - id: MM23
        type: multiple_choice
        difficulty: hard
        bloom: understand
        question: What are huge pages (large pages) and their advantage?
        options:
          a: Pages whose contents are necessarily encrypted
          b: Pages larger than the base size, potentially covering more memory per TLB entry
          c: Pages guaranteed to make every memory access faster
          d: Pages that are always compressed
        answer: b
        explanation: For example, suitable x86-64 configurations support 2 MiB or 1 GiB pages. Coverage can reduce TLB
          pressure for appropriate workloads, while allocation constraints, internal fragmentation and other costs remain.
        points: 0.75

      - id: MM24
        type: multiple_choice
        difficulty: hard
        bloom: apply
        question: Given reference string 1,2,3,4,1,2,5,1,2,3,4,5 and three initially empty frames, use exact LRU, updating
          recency on every access. How many page faults occur?
        options:
          a: '8'
          b: '9'
          c: '10'
          d: '12'
        answer: c
        explanation: 'LRU trace: 1(F),2(F),3(F),4(F),1(F),2(F),5(F),1(H),2(H),3(F),4(F),5(F) = 10 faults.'
        points: 1.0


