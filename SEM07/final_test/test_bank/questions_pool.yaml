        points: 0.75

      - id: SY22
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: What is a barrier in parallel programming?
        options:
          a: A type of memory allocation
          b: A rendezvous where the defined participants wait until the required arrivals are reached
          c: Memory protection against every data race
          d: Thread termination
        answer: b
        explanation: A barrier coordinates its configured participants or arrival count. Other threads need not participate,
          and data accesses outside the barrier still need the appropriate memory/synchronisation rules.
        points: 0.5

      - id: SY23
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: What is a reader-writer lock advantage over mutex?
        options:
          a: It is always faster regardless of workload
          b: It permits multiple concurrent readers while excluding a conflicting writer
          c: It always occupies less memory
          d: It prevents every form of starvation
        answer: b
        explanation: Reader concurrency is a capability, not a guaranteed speed-up. Bookkeeping, write frequency and
          fairness policy affect its suitability.
        points: 0.5

      - id: SY24
        type: practical
        difficulty: hard
        bloom: create
        question: Write pseudocode for a producer in a bounded buffer of capacity N>0, initially empty, with mutex=1,
          empty=N, full=0 and in=0. The consumer uses the matching semaphore protocol; abstract wait/signal operations
          are atomic and do not fail.
        answer: |
          while (true) {
              item = produce();
              wait(empty);
              wait(mutex);
              buffer[in] = item;
              in = (in + 1) % N;
              signal(mutex);
              signal(full);
          }
        points: 1.5
        explanation: The producer waits for a free slot before acquiring the buffer mutex, avoiding holding that mutex
          while waiting for space. This is algorithmic pseudocode, not a complete POSIX error-handling implementation.


