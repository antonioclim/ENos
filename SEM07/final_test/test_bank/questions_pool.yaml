        options:
          a: Only memory
          b: memory controller for RAM, cpu controller for quota
          c: Only cpu
          d: Cannot limit
        answer: b
        explanation: For example, memory.max=536870912 bytes and cpu.max='50000 100000' limit the configured group to
          50,000 microseconds per 100,000-microsecond period. CPU bandwidth is aggregate, not a promise of a particular
          core or instantaneous utilisation; availability and effective limits depend on the hierarchy. No cgroup write
          is required for the answer.
        points: 0.75

