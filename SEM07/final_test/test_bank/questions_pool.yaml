        answer: |
          log() {
              if (( $# != 2 )); then
                  printf 'Usage: log LEVEL MESSAGE\n' >&2
                  return 2
              fi
              local level="$1" msg="$2" stamp
              stamp=$(date '+%Y-%m-%d %H:%M:%S') || return
              printf '[%s] [%s] %s\n' "$stamp" "$level" "$msg"
          }
