        question: On Linux, a server has many mostly idle connections, non-blocking handlers and a requirement to bound
          worker-thread count. Which design matches those requirements?
        options:
          a: A dedicated permanently blocked thread for every connection
          b: An epoll-based event loop with a bounded worker pool for appropriate work
          c: A dedicated process for every connection regardless of cost
          d: A single blocking request handler that stops servicing all other connections
        answer: b
        explanation: This structure fits the stated constraints. It does not prove superiority for every 10,000-connection
          workload; actual work per event, blocking calls, resource limits and measurements still matter.
        points: 0.75

