      # --- Network (Lecture 15) ---
      - id: NA01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L15-q01
        question: For Internet communication, what is a socket in the operating-system API?
        options:
          a: A network cable
          b: An operating-system communication endpoint with a protocol-specific address and state
          c: A physical server
          d: An encryption algorithm
        answer: b
        explanation: An Internet socket can be bound to a local address/port; a connected TCP flow is distinguished
          using protocol and both endpoint addresses/ports. Local IP:port alone does not uniquely identify every connected
          socket. Other socket families, such as Unix-domain sockets, use different addressing.
        points: 0.5

      - id: NA02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L15-q02
        question: Main difference between TCP and UDP?
        options:
          a: TCP is older
          b: 'TCP: connection-oriented, reliable. UDP: connectionless, best-effort'
          c: UDP is more secure
          d: No difference
        answer: b
        explanation: TCP provides an ordered reliable byte-stream service with connection state, though connections
          can fail. UDP provides datagrams without built-in delivery/order guarantees; applications may add such mechanisms.
          Relative latency and throughput require workload-specific evidence.
        points: 0.5

      - id: NA03
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L15-q03
        question: For an IPv4/IPv6 socket, what does bind() associate with the socket?
        options:
          a: Connects to server
          b: Associates socket with local IP and port
          c: Sends data
          d: Closes connection
        answer: b
        explanation: bind selects a local protocol address, commonly an IP address and port for Internet sockets. Clients
          and UDP applications can also bind; it is not restricted to listening TCP servers.
        points: 0.5

      - id: NA04
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L15-q04
        question: For a conventional TCP listening socket, how do listen() and a successful accept() differ?
        options:
          a: To send data
          b: 'listen(): marks passive. accept(): accepts connections, creates new socket per client'
          c: For encryption
          d: To close connection
        answer: b
        explanation: listen marks the socket as passive. A successful accept returns a new connected socket while the
          listener remains available. A blocking accept may wait; a non-blocking call can report that no connection
          is ready, and either form can fail.
        points: 0.5

      - id: NA05
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L15-q05
        question: What is I/O multiplexing with select()/poll()/epoll()?
        options:
          a: Creating threads
          b: Single thread monitors multiple sockets for I/O events
          c: Data compression
          d: Connection encryption
        answer: b
        explanation: Readiness/event notification allows one thread to monitor multiple descriptors. Throughput, latency
          and supported connection counts depend on the implementation, event handling, memory and workload.
        points: 0.5

      - id: NA06
