        options:
          a: ls is unnecessary
          b: Unquoted variables can cause word splitting and glob expansion issues
          c: rm doesn't work in loops
          d: Missing shebang
        answer: b
        explanation: Unquoted expansions split and glob; parsing ls output also loses filename boundaries. The rm argument
          is not anchored to input_dir, and leading '-' may be treated as an option. Use a validated directory, filename-safe
          iteration, quoted paths and --, with explicit preview/ownership boundaries before removal.
        points: 0.75


