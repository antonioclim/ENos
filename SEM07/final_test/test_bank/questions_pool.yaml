# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORY 1: SHELL FUNDAMENTALS
# Sources: SEM01, Lectures 1-2
# ═══════════════════════════════════════════════════════════════════════════════

categories:

  - name: "Shell Fundamentals"
    lectures: [1, 2]
    seminars: [1]
    question_count: 24
    
    questions:
      # --- Original SEM07 Questions ---
      - id: SF01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        question: "Which command displays the current working directory?"
        options:
          a: "cd"
          b: "pwd"
          c: "ls"
          d: "dir"
        answer: "b"
        points: 0.5
        
      - id: SF02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        question: "What does the command 'ls -la' display?"
        options:
          a: "Only hidden files"
          b: "Only directories"
          c: "All files including hidden, in long format"
          d: "Only regular files"
        answer: "c"
        points: 0.5
        
      - id: SF03
        type: short_answer
        difficulty: medium
        bloom: apply
        question: "Write a command to create the directory structure 'project/src/main' in one command."
        answer: "mkdir -p project/src/main"
        accept_alternatives:
          - "mkdir --parents project/src/main"
        points: 1.0
        
      - id: SF04
        type: short_answer
        difficulty: medium
        bloom: understand
        question: In Bash, for a variable VAR that is initially unset, how do 'export VAR=value' and 'VAR=value' differ
          for subsequently executed external programs and a (...) subshell?
        answer: Both assign VAR in the current shell. export also marks it for inclusion in the environment of subsequently
          executed programs. Without export, a newly executed Bash does not receive VAR through the environment, but
          a (...) Bash subshell inherits a copy of the shell state, including unexported variables. Assignment alone
          does not remove an export attribute that was already set.
        keywords:
        - child
        - process
        - subshell
        - environment
        points: 1.0

      # --- From SEM01 Quiz ---
      - id: SF05
        type: multiple_choice
        difficulty: easy
        bloom: understand
        source: "SEM01-q03"
        question: "What is the difference between a shell and a terminal?"
        options:
          a: "They are the same thing"
          b: "The shell interprets commands; the terminal is the interface to access the shell"
          c: "The terminal interprets commands; the shell displays them"
          d: "The shell is hardware; the terminal is software"
        answer: "b"
        explanation: "Terminal = interface (window, keyboard, display). Shell = interpreter (Bash, Zsh)."
        points: 0.5

      - id: SF06
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: SEM01-q05
        question: 'In Bash, run: unset VAR; VAR=secret; (printf ''%s\n'' "$VAR"). What does the (...) subshell print?'
        options:
          a: The variable is accessible with value 'secret'
          b: The variable is undefined
          c: The variable has value 'VAR'
          d: 'Error: variable not exported'
        answer: a
        explanation: Parentheses create a Bash subshell environment copied from the shell, so the unexported variable
          is retained. A newly executed bash -c receives exported variables through its environment; that is a different
          case.
        points: 0.5

      - id: SF07
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "SEM01-q01"
        question: "What does the pwd command do?"
        options:
          a: "Changes the current directory"
          b: "Displays the current working directory"
          c: "Creates a new directory"
          d: "Lists directory contents"
        answer: "b"
        explanation: "pwd = Print Working Directory, displays the absolute path of the current location."
        points: 0.5

      - id: SF08
        type: multiple_choice
        difficulty: medium
        bloom: apply
        source: "SEM01-q06"
        question: "Which command creates nested directories /home/user/projects/new/src in one step?"
        options:
          a: "mkdir /home/user/projects/new/src"
          b: "mkdir -p /home/user/projects/new/src"
          c: "mkdir -r /home/user/projects/new/src"
          d: "mkdirs /home/user/projects/new/src"
        answer: "b"
        explanation: "-p (parents) creates intermediate directories if they don't exist."
        points: 0.5

      - id: SF09
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: SEM01-q07
        question: Assume script.sh is a readable, executable Bash script with a valid shebang, in the current directory.
          How does 'source ./script.sh' differ from './script.sh'?
        options:
          a: They run in the same shell environment
          b: source executes in the current shell; ./script.sh executes through its interpreter in a separate process
          c: source always runs faster
          d: source requires execute permission
        answer: b
        explanation: Sourcing can change the caller's variables and directory. Executing the script leaves those changes
          in the separate process; its initial environment contains exported variables, not every unexported shell variable.
        points: 0.5

      - id: SF10
        type: multiple_choice
        difficulty: medium
        bloom: apply
        source: "SEM01-q08"
        question: "Which brace expansion creates files file1.txt, file2.txt, file3.txt?"
        options:
          a: "touch file[1-3].txt"
          b: "touch file{1..3}.txt"
          c: "touch file(1,2,3).txt"
          d: "touch file<1-3>.txt"
        answer: "b"
        explanation: "{1..3} is brace expansion generating sequence 1, 2, 3."
        points: 0.5

      - id: SF11
        type: multiple_choice
        difficulty: medium
        bloom: analyse
        source: "SEM01-q09"
        question: "What is the output of: VAR='$HOME'; echo $VAR?"
        options:
          a: "/home/user (the home directory)"
          b: "$HOME (literal string)"
          c: "Error: invalid syntax"
          d: "Empty string"
        answer: "b"
        explanation: "Single quotes prevent variable expansion; $HOME remains literal."
        points: 0.5

      - id: SF12
        type: multiple_choice
        difficulty: easy
        bloom: understand
        source: SEM01-q10
        question: What does exit code 0 indicate?
        options:
          a: Error
          b: Success
          c: Warning
          d: Interrupted
        answer: b
        explanation: By Unix convention, zero reports success. A non-zero status reports another outcome defined by
          the command, such as grep finding no match or a command failing.
        points: 0.5

      - id: SF13
        type: multiple_choice
        difficulty: medium
        bloom: apply
        source: SEM01-q11
        question: In Bash with dotglob disabled, which glob matches non-hidden names ending in .txt in the current directory?
        options:
          a: '[*.txt]'
          b: '*.txt'
          c: ?.txt
          d: '{.txt}'
        answer: b
        explanation: '*.txt matches non-hidden directory entries ending in .txt. It does not by itself restrict them
          to regular files, and an unmatched pattern normally remains literal unless nullglob or failglob is set.'
        points: 0.5

      - id: SF14
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: SEM01-q12
        question: In Bash with nounset disabled, DIR is unset or empty. GNU rm receives 'rm -rf $DIR' with no other
          words. What happens?
        options:
          a: 'No files are removed: rm -rf receives no file operands and returns success'
          b: It automatically deletes the current directory
          c: It automatically substitutes / for DIR
          d: It deletes every hidden file
        answer: a
        explanation: The empty unquoted expansion disappears. GNU rm -f accepts missing operands; it does not infer
          . or /. A different expression such as "$DIR"/* may expand to /* when DIR is empty. Non-empty unquoted values
          also introduce word splitting, globbing and option risks. Validate the intended path and use quoting and --;
          do not test destructive examples against real directories.
        points: 0.75

      - id: SF15
        type: multiple_choice
        difficulty: hard
        bloom: evaluate
        source: SEM01-q13
        question: |
          Analyse this backup script:
          #!/bin/bash
          backup_dir=$1
          tar czf backup.tar.gz $backup_dir
          What security problem exists?
        options:
          a: The script is too slow
          b: Unquoted variable $backup_dir can break with spaces or malicious names
          c: tar doesn't support gzip
          d: There is no security problem
        answer: b
        explanation: An unquoted value can split into several arguments and expand wildcard characters; leading '-'
          can also be interpreted as an option. Quote validated paths, separate options with -- and choose an archive
          outside its source tree. Ordinary variable expansion does not recursively execute shell syntax contained in
          the value.
        points: 0.75

      - id: SF16
        type: short_answer
        difficulty: hard
        bloom: create
        source: SEM01-q14
        question: In an interactive Bash shell, define alias backup to archive the current directory to a timestamped
          .tar.gz in its writable parent directory. Assume a non-root source directory and that the generated output
          name does not already exist. Check tar's exit status before reporting success.
        answer: alias backup='tar -czf "../backup_$(date +%Y%m%d_%H%M%S).tar.gz" -- .'
        accept_alternatives:
        - alias backup='tar -czf "../backup_$(date +%F_%H%M%S).tar.gz" -- .'
        keywords:
        - alias
        - tar
        - date
        - czf
        points: 1.5
        explanation: The sibling output is outside the directory being archived, avoiding self-inclusion and directory-metadata
          changes caused by an archive created inside its own input. This is a teaching alias under the stated no-collision
          assumption, not a backup retention or integrity policy.

      - id: SF17
        type: multiple_choice
        difficulty: easy
        bloom: remember
        question: Under the Filesystem Hierarchy Standard, where are command-line programs installed locally by the
          system administrator commonly placed?
        options:
          a: /bin
          b: /usr/local/bin
          c: /etc
          d: /var
        answer: b
        explanation: /usr/local/bin is for locally installed executables outside the distribution's ordinary package-managed
          paths. This is distinct from per-user locations such as ~/.local/bin.
        points: 0.5

      - id: SF18
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: In the historical, unmerged Filesystem Hierarchy Standard layout, what distinguishes /bin from /usr/bin?
        options:
          a: They are always different names for exactly the same directory
          b: /bin holds essential command binaries; /usr/bin holds most other user commands
          c: /usr/bin is for root only
          d: /bin stores only configuration files
        answer: b
        explanation: This describes the historical split. On a merged-/usr system, /bin is commonly a symlink to /usr/bin,
          so the distinction is not a universal description of the installed layout.
        points: 0.5

      - id: SF19
        type: short_answer
        difficulty: medium
        bloom: apply
        question: In Bash, report how python3 is resolved (for example alias, function, builtin or executable path).
          Give a command that reports its type and resolution.
        answer: type python3
        accept_alternatives:
        - type -a python3
        - command -V python3
        points: 1.0
        explanation: type and command -V describe command resolution. which, whereis and command -v alone do not all
          meet the requested classification contract.

      - id: SF20
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: "What does the shebang line '#!/usr/bin/env bash' do?"
        options:
          a: "Sets an environment variable"
          b: "Specifies the interpreter using the PATH to find bash"
          c: "Comments out the first line"
          d: "Enables debugging"
        answer: "b"
        explanation: "Using env makes the script more portable across systems with bash in different locations."
        points: 0.5

      - id: SF21
        type: multiple_choice
        difficulty: medium
        bloom: apply
        question: "How do you make a script executable?"
        options:
          a: "touch script.sh"
          b: "chmod +x script.sh"
          c: "chown script.sh"
          d: "exec script.sh"
        answer: "b"
        explanation: "chmod +x adds execute permission to the file."
        points: 0.5

      - id: SF22
        type: short_answer
        difficulty: hard
        bloom: analyse
        question: In Bash with the default IFS, var contains repeated spaces. Explain why echo $var and echo "$var"
          can differ, and name a safer command for printing arbitrary variable text.
        answer: The unquoted expansion undergoes word splitting and pathname expansion; echo joins the resulting arguments
          with spaces. Quoting preserves var as one argument, but echo can still interpret options or escapes depending
          on its implementation and settings. Use printf '%s\n' "$var" for a predictable text-plus-newline output.
        keywords:
        - word splitting
        - quotes
        - spaces
        - preserve
        points: 1.0

      - id: SF23
        type: multiple_choice
        difficulty: easy
        bloom: remember
        question: For a normal interactive Bash login shell, which listed user file is read first if it exists and is
          readable?
        options:
          a: .bashrc
          b: .bash_profile
          c: .bash_history
          d: .bash_logout
        answer: b
        explanation: After /etc/profile, Bash reads the first readable file among ~/.bash_profile, ~/.bash_login and
          ~/.profile. An interactive non-login shell normally reads ~/.bashrc.
        points: 0.5

      - id: SF24
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: "What is the purpose of the PATH environment variable?"
        options:
          a: "Stores the current directory"
          b: "Lists directories where the shell searches for executables"
          c: "Contains the home directory path"
          d: "Defines file permissions"
        answer: "b"
        explanation: "PATH is a colon-separated list of directories searched when running commands."
        points: 0.5


# ═══════════════════════════════════════════════════════════════════════════════
# CATEGORY 2: CONTROL OPERATORS AND REDIRECTION
# Sources: SEM02, Lectures 2-3
# ═══════════════════════════════════════════════════════════════════════════════

  - name: "Control Operators and Redirection"
    lectures: [2, 3]
    seminars: [2]
    question_count: 26
    
    questions:
      # --- Original SEM07 Questions ---
      - id: CR01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        question: "What does '&&' do in Bash?"
        options:
          a: "Runs both commands simultaneously"
          b: "Runs second command only if first succeeds"
          c: "Runs second command only if first fails"
          d: "Combines output of both commands"
        answer: "b"
        points: 0.5
        
      - id: CR02
        type: multiple_choice
        difficulty: medium
        bloom: understand
        question: "What does 'command 2>&1' do?"
        options:
          a: "Redirects stdout to stderr"
          b: "Redirects stderr to stdout"
          c: "Discards stderr"
          d: "Duplicates the command"
        answer: "b"
        points: 0.5
        
      - id: CR03
        type: short_answer
        difficulty: medium
        bloom: apply
        question: "Write a command that saves both stdout and stderr to 'output.log'."
        answer: "command > output.log 2>&1"
        accept_alternatives:
          - "command &> output.log"
          - "command >& output.log"
        points: 1.0
        
      - id: CR04
        type: practical
        difficulty: hard
        bloom: apply
        question: As a written Bash exercise, give a one-liner that pings google.com once, prints 'Online' if ping succeeds
          and 'Offline' if it fails. The labels describe this ping result only; do not execute network probes during
          the written task.
        answer: if ping -c 1 google.com >/dev/null 2>&1; then printf '%s\n' Online; else printf '%s\n' Offline; fi
        points: 1.5
        explanation: The branch depends directly on ping's status. An && ... || ... chain could also run the final branch
          if the success-printing command failed. A failed ping does not establish that every network service is unavailable.

      # --- From SEM02 Quiz ---
      - id: CR05
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "SEM02-q01"
        question: "What does the && operator do in 'cmd1 && cmd2'?"
        options:
          a: "Runs cmd2 regardless of cmd1's result"
          b: "Runs cmd2 in background"
          c: "Runs cmd2 only if cmd1 succeeds (exit code 0)"
          d: "Runs cmd2 only if cmd1 fails"
        answer: "c"
        explanation: "&& is logical AND - second command runs only on success."
        points: 0.5

      - id: CR06
        type: multiple_choice
        difficulty: easy
        bloom: understand
        source: "SEM02-q02"
        question: "What does the single & do in 'command &'?"
        options:
          a: "Logical AND"
          b: "Runs the command in the background"
          c: "Redirects stderr"
          d: "Waits for the command"
        answer: "b"
        explanation: "& at the end backgrounds the process, returning control immediately."
        points: 0.5

      - id: CR07
        type: multiple_choice
        difficulty: medium
        bloom: analyse
        source: SEM02-q03
        question: 'Assume Bash commands are unaliased and test is an existing directory. What is printed to standard
          output by: mkdir test && echo ''created'' || echo ''failed''?'
        options:
          a: '''created'''
          b: '''failed'''
          c: '''created'' then ''failed'''
          d: No output
        answer: b
        explanation: mkdir fails because the directory already exists and emits a diagnostic to stderr. The && branch
          is skipped and stdout contains failed.
        points: 0.5

      - id: CR08
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: SEM02-q04
        question: In Bash with pipefail disabled, immediately after 'false | true', what is the value of $?
        options:
          a: 1 (from false)
          b: 0 (from true)
          c: Undefined
          d: Error
        answer: b
        explanation: Without pipefail, $? reflects only the last command's exit code.
        points: 0.75

      - id: CR09
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: SEM02-q05
        question: What is the difference between { } and ( ) for command grouping?
        options:
          a: They are identical
          b: '{ } runs in the current shell; ( ) runs in a subshell'
          c: ( ) always runs faster
          d: '{ } always starts a new external Bash process'
        answer: b
        explanation: A standalone brace group executes in the current shell environment; a parenthesised group uses
          a subshell. Braces are reserved words with separator requirements, while parentheses are operators. A pipeline
          or background context can impose an additional subshell on a brace group.
        points: 0.5

      - id: CR10
        type: multiple_choice
        difficulty: easy
        bloom: understand
        source: SEM02-q06
        question: For an existing writable regular file, with Bash noclobber disabled, how do > and >> differ?
        options:
          a: '> is faster'
          b: '> overwrites; >> appends'
          c: '>> overwrites; > appends'
          d: They are identical
        answer: b
        explanation: '> truncates and writes; >> adds to the end of the file.'
        points: 0.5

      - id: CR11
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: "SEM02-q07"
        question: "What is the difference between 'cmd > file 2>&1' and 'cmd 2>&1 > file'?"
        options:
          a: "They are identical"
          b: "First: both stdout and stderr to file. Second: stderr to original stdout, stdout to file"
          c: "First is invalid syntax"
          d: "Second is invalid syntax"
        answer: "b"
        explanation: "Redirection order matters. In the second, 2>&1 copies stdout before it's redirected."
        points: 0.75

      - id: CR12
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: SEM02-q08
        question: If opening /dev/null for the redirection succeeds, what does 'command 2>/dev/null' do?
        options:
          a: Discards all output
          b: Discards only stderr, preserving exit code
          c: Saves stderr to a file
          d: Converts stderr to stdout
        answer: b
        explanation: It sends stderr to /dev/null. Hiding diagnostics does not turn a command failure into success;
          the command's exit status remains available.
        points: 0.5

      - id: CR13
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "SEM02-q09"
        question: "What does '&>' do in Bash?"
        options:
          a: "Runs command in background"
          b: "Redirects both stdout and stderr to a file"
          c: "Logical AND then redirect"
          d: "Invalid syntax"
        answer: "b"
        explanation: "&> is shorthand for > file 2>&1, redirecting both streams."
        points: 0.5

      - id: CR14
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "SEM02-q10"
        question: "What does the tee command do?"
        options:
          a: "Combines two files"
          b: "Reads stdin and writes to both stdout and a file"
          c: "Compresses data"
          d: "Splits a file"
        answer: "b"
        explanation: "tee duplicates input to stdout and file(s), useful for logging while displaying."
        points: 0.5

      - id: CR15
        type: multiple_choice
        difficulty: medium
        bloom: apply
        source: SEM02-q11
        question: Which option in sort selects the sorting key by field?
        options:
          a: -n
          b: -k
          c: -r
          d: -u
        answer: b
        explanation: -k specifies a sort key. For example, -k2,2 restricts the key to field 2; -k2 extends from field
          2 to the end of the line.
        points: 0.5

      - id: CR16
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: SEM02-q12
        question: Why is sorting commonly placed before uniq when removing every duplicate from an arbitrarily ordered
          list?
        options:
          a: uniq is faster on sorted input
          b: uniq only removes adjacent duplicates
          c: uniq requires sorted input
          d: uniq sorts automatically
        answer: b
        explanation: uniq compares adjacent lines. Sorting groups equal lines together; it is unnecessary if duplicates
          are already adjacent and is not a requirement for running uniq.
        points: 0.5

      - id: CR17
        type: multiple_choice
        difficulty: easy
        bloom: apply
        source: SEM02-q14
        question: For ASCII input in the C locale, which command translates lowercase a-z to uppercase A-Z?
        options:
          a: sed 's/a-z/A-Z/'
          b: tr 'a-z' 'A-Z'
          c: cut -u
          d: awk '{upper}'
        answer: b
        explanation: tr translates character sets; a-z to A-Z converts case.
        points: 0.5

      - id: CR18
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: SEM02-q15
        question: Which command counts newline characters in a text file?
        options:
          a: count file
          b: wc -l file
          c: lines file
          d: cat -n file
        answer: b
        explanation: wc -l counts newlines. A final non-empty fragment without a trailing newline is not counted; -w
          counts words and -c counts bytes.
        points: 0.5

      - id: CR19
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "SEM02-q16"
        question: "What is the syntax for a for loop in Bash?"
        options:
          a: "for (i=0; i<10; i++)"
          b: "for i in {1..10}; do ... done"
          c: "foreach i in 1..10"
          d: "for i = 1 to 10"
        answer: "b"
        explanation: "Bash uses 'for var in list; do commands; done' syntax."
        points: 0.5

      - id: CR20
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "SEM02-q17"
        question: "What is the difference between 'break' and 'exit' in a loop?"
        options:
          a: "They are identical"
          b: "break exits the loop; exit terminates the script"
          c: "exit exits the loop; break terminates the script"
          d: "Both terminate the script"
        answer: "b"
        explanation: "break continues after the loop; exit ends the entire script/shell."
