# CATEGORY 8: DEADLOCK
# Sources: Lecture 8
# ═══════════════════════════════════════════════════════════════════════════════

  - name: "Deadlock"
    lectures: [8]
    seminars: []
    question_count: 12
    
    questions:
      - id: DL01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L08-q01"
        question: "What is a deadlock?"
        options:
          a: "A computer virus"
          b: "Processes mutually block each other, waiting for resources held by others"
          c: "A compilation error"
          d: "A type of memory"
        answer: "b"
        explanation: "Deadlock = impasse: each waits for resource held by another in the group."
        points: 0.5

      - id: DL02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L08-q02"
        question: "What are the 4 Coffman conditions for deadlock?"
        options:
          a: "Read, write, execute, delete"
          b: "Mutual exclusion, hold and wait, no preemption, circular wait"
          c: "Lock, unlock, signal, wait"
          d: "Create, destroy, modify, access"
        answer: "b"
        explanation: "All 4 must be true simultaneously for deadlock to occur."
        points: 0.5

      - id: DL03
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L08-q03"
        question: "What is a Resource Allocation Graph (RAG)?"
        options:
          a: "A sorting algorithm"
          b: "Graph showing allocation and request relationships between processes and resources"
          c: "A type of memory"
          d: "A network protocol"
        answer: "b"
        explanation: "RAG: nodes = processes/resources, edges = allocations/requests. Cycle indicates potential deadlock."
        points: 0.5

      - id: DL04
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L08-q04"
        question: "How can 'circular wait' be prevented?"
        options:
          a: "Encrypting resources"
          b: "Imposing total order on resource acquisition"
          c: "Increasing memory"
          d: "Disabling interrupts"
        answer: "b"
        explanation: "If all acquire resources in same order, cycle cannot form."
        points: 0.5

      - id: DL05
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L08-q06
        question: What is a 'safe' state in Banker's Algorithm?
        options:
          a: System has no viruses
          b: Exists an execution sequence where all processes can complete
          c: Memory is sufficient
          d: CPU is not overloaded
        answer: b
        explanation: Given available resources, current allocations and declared maximum claims, a safe sequence allows
          each process in turn to obtain its remaining claim, complete and release resources. It is not a malware or
          general reliability guarantee.
        points: 0.5

      - id: DL06
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L08-q07
        question: Which prerequisite can limit the applicability of Banker's Algorithm to workloads with unpredictable
          resource demand?
        options:
          a: Too simple
          b: Requires a priori knowledge of maximum resource requirements
          c: Doesn't work on multi-core
          d: Consumes too much memory
        answer: b
        explanation: The algorithm requires bounds on maximum claims before making its safety decisions. Whether this
          and its computational cost are acceptable depends on the resource-management setting.
        points: 0.5

      - id: DL07
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L08-q08"
        question: "Difference between deadlock prevention and avoidance?"
        options:
          a: "Identical"
          b: "Prevention permanently eliminates one condition; avoidance dynamically checks each request"
          c: "Prevention is slower"
          d: "Avoidance doesn't work"
        answer: "b"
        explanation: "Prevention: structurally impossible. Avoidance: permits only if system stays safe."
        points: 0.5

      - id: DL08
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L08-q09
        question: In the classical resource-allocation graph with one instance of each non-preemptable exclusive resource
          and blocking resource requests, what does a directed cycle establish?
        options:
          a: Guaranteed good performance
          b: Deadlock among the processes in the cycle
          c: That no process holds a resource
          d: That every request can immediately be granted
        answer: b
        explanation: Under the stated single-instance model, the cycle establishes deadlock. With multiple instances,
          a cycle alone is generally not sufficient.
        points: 0.75

      - id: DL09
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: "L08-q10"
        question: "Why can resource preemption be impossible for certain resources?"
        options:
          a: "Always possible"
          b: "Some resources cannot be taken without corrupting state"
          c: "Preemption is too fast"
          d: "Requires special hardware"
        answer: "b"
        explanation: "Non-preemptable: printer mid-print, mutexes; cannot take without losing work."
        points: 0.75

      - id: DL10
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L08-q11
        question: What trade-off characterises a strategy that permits deadlocks, detects them and then recovers?
        options:
          a: It has no overhead or recovery cost
          b: It pays for detection and may lose work or require rollback/termination during recovery
          c: It is always better than prevention
          d: It guarantees deadlocks can never form
        answer: b
        explanation: Detection frequency, resource use and recovery policy determine the costs. The strategy does not
          have a universal overhead advantage over prevention or avoidance.
        points: 0.75

      - id: DL11
        type: multiple_choice
        difficulty: hard
        bloom: apply
        source: L08-q12
        question: Two processes need exclusive access to locks A and B, which must be retained. P1 acquires A then B;
          P2 acquires B then A. Which change prevents circular wait for these locks?
        options:
          a: Use more locks
          b: 'Both acquire in same order: A then B'
          c: Remove locks
          d: Increase P1's priority
        answer: b
        explanation: Consistent global order (A < B) eliminates circular wait.
        points: 0.75

      - id: DL12
        type: short_answer
        difficulty: medium
        bloom: apply
        question: Name one method to recover from deadlock.
        answer: Process termination
        accept_alternatives:
        - Kill process
        - Resource preemption
        - Rollback
        - Checkpoint and restart
        points: 0.5
        explanation: Recovery can terminate selected processes or, when state can be safely restored, use preemption/rollback.
          These are conditional mechanisms; arbitrary resource preemption is not always possible and may lose work.


