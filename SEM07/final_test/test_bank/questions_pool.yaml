          an abnormal child termination. No privileged or network operation is required.
        answer: |
          #include <errno.h>
          #include <stdio.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>

          int main(void) {
              pid_t pid = fork();
              if (pid < 0) { perror("fork"); return 1; }
              if (pid == 0) {
                  execlp("ls", "ls", "-l", (char *)NULL);
                  perror("execlp");
                  _exit(127);
              }
              int status;
              while (waitpid(pid, &status, 0) < 0) {
                  if (errno == EINTR) continue;
                  perror("waitpid");
                  return 1;
              }
              return WIFEXITED(status) ? WEXITSTATUS(status) : 1;
          }
        points: 1.5
        explanation: exec returns only on failure. _exit avoids a failed child continuing into parent control flow or
          flushing inherited stdio buffers. The single-threaded precondition avoids claiming this diagnostic pattern
          is safe after fork from an arbitrary multithreaded process.


