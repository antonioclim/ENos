    questions:
      # --- Part 1: Inode, Pointers (Lecture 11) ---
      - id: FS01
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L11-q01
        question: What is an inode?
        options:
          a: A type of processor
          b: Data structure storing file metadata (permissions, size, pointers to blocks)
          c: A directory
          d: A type of network
        answer: b
        explanation: An inode represents a filesystem object and typically holds metadata such as ownership, mode, size
          and block/extent mapping information. Names are held by directory entries; exact inode and extended-metadata
          layouts depend on the filesystem.
        points: 0.5

      - id: FS02
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: "L11-q02"
        question: "What does an inode NOT contain?"
        options:
          a: "File permissions"
          b: "File name"
          c: "File size"
          d: "Pointers to data blocks"
        answer: "b"
        explanation: "Name is stored in directory, not inode. Inode identified by number."
        points: 0.5

      - id: FS03
        type: multiple_choice
        difficulty: easy
        bloom: remember
        source: L11-q03
        question: What is a hard link?
        options:
          a: A copy of the file
          b: Directory entry pointing to same inode as another file
          c: A symbolic link
          d: A network connection
        answer: b
        explanation: Hard links are names referring to the same inode. Removing a name reduces the link count; data
          cannot be reclaimed merely because that count reaches zero while open references still keep the file alive.
        points: 0.5

      - id: FS04
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L11-q04
        question: In a filesystem using fixed-size inodes with direct and indirect block pointers, why are indirect
          pointers useful for large files?
        options:
          a: They encrypt every data block
          b: They address more data blocks through additional pointer blocks without enlarging every inode
          c: They allow a mathematically unlimited file size
          d: They remove the need to store block mappings
        answer: b
        explanation: The maximum remains finite and depends on pointer width, block size, number of levels and other
          filesystem limits. Small files can use direct pointers without the extra levels.
        points: 0.5

      - id: FS05
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: "L11-q05"
        question: "What's the difference between hard link and symbolic link?"
        options:
          a: "Identical"
          b: "Hard: same inode. Symlink: separate file containing path"
          c: "Symlink is faster"
          d: "Hard link works across filesystems"
        answer: "b"
        explanation: "Hard: shares inode, can't cross filesystem. Symlink: independent path file."
        points: 0.5

      - id: FS06
        type: multiple_choice
        difficulty: medium
        bloom: understand
        source: L11-q06
        question: What happens when unlink removes one ordinary hard-link name for a regular file?
        options:
          a: Every hard link is removed
          b: The link count decreases; content remains while any link or open reference keeps the file alive
          c: POSIX unlink necessarily moves the file to a desktop Trash folder
          d: The inode is duplicated
        answer: b
        explanation: After the last name is removed, an open descriptor can still access the file. Reclamation waits
          until the remaining references are released, subject to the filesystem's implementation.
        points: 0.5

      - id: FS07
        type: multiple_choice
        difficulty: hard
        bloom: analyse
        source: L11-q09
        question: An abstract inode has 12 direct pointers, one single-indirect pointer and one double-indirect pointer.
          Blocks are 4 KiB; pointers are 4 bytes. Ignoring other file-size limits, what is the maximum addressable data
          size approximately?
        options:
          a: 48 KiB
          b: 4 GiB
          c: 4 TiB
          d: 12 KiB
        answer: b
        explanation: Each pointer block holds 1024 addresses. Capacity is (12 + 1024 + 1024^2) × 4096 = 4,299,210,752
          bytes, about 4.004 GiB. Pointer blocks themselves are metadata, not additional user-file bytes.
        points: 0.75

