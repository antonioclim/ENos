<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" role="img" xml:lang="en" aria-labelledby="sem04-script-structure-title sem04-script-structure-desc">
  <title id="sem04-script-structure-title">An Organised Bash Script</title>
  <desc id="sem04-script-structure-desc">A script identifies its interpreter, sets up and validates input, parses arguments, defines functions, runs its main work and reports results. Optional style preferences are distinct from syntax requirements; error handling must be tested.</desc>
  <defs>
    <marker id="sem04-script-structure-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="650" fill="#f8fafc"/>
  <text x="440.0" y="30" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-1">An Organised Bash Script</text>
  <rect x="25" y="60" width="600" height="77" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="83" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-2">SHEBANG</text>
  <text x="325" y="105" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-3">#!/bin/bash</text>
  <path d="M 325 137 L 325 150" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-script-structure-arrow)"/>
  <rect x="25" y="151" width="600" height="77" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="174" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-4">SETUP AND VALIDATION</text>
  <text x="325" y="196" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-5">set -euo pipefail  # optional policy; understand exceptions</text>
  <text x="325" y="213" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-6">readonly SCRIPT_NAME=${0##*/}</text>
  <path d="M 325 228 L 325 241" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-script-structure-arrow)"/>
  <rect x="25" y="242" width="600" height="77" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="265" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-7">PARSE ARGUMENTS</text>
  <text x="325" y="287" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-8">TARGET=${1:-.}</text>
  <text x="325" y="304" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-9">[[ -d "$TARGET" ]] || { printf "Invalid target\n" &gt;&amp;2; exit 1; }</text>
  <path d="M 325 319 L 325 332" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-script-structure-arrow)"/>
  <rect x="25" y="333" width="600" height="77" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="356" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-10">DEFINE FUNCTIONS</text>
  <text x="325" y="378" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-11">process_file() { local file=$1; ...; }</text>
  <text x="325" y="395" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-12">main() { ...; }  # define the entry point before calling it</text>
  <path d="M 325 410 L 325 423" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-script-structure-arrow)"/>
  <rect x="25" y="424" width="600" height="77" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="447" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-13">MAIN PROCESSING</text>
  <text x="325" y="469" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-14">main "$@"</text>
  <path d="M 325 501 L 325 514" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-script-structure-arrow)"/>
  <rect x="25" y="515" width="600" height="77" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="538" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-15">RESULTS AND EXIT STATUS</text>
  <text x="325" y="560" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-script-structure-text-16">printf, diagnostics on stderr, explicit error handling</text>
  <rect x="645" y="60" width="215" height="340" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="752" y="87" font-family="Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-17">Requirements and checks</text>
  <text x="660" y="118" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-18">Use the intended interpreter.</text>
  <text x="660" y="150" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-19">Do not write VAR = value.</text>
  <text x="660" y="182" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-20">Validate external input.</text>
  <text x="660" y="214" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-21">Quote data expansions.</text>
  <text x="660" y="246" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-22">Check expected failures.</text>
  <text x="660" y="278" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-23">Keep diagnostics separate.</text>
  <text x="660" y="310" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-24">Choose paths deliberately.</text>
  <text x="660" y="342" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-25">Document non-obvious intent.</text>
  <rect x="645" y="415" width="215" height="190" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="752" y="442" font-family="Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="bold" id="sem04-script-structure-text-26">Preferences, with context</text>
  <text x="660" y="468" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-27">[[ ]] is convenient in Bash.</text>
  <text x="660" y="492" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-28">[ ] remains valid syntax.</text>
  <text x="660" y="516" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-29">$() is easier to nest.</text>
  <text x="660" y="540" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-30">Backticks remain supported.</text>
  <text x="660" y="564" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-31">set -e is not input validation.</text>
  <text x="660" y="588" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-script-structure-text-32">Test relevant failure paths.</text>
  <text x="440" y="631" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem04-script-structure-text-33">Illustrative structure: the ellipses are teaching placeholders, not a runnable complete program.</text>
</svg>
