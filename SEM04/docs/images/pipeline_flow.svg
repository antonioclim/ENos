<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 530" width="840" height="530" role="img" xml:lang="en" aria-labelledby="sem04-pipeline-flow-title sem04-pipeline-flow-desc">
  <title id="sem04-pipeline-flow-title">Pipeline and Shell Redirection</title>
  <desc id="sem04-pipeline-flow-desc">grep reads file.txt, then its stdout passes through sort, uniq -c and awk to the final stdout. Each process has a distinct stderr; only AWK diagnostics are drawn. The lower redirection commands are separate examples.</desc>
  <defs>
    <marker id="sem04-pipeline-flow-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="840" height="530" fill="#f8fafc"/>
  <text x="420.0" y="30" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold" id="sem04-pipeline-flow-text-1">Pipeline and Shell Redirection</text>
  <rect x="25" y="110" width="140" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="145" font-family="monospace" font-size="17" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-pipeline-flow-text-2">file.txt</text>
  <text x="95" y="176" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-pipeline-flow-text-3">file input</text>
  <path d="M 165 155 L 186 155" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-pipeline-flow-arrow)"/>
  <rect x="187" y="110" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="257" y="145" font-family="monospace" font-size="17" fill="#166534" text-anchor="middle" font-weight="bold" id="sem04-pipeline-flow-text-4">grep</text>
  <text x="257" y="176" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle" id="sem04-pipeline-flow-text-5">'pattern' file.txt</text>
  <path d="M 327 155 L 348 155" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-pipeline-flow-arrow)"/>
  <rect x="349" y="110" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="419" y="145" font-family="monospace" font-size="17" fill="#166534" text-anchor="middle" font-weight="bold" id="sem04-pipeline-flow-text-6">sort</text>
  <text x="419" y="176" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle" id="sem04-pipeline-flow-text-7"></text>
  <path d="M 489 155 L 510 155" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-pipeline-flow-arrow)"/>
  <rect x="511" y="110" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="581" y="145" font-family="monospace" font-size="17" fill="#166534" text-anchor="middle" font-weight="bold" id="sem04-pipeline-flow-text-8">uniq</text>
  <text x="581" y="176" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle" id="sem04-pipeline-flow-text-9">-c</text>
  <path d="M 651 155 L 672 155" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-pipeline-flow-arrow)"/>
  <rect x="673" y="110" width="140" height="90" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="743" y="145" font-family="monospace" font-size="17" fill="#166534" text-anchor="middle" font-weight="bold" id="sem04-pipeline-flow-text-10">awk</text>
  <text x="743" y="176" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle" id="sem04-pipeline-flow-text-11">'{print $1}'</text>
  <text x="430" y="80" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" id="sem04-pipeline-flow-text-12">Each pipe connects one process’s stdout to the next process’s stdin.</text>
  <rect x="605" y="260" width="200" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="705" y="285" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" id="sem04-pipeline-flow-text-13">stdout → result</text>
  <text x="705" y="305" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" id="sem04-pipeline-flow-text-14">final output</text>
  <path d="M 743 200 L 743 259" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-pipeline-flow-arrow)"/>
  <rect x="320" y="260" width="210" height="55" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="425" y="285" font-family="Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" id="sem04-pipeline-flow-text-15">stderr → diagnostics</text>
  <text x="425" y="305" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" id="sem04-pipeline-flow-text-16">AWK shown here</text>
  <path d="M 700 200 L 700 230 L 425 230 L 425 259" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#sem04-pipeline-flow-arrow)" stroke-dasharray="5 3"/>
  <text x="420" y="343" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem04-pipeline-flow-text-17">Each process has its own stderr; a normal | does not merge it into stdout.</text>
  <rect x="25" y="365" width="790" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="45" y="388" font-family="Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" id="sem04-pipeline-flow-text-18">Redirection examples (independent alternatives)</text>
  <text x="45" y="415" font-family="monospace" font-size="12" fill="#334155" id="sem04-pipeline-flow-text-19">cmd &gt; out.txt</text>
  <text x="430" y="415" font-family="monospace" font-size="12" fill="#334155" id="sem04-pipeline-flow-text-20">cmd &gt;&gt; out.txt</text>
  <text x="45" y="447" font-family="monospace" font-size="12" fill="#334155" id="sem04-pipeline-flow-text-21">cmd 2&gt; errors.txt</text>
  <text x="430" y="447" font-family="monospace" font-size="12" fill="#334155" id="sem04-pipeline-flow-text-22">cmd &gt; all.txt 2&gt;&amp;1</text>
  <text x="45" y="479" font-family="monospace" font-size="12" fill="#334155" id="sem04-pipeline-flow-text-23">cmd &lt; input.txt</text>
  <text x="430" y="479" font-family="monospace" font-size="12" fill="#334155" id="sem04-pipeline-flow-text-24">cmd &amp;&gt; all.txt  # Bash</text>
</svg>
