<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" xml:lang="en" aria-labelledby="sem04-sed-flow-title sem04-sed-flow-desc">
  <title id="sem04-sed-flow-title">sed: Record Cycle and Two Working Buffers</title>
  <desc id="sem04-sed-flow-desc">The simplified sed cycle reads a record, processes pattern space, optionally prints it automatically and advances until EOF. Explicit printing is independent of -n. Pattern-to-hold and hold-to-pattern transfers have separate arrows and x exchanges the buffers.</desc>
  <defs>
    <marker id="sem04-sed-flow-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="sem04-sed-flow-reverse" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480.0" y="30" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold" id="sem04-sed-flow-text-1">sed: Record Cycle and Two Working Buffers</text>
  <rect x="20" y="75" width="120" height="55" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="80" y="99" font-family="Arial, sans-serif" font-size="13" fill="#14532d" text-anchor="middle" id="sem04-sed-flow-text-2">Input stream</text>
  <text x="80" y="119" font-family="Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" id="sem04-sed-flow-text-3">file or stdin</text>
  <rect x="195" y="75" width="150" height="55" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="99" font-family="Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" id="sem04-sed-flow-text-4">Read next record</text>
  <text x="270" y="119" font-family="Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" id="sem04-sed-flow-text-5">newline-delimited here</text>
  <path d="M 140 102 L 194 102" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <rect x="195" y="175" width="150" height="55" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="270" y="199" font-family="Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-6">EOF?</text>
  <text x="270" y="219" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-7">no more records</text>
  <path d="M 270 130 L 270 174" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <rect x="20" y="175" width="120" height="55" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="207" font-family="Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-8">End</text>
  <path d="M 195 202 L 141 202" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="168" y="192" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-9">yes</text>
  <rect x="410" y="75" width="195" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="507" y="100" font-family="Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold" id="sem04-sed-flow-text-10">Pattern space</text>
  <text x="507" y="124" font-family="Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" id="sem04-sed-flow-text-11">Run addressed commands</text>
  <text x="507" y="147" font-family="monospace" font-size="12" fill="#1e40af" text-anchor="middle" id="sem04-sed-flow-text-12">e.g. s/old/new/g</text>
  <path d="M 345 202 L 380 202 L 380 120 L 409 120" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="365" y="194" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-13">no</text>
  <rect x="410" y="270" width="195" height="55" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="507" y="303" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" id="sem04-sed-flow-text-14">Hold space</text>
  <path d="M 440 165 L 440 269" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="425" y="220" font-family="monospace" font-size="11" fill="#5b21b6" text-anchor="end" id="sem04-sed-flow-text-15">h/H</text>
  <path d="M 575 270 L 575 166" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="590" y="220" font-family="monospace" font-size="11" fill="#5b21b6" id="sem04-sed-flow-text-16">g/G</text>
  <path d="M 508 165 L 508 270" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)" marker-start="url(#sem04-sed-flow-reverse)"/>
  <text x="518" y="245" font-family="Arial, sans-serif" font-size="10" fill="#5b21b6" id="sem04-sed-flow-text-17">x: exchange</text>
  <rect x="665" y="75" width="265" height="90" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
  <text x="797" y="100" font-family="Arial, sans-serif" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="bold" id="sem04-sed-flow-text-18">Automatic printing enabled?</text>
  <text x="797" y="125" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12" text-anchor="middle" id="sem04-sed-flow-text-19">Default: yes; -n: no</text>
  <text x="797" y="149" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12" text-anchor="middle" id="sem04-sed-flow-text-20">An explicit p can still print.</text>
  <path d="M 605 120 L 664 120" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <rect x="690" y="245" width="215" height="55" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
  <text x="797" y="277" font-family="Arial, sans-serif" font-size="12" fill="#7c2d12" text-anchor="middle" id="sem04-sed-flow-text-21">Print pattern space to stdout</text>
  <path d="M 797 165 L 797 244" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="810" y="206" font-family="Arial, sans-serif" font-size="11" fill="#334155" id="sem04-sed-flow-text-22">yes</text>
  <path d="M 930 120 L 945 120 L 945 365 L 797 365" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="935" y="206" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="end" id="sem04-sed-flow-text-23">no</text>
  <path d="M 797 300 L 797 365 L 10 365 L 10 50 L 270 50 L 270 74" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#sem04-sed-flow-arrow)"/>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem04-sed-flow-text-24">Continue with the next record</text>
  <text x="480" y="402" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-25">Simplified normal cycle: d starts the next cycle; q exits. N, D and branches can change this flow.</text>
  <rect x="20" y="425" width="920" height="165" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="40" y="450" font-family="Arial, sans-serif" font-size="14" fill="#334155" font-weight="bold" id="sem04-sed-flow-text-26">Independent examples</text>
  <text x="40" y="478" font-family="monospace" font-size="12" fill="#334155" id="sem04-sed-flow-text-27">sed 's/pattern/replacement/g' file.txt</text>
  <text x="500" y="478" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem04-sed-flow-text-28">Substitute matches; default printing remains enabled.</text>
  <text x="40" y="518" font-family="monospace" font-size="12" fill="#334155" id="sem04-sed-flow-text-29">sed '/pattern/d' file.txt</text>
  <text x="500" y="518" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem04-sed-flow-text-30">Delete matching pattern spaces; continue the cycle.</text>
  <text x="40" y="558" font-family="monospace" font-size="12" fill="#334155" id="sem04-sed-flow-text-31">sed -n '/pattern/p' file.txt</text>
  <text x="500" y="558" font-family="Arial, sans-serif" font-size="12" fill="#334155" id="sem04-sed-flow-text-32">Suppress automatic printing; explicitly print matches.</text>
  <text x="480" y="609" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" id="sem04-sed-flow-text-33">h/H copy/append pattern → hold; g/G copy/append hold → pattern; x swaps the two buffers.</text>
</svg>
