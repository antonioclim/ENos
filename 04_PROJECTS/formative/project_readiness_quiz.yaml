# Authored IDs, section weights and difficulty-point mapping preserved.
quiz:
  title: OS Project Readiness Check - SEM-PROJ
  description: Formative practice covering project prerequisites. Historical score bands are preserved as unvalidated
    guidance, not eligibility or a predictor of success.
  passing_score: 70
  time_limit_minutes: 30
sections:
- name: Bash Fundamentals
  weight: 25
  questions:
  - id: bash_01
    type: multiple_choice
    difficulty: easy
    question: 'What is the difference between `$var` and `${var}`?

      '
    options:
      a: There is no difference
      b: ${var} allows concatenation and manipulations (e.g. ${var}_suffix)
      c: $var is for numbers, ${var} for strings
      d: ${var} is deprecated
    correct: b
    explanation: '`${var}` allows clear delimitation of the variable name and operations

      such as ${var:-default}, ${var%pattern}, ${var#prefix}.

      '
  - id: bash_02
    type: multiple_choice
    difficulty: easy
    question: 'What does the line `set -euo pipefail` do at the beginning of a script?

      '
    options:
      a: Sets environment variables
      b: Enables conditional errexit, unset-variable errors and the rightmost failing pipeline status
      c: Activates debug mode
      d: Disables glob expansion
    correct: b
    explanation: Bash -e has exceptions in if/while/until and AND/OR conditions; functions called in those contexts
      need explicit failure checks. -u detects many unset expansions, with exceptions. pipefail reports the rightmost
      non-zero status. These options alone do not prove robustness.
  - id: bash_03
    type: multiple_choice
    difficulty: medium
    question: 'What is the output of the following code?

      ```bash

      arr=(a b c d)

      echo ${#arr[@]}

      ```

      '
    options:
      a: a b c d
      b: '4'
      c: abcd
      d: 'Error: syntax error'
    correct: b
    explanation: '${#arr[@]} returns the number of elements in the array.

      ${arr[@]} returns all elements, ${arr[0]} the first element.

      '
  - id: bash_04
    type: multiple_choice
    difficulty: medium
    question: For a newline-terminated text file in Bash, which loop preserves leading/trailing spaces and backslashes
      and updates variables in the current shell?
    options:
      a: for line in $(cat file); do
      b: while IFS= read -r line; do ...; done < file
      c: cat file | while read line; do
      d: Both b and c are correct
    correct: b
    explanation: IFS= and -r preserve whitespace/backslashes. Redirecting into the loop keeps its assignments in
      the current shell. To include an unterminated final line, add || [[ -n $line ]] to the read condition. Pipeline
      lastpipe behaviour is a separate Bash option.
  - id: bash_05
    type: code_completion
    difficulty: hard
    question: "Complete the code to process options with getopts:\n```bash\nwhile getopts \"v:o:h\" opt; do\n  \
      \  case $opt in\n        v) VERBOSE=________ ;;\n        o) OUTPUT=________ ;;\n        h) show_help; exit\
      \ 0 ;;\n        *) echo \"Invalid option\"; exit 1 ;;\n    esac\ndone\n```\n"
    answer:
    - $OPTARG
    - $OPTARG
    explanation: '$OPTARG contains the argument value for options

      that require arguments (those followed by : in optstring).

      '
- name: Commands and Utilities
  weight: 25
  questions:
  - id: cmd_01
    type: multiple_choice
    difficulty: easy
    question: Which command selects regular .log files with modification age less than24hours (ordinary past timestamps,
      GNU find rounding)?
    options:
      a: find . -type f -name '*.log' -mtime -1
      b: find . -type f -name '*.log' -mtime 1
      c: find . -type f -name '*.log' -mmin -1440
      d: Both a and c
    correct: d
    explanation: '-mtime -1 means modified in less than 1 day.

      -mmin -1440 means modified in less than 1440 minutes (24 hours).

      -mtime 1 (without minus) means exactly between 1 and 2 days.

      '
  - id: cmd_02
    type: multiple_choice
    difficulty: medium
    question: Which commands extract column3 from simple comma-delimited text with no quoted commas or embedded
      newlines?
    options:
      a: cut -d, -f3 file.csv
      b: awk -F, '{print $3}' file.csv
      c: sed 's/.*,\([^,]*\),.*/\1/' file.csv
      d: Both a and b are correct
    correct: d
    explanation: cut and awk work for this stated simple grammar. General CSV needs a CSV parser; neither command
      handles quoted commas/newlines as CSV fields.
  - id: cmd_03
    type: multiple_choice
    difficulty: medium
    question: 'What does the command `grep -v ''^#'' file | grep -v ''^$''` do?

      '
    options:
      a: Displays only comments
      b: Removes comments and empty lines
      c: 'Counts lines with #'
      d: 'Replaces # with space'
    correct: b
    explanation: '-v inverts the match. ^# matches lines starting with #.

      ^$ matches empty lines. Result: lines that are not comments

      and are not empty - useful for configuration parsing.

      '
  - id: cmd_04
    type: multiple_choice
    difficulty: hard
    question: 'Which command sorts processes by memory usage (descending)?

      '
    options:
      a: ps aux --sort=-rss
      b: ps aux | sort -k4 -n -r
      c: top -o %MEM
      d: All are correct
    correct: d
    explanation: 'ps aux --sort=-rss sorts directly.

      sort -k4 -n -r sorts column 4 numerically descending.

      top -o %MEM sorts in the interface.

      '
  - id: cmd_05
    type: code_completion
    difficulty: hard
    question: 'Complete the commands to show one representative record per repeated MD5 digest, assuming simple
      filenames without newlines/backslashes:

      ```bash

      find . -type f -exec md5sum {} \; | ________ | ________

      ```'
    answer:
    - sort
    - uniq -d -w32
    explanation: 'sort groups digest prefixes; uniq -d -w32 reports one repeated-prefix record per group. This is
      a teaching heuristic, not exact duplicate proof: compare bytes to resolve collisions and use a NUL-safe structured
      method for arbitrary filenames.'
- name: Processes and System
  weight: 25
  questions:
  - id: proc_01
    type: multiple_choice
    difficulty: easy
    question: 'Which signal is sent by default by `kill <pid>`?

      '
    options:
      a: SIGKILL (9)
      b: SIGTERM (15)
      c: SIGHUP (1)
      d: SIGINT (2)
    correct: b
    explanation: 'SIGTERM (15) is the default and allows the process to perform cleanup.

      SIGKILL (9) forces termination without cleanup.

      SIGHUP is for "hang up", SIGINT for Ctrl+C.

      '
  - id: proc_02
    type: multiple_choice
    difficulty: medium
    question: In an interactive Bash shell, which options can help a background job avoid a terminal-close SIGHUP
      (independent stdin/stdout and session rules still need handling)?
    options:
      a: command &
      b: nohup command &
      c: command & disown
      d: Both b and c
    correct: d
    explanation: nohup changes SIGHUP disposition; Bash disown removes a job from its job table. Neither alone establishes
      a complete service lifecycle, independent input/output or session ownership. Explicit redirection and a supervisor
      may be required.
  - id: proc_03
    type: multiple_choice
    difficulty: medium
    question: 'What information does the /proc/[pid]/status file provide?

      '
    options:
      a: Only PID and PPID
      b: Process state, memory, threads, capabilities
      c: Only CPU usage
      d: Process command history
    correct: b
    explanation: '/proc/[pid]/status contains: State, Pid, PPid, Uid, Gid,

      VmSize, VmRSS, Threads, and many more.

      It is a complete source of information about the process.

      '
  - id: proc_04
    type: multiple_choice
    difficulty: hard
    question: 'What is the difference between a zombie process and an orphan process?

      '
    options:
      a: 'Zombie: exited but not reaped; orphan: parent exited, adopted by a subreaper or PID1'
      b: 'Zombie: no memory; Orphan: no CPU'
      c: There is no difference
      d: 'Zombie: adopted by init; Orphan: terminated'
    correct: a
    explanation: A zombie retains exit/accounting information until reaped. On Linux an orphan is reparented to
      an applicable child subreaper, otherwise the namespace init process. Orphan and zombie describe different
      lifecycle properties.
  - id: proc_05
    type: code_completion
    difficulty: hard
    question: 'Complete separate exit/interrupt/termination traps for owned temporary resources:

      ```bash

      cleanup() { status=$?; trap - EXIT; rm -f -- "$TMPFILE"; exit "$status"; }

      trap ________ EXIT

      trap ________ INT

      trap ________ TERM

      ```'
    answer:
    - cleanup
    - '''exit 130'''
    - '''exit 143'''
    explanation: EXIT performs cleanup; INT and TERM explicitly terminate with130 and143 so cleanup runs once. Register
      traps before allocating TMPFILE and initialise it. SIGKILL cannot run a trap. Owned child processes also require
      checked termination and wait.
- name: Networking and Security
  weight: 15
  questions:
  - id: net_01
    type: multiple_choice
    difficulty: easy
    question: 'Which command checks if port 80 is open on localhost?

      '
    options:
      a: nc -zv localhost 80
      b: ping localhost:80
      c: telnet localhost 80
      d: Both a and c
    correct: d
    explanation: 'nc -zv performs a quick scan (-z) with verbose (-v).

      telnet can connect and allows interaction.

      ping cannot specify ports (ICMP has no ports).

      '
  - id: net_02
    type: multiple_choice
    difficulty: medium
    question: 'What does permission 4755 mean on an executable?

      '
    options:
      a: rwxr-xr-x with SUID bit
      b: rwxrwxrwx
      c: r--r--r-x
      d: Normal rwxr-xr-x
    correct: a
    explanation: 4755 includes the set-user-ID bit with rwxr-xr-x. For a supported executable on a mount permitting
      it, exec can change effective identity to the owner; Linux ignores set-ID on ordinary scripts, and nosuid/no_new_privs
      and other controls can prevent the transition.
  - id: net_03
    type: multiple_choice
    difficulty: hard
    question: Which command requests established TCP connections and process information, subject to the caller's
      permissions?
    options:
      a: netstat -tuln
      b: ss -tnp state established
      c: lsof -i TCP
      d: Both b and c
    correct: b
    explanation: ss -tnp state established applies the required state filter. lsof -i TCP includes TCP sockets in
      other states; use lsof -a -iTCP -sTCP:ESTABLISHED for its equivalent state filter. Process ownership details
      may be unavailable without permission.
- name: Project and Best Practices
  weight: 10
  questions:
  - id: proj_01
    type: multiple_choice
    difficulty: easy
    question: 'What should the project''s README.md contain?

      '
    options:
      a: Only the title
      b: Description, installation, usage, examples
      c: Only the source code
      d: Only hardware requirements
    correct: b
    explanation: 'A complete README.md includes: description, requirements/dependencies,

      installation instructions, usage examples, contributions.

      '
  - id: proj_02
    type: multiple_choice
    difficulty: medium
    question: 'What is the recommended structure for a Bash project?

      '
    options:
      a: One large file
      b: src/, lib/, tests/, docs/, etc/, Makefile
      c: Only the main file and README
      d: There is no standard
    correct: b
    explanation: 'The modular structure allows: organised code in lib/,

      separate tests, documentation in docs/, configurations in etc/.

      Makefile orchestrates build, test, install.

      '
  - id: proj_03
    type: multiple_choice
    difficulty: medium
    question: Which tool provides static shell diagnostics beyond a Bash syntax-only check (without proving absence
      of defects)?
    options:
      a: bash -n script.sh
      b: shellcheck script.sh
      c: chmod +x and run
      d: Both a and b
    correct: b
    explanation: ShellCheck provides static diagnostics. bash -n parses syntax, not general style/correctness. Both
      are useful complementary checks; neither replaces meaningful execution tests.
scoring:
  easy: 1
  medium: 2
  hard: 3
feedback:
  90-100: 'Excellent! You are ready to tackle any project level.

    Recommendation: MEDIUM or ADVANCED project.

    '
  70-89: 'Good! You have a solid foundation.

    Recommendation: EASY or MEDIUM project.

    Review sections with lower scores.

    '
  50-69: 'You need more practice.

    Recommendation: EASY project.

    Go through the corresponding seminar for weak sections.

    '
  0-49: 'Insufficient preparation.

    Recommendation: review course and seminar materials

    before starting the project. Consult additional tutorials.

    '
