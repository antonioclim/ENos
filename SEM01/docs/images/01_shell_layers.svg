<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" xml:lang="en" aria-labelledby="sem01-01-shell-layers-title sem01-01-shell-layers-desc">
  <title id="sem01-01-shell-layers-title">Linux System Layers</title><desc id="sem01-01-shell-layers-desc">The user enters a command. Bash interprets it, programs request kernel services, and the kernel controls hardware through drivers. This is a simplified interaction model; not every command requires an external process.</desc><!-- Background -->
  <rect width="400" height="320" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" id="sem01-01-shell-layers-text-1">Linux System Layers</text>
  
  <!-- User Layer -->
  <rect x="50" y="45" width="300" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2" id="sem01-01-shell-layers-text-2">USER</text>
  <text x="200" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-01-shell-layers-text-3">types commands in a terminal</text>
  
  <!-- Arrow User to Shell -->
  <path d="M200 95 L200 115" stroke="#666" stroke-width="2" marker-end="url(#sem01-01-shell-layers-arrowDown)"/>
  <text x="260" y="108" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-01-shell-layers-text-4">text commands</text>
  
  <!-- Shell Layer -->
  <rect x="50" y="120" width="300" height="50" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27632a" id="sem01-01-shell-layers-text-5">SHELL (Bash)</text>
  <text x="200" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-01-shell-layers-text-6">interprets and executes commands</text>
  
  <!-- Arrow Shell to Kernel -->
  <path d="M200 170 L200 190" stroke="#666" stroke-width="2" marker-end="url(#sem01-01-shell-layers-arrowDown)"/>
  <text x="260" y="183" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-01-shell-layers-text-7">system calls</text>
  
  <!-- Kernel Layer -->
  <rect x="50" y="195" width="300" height="50" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a4c00" id="sem01-01-shell-layers-text-8">KERNEL (Linux)</text>
  <text x="200" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-01-shell-layers-text-9">manages resources and processes</text>
  
  <!-- Arrow Kernel to Hardware -->
  <path d="M200 245 L200 265" stroke="#666" stroke-width="2" marker-end="url(#sem01-01-shell-layers-arrowDown)"/>
  <text x="260" y="258" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-01-shell-layers-text-10">driver calls</text>
  
  <!-- Hardware Layer -->
  <rect x="50" y="270" width="300" height="40" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2185b" id="sem01-01-shell-layers-text-11">HARDWARE</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="sem01-01-shell-layers-arrowDown" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
