<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" width="450" height="280" role="img" xml:lang="en" aria-labelledby="sem01-03-quoting-comparison-title sem01-03-quoting-comparison-desc">
  <title id="sem01-03-quoting-comparison-title">Bash Quoting: Single and Double</title><desc id="sem01-03-quoting-comparison-desc">Single quotes preserve literal characters. Double quotes permit parameter and command substitution while preventing word splitting and pathname expansion of the quoted result.</desc><!-- Background -->
  <rect width="450" height="280" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="225" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" id="sem01-03-quoting-comparison-text-1">Bash Quoting: Single and Double</text>
  
  <!-- Variable setup -->
  <rect x="20" y="40" width="410" height="25" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="30" y="57" font-family="monospace" font-size="11" fill="#333" id="sem01-03-quoting-comparison-text-2">NAME="Student"    DATA=$(date +%Y)</text>
  
  <!-- Single Quotes Section -->
  <rect x="20" y="80" width="200" height="180" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c62828" id="sem01-03-quoting-comparison-text-3">
    SINGLE QUOTES ' '
  </text>
  <text x="120" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-03-quoting-comparison-text-4">All content is LITERAL</text>
  
  <!-- Single quotes example -->
  <rect x="30" y="130" width="180" height="25" rx="3" fill="#fff" stroke="#c62828"/>
  <text x="40" y="147" font-family="monospace" font-size="10" fill="#333" id="sem01-03-quoting-comparison-text-5">echo 'Hello $NAME'</text>
  
  <text x="40" y="170" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-03-quoting-comparison-text-6">Output:</text>
  <rect x="30" y="175" width="180" height="22" rx="3" fill="#c62828"/>
  <text x="40" y="190" font-family="monospace" font-size="11" fill="#fff" id="sem01-03-quoting-comparison-text-7">Hello $NAME</text>
  
  <text x="30" y="220" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-03-quoting-comparison-text-8">Variables do not expand</text>
  <text x="30" y="235" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-03-quoting-comparison-text-9">No command substitution</text>
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-03-quoting-comparison-text-10">Use for literal text</text>
  
  <!-- Double Quotes Section -->
  <rect x="230" y="80" width="200" height="180" rx="5" fill="#e8f5e9" stroke="#27632a" stroke-width="2"/>
  <text x="330" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27632a" id="sem01-03-quoting-comparison-text-11">
    DOUBLE QUOTES " "
  </text>
  <text x="330" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-03-quoting-comparison-text-12">Variables EXPAND</text>
  
  <!-- Double quotes example -->
  <rect x="240" y="130" width="180" height="25" rx="3" fill="#fff" stroke="#27632a"/>
  <text x="250" y="147" font-family="monospace" font-size="10" fill="#333" id="sem01-03-quoting-comparison-text-13">echo "Hello $NAME"</text>
  
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="10" fill="#666" id="sem01-03-quoting-comparison-text-14">Output:</text>
  <rect x="240" y="175" width="180" height="22" rx="3" fill="#27632a"/>
  <text x="250" y="190" font-family="monospace" font-size="11" fill="#fff" id="sem01-03-quoting-comparison-text-15">Hello Student</text>
  
  <text x="240" y="220" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-03-quoting-comparison-text-16">Variables expand</text>
  <text x="240" y="235" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-03-quoting-comparison-text-17">Command substitution runs</text>
  <text x="240" y="250" font-family="Arial, sans-serif" font-size="9" fill="#666" id="sem01-03-quoting-comparison-text-18">Preserves spaces</text>
  
  <!-- Footer -->
  <text x="20" y="275" font-family="Arial, sans-serif" font-size="9" fill="#555555" id="sem01-03-quoting-comparison-text-19">Seminar 01 — Shell Fundamentals | Common misconception: M1.4</text>
</svg>
