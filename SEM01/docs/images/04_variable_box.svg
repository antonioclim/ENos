<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" xml:lang="en" aria-labelledby="sem01-04-variable-box-title sem01-04-variable-box-desc">
  <title id="sem01-04-variable-box-title">Variables: Labelled Boxes Analogy</title><desc id="sem01-04-variable-box-desc">The same NAME variable with value Alice changes from unexported to exported by export NAME. A subsequently executed bash -c receives NAME in its environment. Export is distinct from Bash function-local scope.</desc><defs>
    <linearGradient id="sem01-04-variable-box-boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d333b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22272e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="350" fill="#161b22"/>
  
  <!-- Title -->
  <text x="350" y="35" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle" id="sem01-04-variable-box-text-1">Variables: Labelled Boxes Analogy</text>
  
  <!-- Local Variable Box -->
  <g transform="translate(50, 70)">
    <!-- Box -->
    <rect width="180" height="120" rx="8" fill="url(#sem01-04-variable-box-boxGrad)" stroke="#58a6ff" stroke-width="2"/>
    <!-- Label tab -->
    <rect x="20" y="-15" width="80" height="30" rx="4" fill="#58a6ff"/>
    <text x="60" y="5" font-family="JetBrains Mono, monospace" font-size="12" fill="#161b22" text-anchor="middle" font-weight="bold" id="sem01-04-variable-box-text-2">NAME</text>
    <!-- Content -->
    <text x="90" y="70" font-family="JetBrains Mono, monospace" font-size="18" fill="#e6edf3" text-anchor="middle" id="sem01-04-variable-box-text-3">"Alice"</text>
    <!-- Type indicator -->
    <text x="90" y="105" font-family="Inter, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem01-04-variable-box-text-4">Unexported shell variable</text>
  </g>
  
  <!-- Export arrow -->
  <g transform="translate(250, 130)">
    <rect x="0" y="-10" width="80" height="30" rx="4" fill="#3fb950"/>
    <text x="40" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#161b22" text-anchor="middle" font-weight="bold" id="sem01-04-variable-box-text-5">export NAME</text>
    <!-- Arrow line -->
    <line x1="85" y1="5" x2="130" y2="5" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="130,0 140,5 130,10" fill="#3fb950"/>
  </g>
  
  <!-- Environment Variable Box -->
  <g transform="translate(400, 70)">
    <!-- Box with conveyor -->
    <rect width="200" height="120" rx="8" fill="url(#sem01-04-variable-box-boxGrad)" stroke="#3fb950" stroke-width="3"/>
    <!-- Conveyor belt decoration -->
    <line x1="0" y1="130" x2="200" y2="130" stroke="#3fb950" stroke-width="4"/>
    <circle cx="20" cy="130" r="8" fill="#22272e" stroke="#3fb950" stroke-width="2"/>
    <circle cx="180" cy="130" r="8" fill="#22272e" stroke="#3fb950" stroke-width="2"/>
    <!-- Label tab -->
    <rect x="20" y="-15" width="80" height="30" rx="4" fill="#3fb950"/>
    <text x="60" y="5" font-family="JetBrains Mono, monospace" font-size="12" fill="#161b22" text-anchor="middle" font-weight="bold" id="sem01-04-variable-box-text-6">NAME</text>
    <!-- Content -->
    <text x="100" y="60" font-family="JetBrains Mono, monospace" font-size="12" fill="#e6edf3" text-anchor="middle" id="sem01-04-variable-box-text-7">"Alice"</text>
    <text x="100" y="80" font-family="JetBrains Mono, monospace" font-size="12" fill="#e6edf3" text-anchor="middle" id="sem01-04-variable-box-text-8">same value</text>
    <!-- Type indicator -->
    <text x="100" y="105" font-family="Inter, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle" id="sem01-04-variable-box-text-9">Exported shell variable</text>
  </g>
  
  <!-- Child process illustration -->
  <g transform="translate(400, 220)">
    <rect width="200" height="80" rx="8" fill="#1e252e" stroke="#a371f7" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="100" y="25" font-family="Inter, sans-serif" font-size="12" fill="#a371f7" text-anchor="middle" id="sem01-04-variable-box-text-10">Child Process (bash -c)</text>
    <text x="100" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem01-04-variable-box-text-11">Sees NAME="Alice"</text>
    <text x="100" y="68" font-family="JetBrains Mono, monospace" font-size="10" fill="#b7c1cc" text-anchor="middle" id="sem01-04-variable-box-text-12">Unexported names omitted</text>
  </g>
  
  <!-- Arrow to child -->
  <line x1="500" y1="200" x2="500" y2="215" stroke="#a371f7" stroke-width="2"/>
  <polygon points="495,215 500,225 505,215" fill="#a371f7"/>
  
  <!-- Legend box -->
  <g transform="translate(50, 230)">
    <rect width="250" height="100" rx="6" fill="#1e252e" stroke="#30363d"/>
    <text x="90" y="25" font-family="Inter, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="bold" id="sem01-04-variable-box-text-13">Key Concepts</text>
    <text x="15" y="50" font-family="Inter, sans-serif" font-size="11" fill="#58a6ff" id="sem01-04-variable-box-text-14">●</text>
    <text x="30" y="50" font-family="Inter, sans-serif" font-size="11" fill="#b7c1cc" id="sem01-04-variable-box-text-15">Unexported: not sent</text>
    <text x="15" y="70" font-family="Inter, sans-serif" font-size="11" fill="#3fb950" id="sem01-04-variable-box-text-16">●</text>
    <text x="30" y="70" font-family="Inter, sans-serif" font-size="11" fill="#b7c1cc" id="sem01-04-variable-box-text-17">Export: child environment</text>
    <text x="15" y="90" font-family="Inter, sans-serif" font-size="11" fill="#a371f7" id="sem01-04-variable-box-text-18">●</text>
    <text x="30" y="90" font-family="Inter, sans-serif" font-size="11" fill="#b7c1cc" id="sem01-04-variable-box-text-19">Child: inherits exported data</text>
  </g>
</svg>
