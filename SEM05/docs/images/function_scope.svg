<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="sem05-function_scope-title sem05-function_scope-desc" xml:lang="en">
  <title id="sem05-function_scope-title">Function Scope</title>
  <desc id="sem05-function_scope-desc">Two independent calls start with global count 10. Assignment without local changes the global to 11; local count leaves it 10. Bash local variables are dynamically scoped and visible to called functions.</desc>
  <rect x="0" y="0" width="100%" height="100%" fill="#fff" />
  <defs>
    <linearGradient id="sem05-function_scope-globalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sem05-function_scope-localGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sem05-function_scope-funcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0d47a1" id="SEM05_function_scope-text-14">Variable Scope in Bash Functions</text>
  <rect x="50" y="50" width="700" height="420" rx="10" ry="10" fill="url(#sem05-function_scope-globalGrad)" stroke="#1565c0" stroke-width="2" />
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1" id="SEM05_function_scope-text-16">GLOBAL SCOPE (script)</text>
  <rect x="80" y="100" width="180" height="60" rx="5" ry="5" fill="#fff" stroke="#2196f3" stroke-width="2" />
  <text x="170" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#333" id="SEM05_function_scope-text-18">count=10</text>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444" id="SEM05_function_scope-text-19">Global variable: each example starts at 10</text>
  <rect x="100" y="180" width="600" height="200" rx="8" ry="8" fill="url(#sem05-function_scope-funcGrad)" stroke="#7b1fa2" stroke-width="2" />
  <text x="120" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7b1fa2" id="SEM05_function_scope-text-21">FUNCTION: increment() — separate direct calls</text>
  <rect x="130" y="230" width="250" height="130" rx="5" ry="5" fill="#ffebee" stroke="#c62828" stroke-width="2" />
  <text x="255" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c62828" id="SEM05_function_scope-text-23">WITHOUT local</text>
  <text x="145" y="280" font-family="monospace" font-size="12" fill="#333" id="SEM05_function_scope-text-24">count=$((count + 1))</text>
  <text x="145" y="305" font-family="Arial, sans-serif" font-size="11" fill="#c62828" id="SEM05_function_scope-text-25">Changes the caller-visible variable</text>
  <text x="145" y="325" font-family="Arial, sans-serif" font-size="11" fill="#c62828" id="SEM05_function_scope-text-26">Global count is 11 after this call</text>
  <text x="145" y="345" font-family="monospace" font-size="10" fill="#444" id="SEM05_function_scope-text-27"># After the function: count=11</text>
  <rect x="420" y="230" width="250" height="130" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="545" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20" id="SEM05_function_scope-text-29">WITH local</text>
  <text x="435" y="280" font-family="monospace" font-size="12" fill="#333" id="SEM05_function_scope-text-30">local count=$((count + 1))</text>
  <text x="435" y="305" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20" id="SEM05_function_scope-text-31">Creates a function-local variable</text>
  <text x="435" y="325" font-family="Arial, sans-serif" font-size="11" fill="#1b5e20" id="SEM05_function_scope-text-32">Global count remains 10</text>
  <text x="435" y="345" font-family="monospace" font-size="10" fill="#444" id="SEM05_function_scope-text-33"># After the function: count=10</text>
  <path d="M130 275 L90 275 L90 160 L170 160" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#sem05-function_scope-arrowRed)" />
  <defs>
    <marker id="sem05-function_scope-arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
    </marker>
  </defs>
  <rect x="430" y="263" width="230" height="24" rx="3" ry="3" fill="none" stroke="#ff9800" stroke-width="1" stroke-dasharray="4" />
  <rect x="80" y="400" width="300" height="50" rx="5" ry="5" fill="#fff" stroke="#333" stroke-width="1" />
  <text x="90" y="420" font-family="monospace" font-size="11" fill="#333" id="SEM05_function_scope-text-40">echo "After the function: $count"</text>
  <text x="90" y="440" font-family="Arial, sans-serif" font-size="11" fill="#444" id="SEM05_function_scope-text-41">The two examples produce different results.</text>
  <rect x="450" y="410" width="280" height="50" rx="5" ry="5" fill="#fafafa" stroke="#999" stroke-width="1" />
  <text x="460" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" id="SEM05_function_scope-text-43">Bash uses dynamic scope:</text>
  <text x="460" y="448" font-family="Arial, sans-serif" font-size="10" fill="#333" id="SEM05_function_scope-text-44">A callee can see its caller's local variable.</text>
</svg>
