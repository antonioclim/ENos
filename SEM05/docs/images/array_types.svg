<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="sem05-array_types-title sem05-array_types-desc" xml:lang="en">
  <title id="sem05-array_types-title">Array Types</title>
  <desc id="sem05-array_types-desc">Indexed arrays use numeric indices, can contain gaps and iterate in numeric index order. Associative arrays require an associative declaration and have no guaranteed key iteration order. This seminar requires Bash 4.4 or later.</desc>
  <rect x="0" y="0" width="100%" height="100%" fill="#fff" />
  <defs>
    <linearGradient id="sem05-array_types-indexedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sem05-array_types-assocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" id="SEM05_array_types-text-11">Array Types in Bash</text>
  <rect x="30" y="50" width="360" height="380" rx="10" ry="10" fill="url(#sem05-array_types-indexedGrad)" stroke="#2e7d32" stroke-width="2" />
  <text x="210" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b5e20" id="SEM05_array_types-text-13">INDEXED ARRAY</text>
  <text x="210" y="100" text-anchor="middle" font-family="monospace" font-size="12" fill="#444" id="SEM05_array_types-text-14">declare -a arr</text>
  <g transform="translate(50, 120)">
    <text x="30" y="-5" text-anchor="middle" font-family="monospace" font-size="11" fill="#444" id="SEM05_array_types-text-16">[0]</text>
    <text x="100" y="-5" text-anchor="middle" font-family="monospace" font-size="11" fill="#444" id="SEM05_array_types-text-17">[1]</text>
    <text x="170" y="-5" text-anchor="middle" font-family="monospace" font-size="11" fill="#444" id="SEM05_array_types-text-18">[2]</text>
    <text x="240" y="-5" text-anchor="middle" font-family="monospace" font-size="11" fill="#444" id="SEM05_array_types-text-19">[3]</text>
    <rect x="0" y="0" width="60" height="40" rx="3" ry="3" fill="#fff" stroke="#4caf50" stroke-width="2" />
    <text x="30" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" id="SEM05_array_types-text-21">"a"</text>
    <rect x="70" y="0" width="60" height="40" rx="3" ry="3" fill="#fff" stroke="#4caf50" stroke-width="2" />
    <text x="100" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" id="SEM05_array_types-text-23">"b"</text>
    <rect x="140" y="0" width="60" height="40" rx="3" ry="3" fill="#fff" stroke="#4caf50" stroke-width="2" />
    <text x="170" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" id="SEM05_array_types-text-25">"c"</text>
    <rect x="210" y="0" width="60" height="40" rx="3" ry="3" fill="#fff" stroke="#4caf50" stroke-width="2" />
    <text x="240" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" id="SEM05_array_types-text-27">"d"</text>
  </g>
  <rect x="50" y="190" width="320" height="110" rx="5" ry="5" fill="#fff" stroke="#81c784" stroke-width="1" />
  <text x="60" y="210" font-family="monospace" font-size="11" fill="#333" id="SEM05_array_types-text-29"># Declaration</text>
  <text x="60" y="228" font-family="monospace" font-size="11" fill="#1b5e20" id="SEM05_array_types-text-30">arr=("a" "b" "c" "d")</text>
  <text x="60" y="250" font-family="monospace" font-size="11" fill="#333" id="SEM05_array_types-text-31"># Access</text>
  <text x="60" y="268" font-family="monospace" font-size="11" fill="#1b5e20" id="SEM05_array_types-text-32">echo "${arr[0]}"  # a</text>
  <text x="60" y="286" font-family="monospace" font-size="11" fill="#1b5e20" id="SEM05_array_types-text-33">echo "${arr[@]}"  # a b c d</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-34">✓ Numeric indices, usually starting at 0</text>
  <text x="50" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-35">✓ Access by an explicit numeric index</text>
  <text x="50" y="360" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-36">✓ Iteration follows numeric index order</text>
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="11" fill="#9f1b1b" id="SEM05_array_types-text-37">Note: unset can leave gaps in the indices</text>
  <text x="50" y="400" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-38">✓ declare -a is optional</text>
  <rect x="410" y="50" width="360" height="380" rx="10" ry="10" fill="url(#sem05-array_types-assocGrad)" stroke="#ef6c00" stroke-width="2" />
  <text x="590" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8e3600" id="SEM05_array_types-text-40">ASSOCIATIVE ARRAY</text>
  <text x="590" y="100" text-anchor="middle" font-family="monospace" font-size="12" fill="#444" id="SEM05_array_types-text-41">declare -A hash</text>
  <g transform="translate(430, 120)">
    <rect x="0" y="0" width="140" height="35" rx="3" ry="3" fill="#fff" stroke="#ff9800" stroke-width="2" />
    <text x="10" y="22" font-family="monospace" font-size="9" fill="#444" id="SEM05_array_types-text-44">[host]</text>
    <text x="55" y="22" font-family="monospace" font-size="9" fill="#333" id="SEM05_array_types-text-45">→ "localhost"</text>
    <rect x="160" y="0" width="140" height="35" rx="3" ry="3" fill="#fff" stroke="#ff9800" stroke-width="2" />
    <text x="170" y="22" font-family="monospace" font-size="9" fill="#444" id="SEM05_array_types-text-47">[port]</text>
    <text x="215" y="22" font-family="monospace" font-size="9" fill="#333" id="SEM05_array_types-text-48">→ "8080"</text>
    <rect x="80" y="45" width="140" height="35" rx="3" ry="3" fill="#fff" stroke="#ff9800" stroke-width="2" />
    <text x="90" y="67" font-family="monospace" font-size="9" fill="#444" id="SEM05_array_types-text-50">[debug]</text>
    <text x="135" y="67" font-family="monospace" font-size="9" fill="#333" id="SEM05_array_types-text-51">→ "true"</text>
  </g>
  <rect x="430" y="215" width="320" height="110" rx="5" ry="5" fill="#fff" stroke="#ffcc80" stroke-width="1" />
  <text x="440" y="235" font-family="monospace" font-size="11" fill="#9f1b1b" id="SEM05_array_types-text-53"># Declare the associative type</text>
  <text x="440" y="253" font-family="monospace" font-size="11" fill="#8e3600" id="SEM05_array_types-text-54">declare -A config</text>
  <text x="440" y="275" font-family="monospace" font-size="11" fill="#333" id="SEM05_array_types-text-55"># Assignment</text>
  <text x="440" y="293" font-family="monospace" font-size="11" fill="#8e3600" id="SEM05_array_types-text-56">config[host]="localhost"</text>
  <text x="440" y="311" font-family="monospace" font-size="11" fill="#8e3600" id="SEM05_array_types-text-57">echo "${config[host]}"</text>
  <text x="430" y="345" font-family="Arial, sans-serif" font-size="11" fill="#9f1b1b" id="SEM05_array_types-text-58">Declare the associative type with -A</text>
  <text x="430" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-59">✓ String keys (dictionary)</text>
  <text x="430" y="385" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-60">✓ Key iteration order is not guaranteed</text>
  <text x="430" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-61">✓ Feature: Bash 4.0+; seminar: Bash 4.4+</text>
  <text x="430" y="425" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_array_types-text-62">✓ ${!hash[@]} expands the keys</text>
</svg>
