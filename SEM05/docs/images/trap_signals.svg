<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="sem05-trap_signals-title sem05-trap_signals-desc" xml:lang="en">
  <title id="sem05-trap_signals-title">Bash trap events and operating-system signals</title>
  <desc id="sem05-trap_signals-desc">EXIT and ERR are Bash events, not operating-system signals. ERR does not require errexit and has tested-context exceptions. INT and TERM handlers request shell exit; one EXIT handler performs owned-resource cleanup. SIGKILL and abrupt machine failure cannot run cleanup. ERR inheritance requires errtrace where appropriate.</desc>
  <rect width="800" height="600" fill="#fff" />
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" fill="#0d47a1" text-anchor="middle" id="SEM05_trap_signals-text-4">Bash Trap Events and Operating-system Signals</text>
  <rect x="30" y="50" width="740" height="205" rx="6" fill="#e3f2fd" stroke="#1565c0" />
  <text x="45" y="73" font-family="Arial, sans-serif" font-size="14" fill="#0d47a1" id="SEM05_trap_signals-text-6">One owned temporary file; one EXIT cleanup handler</text>
  <text x="48" y="98" font-family="monospace" font-size="12" fill="#333" id="SEM05_trap_signals-text-7">tmp=</text>
  <text x="48" y="120" font-family="monospace" font-size="12" fill="#333" id="SEM05_trap_signals-text-8">cleanup() { [[ -z ${tmp:-} ]] || rm -f -- "$tmp"; }</text>
  <text x="48" y="142" font-family="monospace" font-size="12" fill="#333" id="SEM05_trap_signals-text-9">trap 'status=$?; cleanup; exit "$status"' EXIT</text>
  <text x="48" y="164" font-family="monospace" font-size="12" fill="#333" id="SEM05_trap_signals-text-10">trap 'exit 130' INT; trap 'exit 143' TERM</text>
  <text x="48" y="186" font-family="monospace" font-size="12" fill="#333" id="SEM05_trap_signals-text-11">tmp=$(mktemp) || exit 1</text>
  <text x="48" y="208" font-family="monospace" font-size="12" fill="#333" id="SEM05_trap_signals-text-12"># Work with "$tmp"; define handlers before allocation.</text>
  <text x="45" y="241" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-13">The function must exist when its handler executes; defining it first avoids a registration-to-definition gap.</text>
  <rect x="30" y="275" width="170" height="150" rx="6" fill="#fff3e0" stroke="#8e3600" />
  <text x="115" y="300" font-family="Arial, sans-serif" font-size="16" fill="#8e3600" text-anchor="middle" id="SEM05_trap_signals-text-15">EXIT</text>
  <text x="115" y="320" font-family="Arial, sans-serif" font-size="11" fill="#8e3600" text-anchor="middle" id="SEM05_trap_signals-text-16">Bash exit event</text>
  <text x="40" y="344" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-17">Runs on normal shell exit</text>
  <text x="40" y="363" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-18">and explicit exit requests.</text>
  <text x="40" y="382" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-19">Not a guarantee for SIGKILL</text>
  <text x="40" y="401" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-20">or abrupt machine failure.</text>
  <rect x="220" y="275" width="170" height="150" rx="6" fill="#ffebee" stroke="#8b1b1b" />
  <text x="305" y="300" font-family="Arial, sans-serif" font-size="16" fill="#8b1b1b" text-anchor="middle" id="SEM05_trap_signals-text-22">ERR</text>
  <text x="305" y="320" font-family="Arial, sans-serif" font-size="11" fill="#8b1b1b" text-anchor="middle" id="SEM05_trap_signals-text-23">Bash failure event</text>
  <text x="230" y="344" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-24">Eligible failures only.</text>
  <text x="230" y="363" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-25">Does not require set -e.</text>
  <text x="230" y="382" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-26">if / while / AND-OR tests</text>
  <text x="230" y="401" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-27">have documented exceptions.</text>
  <rect x="410" y="275" width="170" height="150" rx="6" fill="#e1f5fe" stroke="#0d47a1" />
  <text x="495" y="300" font-family="Arial, sans-serif" font-size="16" fill="#0d47a1" text-anchor="middle" id="SEM05_trap_signals-text-29">INT</text>
  <text x="495" y="320" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1" text-anchor="middle" id="SEM05_trap_signals-text-30">OS signal 2</text>
  <text x="420" y="344" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-31">Often from Ctrl+C.</text>
  <text x="420" y="363" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-32">Handler requests exit 130.</text>
  <text x="420" y="382" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-33">The EXIT handler then</text>
  <text x="420" y="401" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-34">cleans the owned file.</text>
  <rect x="600" y="275" width="170" height="150" rx="6" fill="#fce4ec" stroke="#880e4f" />
  <text x="685" y="300" font-family="Arial, sans-serif" font-size="16" fill="#880e4f" text-anchor="middle" id="SEM05_trap_signals-text-36">TERM</text>
  <text x="685" y="320" font-family="Arial, sans-serif" font-size="11" fill="#880e4f" text-anchor="middle" id="SEM05_trap_signals-text-37">OS signal 15</text>
  <text x="610" y="344" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-38">A termination request.</text>
  <text x="610" y="363" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-39">Handler requests exit 143.</text>
  <text x="610" y="382" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-40">The EXIT handler then</text>
  <text x="610" y="401" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-41">cleans the owned file.</text>
  <rect x="30" y="445" width="740" height="120" rx="6" fill="#f5f5f5" stroke="#777" />
  <text x="45" y="468" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-43">ERR inheritance: set -E (errtrace) enables inheritance in functions, substitutions and subshells.</text>
  <text x="45" y="492" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-44">Other traps and shell options have their own inheritance rules; do not generalise from ERR.</text>
  <text x="45" y="516" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-45">An INT/TERM handler can return instead of exiting. This example explicitly requests exit.</text>
  <text x="45" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333" id="SEM05_trap_signals-text-46">Cleanup is bounded by process lifetime and resource ownership; it cannot make every failure recoverable.</text>
  <text x="400" y="588" font-family="Arial, sans-serif" font-size="10" fill="#444" text-anchor="middle" id="SEM05_trap_signals-text-47">Bash reference semantics; actual signal delivery also depends on foreground jobs and waiting.</text>
</svg>
