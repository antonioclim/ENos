# C14_05_FORMATIVE_ASSESSMENT.yaml
# Course 14: Virtualisation + Recap
# Formative Assessment — Conceptual Quiz

metadata:
  course: 14
  subject: "Virtualisation + Recap"
  version: "2.0"
  creation_date: "2026-01-28"
  author: "by Revolvix"
  number_of_questions: 12
  estimated_time_minutes: 15
  bloom_distribution:
    remember: 3
    understand: 5
    analyse: 3
    apply: 1

questions:
  - id: q01
    bloom: remember
    difficulty: easy
    text: "What is a hypervisor (VMM - Virtual Machine Monitor)?"
    options:
      - "A type of processor"
      - "Software that creates and manages virtual machines, providing hardware abstraction"
      - "A network protocol"
      - "A type of memory"
    correct: 1
    explanation: "Hypervisor = layer that allows running multiple OSes on the same physical hardware."

  - id: q02
    bloom: remember
    difficulty: easy
    text: "What is the difference between Type 1 and Type 2 hypervisors?"
    options:
      - "There is no difference"
      - "Type 1 (bare-metal): runs directly on hardware. Type 2 (hosted): runs on top of a host OS"
      - "Type 2 is faster"
      - "Type 1 is software, Type 2 is hardware"
    correct: 1
    explanation: "Type 1: VMware ESXi, Xen (performance). Type 2: VirtualBox, VMware Workstation (convenience)."

  - id: q03
    bloom: remember
    difficulty: easy
    text: "What does paravirtualisation mean?"
    options:
      - "Very fast virtualisation"
      - "The guest OS is modified to know it runs virtualised and communicates directly with the hypervisor"
      - "Network-only virtualisation"
      - "Hardware virtualisation"
    correct: 1
    explanation: "Paravirtualisation: modified guest OS uses hypercalls instead of privileged instructions."

  - id: q04
    bloom: understand
    difficulty: medium
    text: "How do Intel VT-x/AMD-V help with virtualisation?"
    options:
      - "They increase CPU speed"
      - "They provide hardware virtualisation modes and configurable exits between guest and hypervisor"
      - "They encrypt data"
      - "They manage memory"
    correct: 1
    explanation: "Intel VMX distinguishes root and non-root operation while keeping privilege rings 0–3 within those modes; ring -1 is an informal analogy. AMD SVM has its own host/guest mechanism. Exit cost remains workload-dependent."

  - id: q05
    bloom: understand
    difficulty: medium
    text: "What is the role of a shadow page table when second-level hardware paging is unavailable?"
    options:
      - "A backup copy"
      - "The hypervisor maintains guest-virtual → host-physical translation for performance"
      - "A type of encryption"
      - "It is not necessary"
    correct: 1
    explanation: "Guest has its own PT (guest VA→guest PA). Shadow PT: guest VA→host PA, for hardware MMU."

  - id: q06
    bloom: understand
    difficulty: medium
    text: "What advantage does EPT/NPT (Extended Page Tables) offer?"
    options:
      - "More memory"
      - "Hardware supports guest-physical to host-physical translation, reducing the need to maintain combined shadow translations"
      - "Improved security"
      - "It offers no advantages"
    correct: 1
    explanation: "EPT/NPT supports two-dimensional translation: guest VA→guest PA and guest PA→host PA. The hypervisor still maintains mappings and handles faults and invalidation; translation walks and exits retain costs."

  - id: q07
    bloom: understand
    difficulty: medium
    text: "Why are containers more lightweight than VMs?"
    options:
      - "They are not more lightweight"
      - "Containers share the host kernel; VMs each have their own kernel and OS"
      - "Containers have no isolation"
      - "VMs are older"
    correct: 1
    explanation: "Container: isolated processes (namespaces, cgroups), without full OS overhead."

  - id: q08
    bloom: understand
    difficulty: medium
    text: "What Linux mechanisms do containers use for isolation?"
    options:
      - "Hardware virtualisation"
      - "Namespaces (resource isolation) and cgroups (resource limits)"
      - "Shadow page tables"
      - "Type 2 hypervisor"
    correct: 1
    explanation: "Namespaces: isolate PID, network, mount, etc. Cgroups: limit CPU, memory, I/O."

  - id: q09
    bloom: analyse
    difficulty: hard
    text: "When is full virtualisation preferred over containers?"
    options:
      - "Always"
      - "When you need supported guest kernels or a boundary that separates guest kernels from the host"
      - "When you want maximum performance"
      - "Never"
    correct: 1
    explanation: "VMs separate guest kernels through a hypervisor; ordinary containers share the host kernel. Security depends on implementation, configuration and threat model; neither provides an absolute isolation guarantee."

  - id: q10
    bloom: analyse
    difficulty: hard
    text: "What is the main overhead of full virtualisation without hardware support?"
    options:
      - "There is no overhead"
      - "Trap-and-emulate for privileged instructions: each trap is costly"
      - "Network consumption"
      - "Disk space"
    correct: 1
    explanation: "Software virtualisation may combine trap-and-emulate with binary translation for sensitive instructions. Hardware support makes interception configurable but does not eliminate VM-exit cost."

  - id: q11
    bloom: analyse
    difficulty: hard
    text: "How can pre-copy live migration reduce, rather than eliminate, VM downtime?"
    options:
      - "It is not possible"
      - "Memory is copied incrementally while the VM runs, then a short freeze for final state"
      - "The VM has no state"
      - "It uses encryption"
    correct: 1
    explanation: "Pre-copy: copies RAM iteratively. Short VM stop, copy remaining dirty pages, resume on new host."

  - id: q12
    bloom: apply
    difficulty: hard
    text: "You have a server with 64GB RAM and want to run 100 isolated instances of the same application. What do you choose?"
    options:
      - "100 full VMs"
      - "Consider containers sharing the kernel, then verify the per-instance workload memory and required isolation"
      - "100 processes without isolation"
      - "It is not possible"
    correct: 1
    explanation: "The original ~10–50 MB container and ~1 GB VM values are illustrative inputs with unverified provenance. Total memory must include workload working sets, shared pages and host overhead. 64 GB alone does not establish whether either 100-instance design fits."
