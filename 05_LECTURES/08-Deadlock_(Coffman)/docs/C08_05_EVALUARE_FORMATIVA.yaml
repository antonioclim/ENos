# Course 8: Deadlock (Coffman Conditions)
# Formative Assessment — Conceptual Quiz

metadata:
  course: 8
  subject: "Deadlock (Coffman Conditions)"
  version: "2.0"
  creation_date: "2026-01-28"
  author: "by Revolvix"
  number_of_questions: 12
  estimated_time_minutes: 15
  bloom_distribution:
    remember: 3
    understand: 5
    analyse: 3
    apply: 1

questions:
  # ═══════════════════════════════════════════════════════════════════════════
  # REMEMBER (3 questions)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: q01
    bloom: remember
    difficulty: easy
    text: "What is a deadlock?"
    options:
      - "A computer virus"
      - "A situation in which processes mutually block each other, waiting for resources held by the others"
      - "A compilation error"
      - "A type of memory"
    correct: 1
    explanation: "Deadlock = impasse: each process waits for a resource held by another process in the group."

  - id: q02
    bloom: remember
    difficulty: easy
    text: "What are the 4 Coffman conditions for deadlock?"
    options:
      - "Read, write, execute, delete"
      - "Mutual exclusion, hold and wait, no preemption, circular wait"
      - "Lock, unlock, signal, wait"
      - "Create, destroy, modify, access"
    correct: 1
    explanation: "All 4 must be true simultaneously for deadlock to be possible."

  - id: q03
    bloom: remember
    difficulty: easy
    text: "What is a Resource Allocation Graph (RAG)?"
    options:
      - "A sorting algorithm"
      - "A graph showing allocation and request relationships between processes and resources"
      - "A type of memory"
      - "A network protocol"
    correct: 1
    explanation: "RAG: nodes = processes and resources, edges = allocations and requests. A cycle indicates potential deadlock."

  # ═══════════════════════════════════════════════════════════════════════════
  # UNDERSTAND (5 questions)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: q04
    bloom: understand
    difficulty: medium
    text: "How can the 'circular wait' condition be prevented?"
    options:
      - "By encrypting resources"
      - "By imposing a total order on resource acquisition"
      - "By increasing memory"
      - "By disabling interrupts"
    correct: 1
    explanation: "If all processes acquire resources in the same order, a cycle cannot form."

  - id: q05
    bloom: understand
    difficulty: medium
    text: "What does 'hold and wait' mean and how can it be eliminated?"
    options:
      - "Hold and wait = busy waiting"
      - "A process that holds resources and waits for others; eliminated through atomic acquisition (all or nothing)"
      - "It is an optimisation method"
      - "It cannot be eliminated"
    correct: 1
    explanation: "Solution: the process requests all resources simultaneously, or releases held ones before requesting others."

  - id: q06
    bloom: understand
    difficulty: medium
    text: "What is a 'safe' state in the context of the Banker's Algorithm?"
    options:
      - "The system has no viruses"
      - "There exists an execution sequence in which all processes can complete"
      - "Memory is sufficient"
      - "The CPU is not overloaded"
    correct: 1
    explanation: "Safe state = at least one safe sequence exists: processes complete without deadlock."

  - id: q07
    bloom: understand
    difficulty: medium
    text: "Why is the Banker's Algorithm not frequently used in practice?"
    options:
      - "It is too simple"
      - "It requires a priori knowledge of maximum resource requirements, which are rarely known"
      - "It does not work on multi-core systems"
      - "It consumes too much memory"
    correct: 1
    explanation: "Modern programmes do not declare maximum resources; plus the computational overhead on each request."

  - id: q08
    bloom: understand
    difficulty: medium
    text: "What is the difference between deadlock prevention and deadlock avoidance?"
    options:
      - "They are identical"
      - "Prevention permanently eliminates one condition; avoidance dynamically checks each request"
      - "Prevention is slower"
      - "Avoidance does not work"
    correct: 1
    explanation: "Prevention: structurally impossible. Avoidance: permits requests only if the system remains safe."

  # ═══════════════════════════════════════════════════════════════════════════
  # ANALYSE (3 questions)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: q09
    bloom: analyse
    difficulty: hard
    text: "In a RAG with a single instance per resource, what does the presence of a cycle indicate?"
    options:
      - "Good performance"
      - "Guaranteed deadlock"
      - "Possible deadlock"
      - "No problem"
    correct: 1
    explanation: "With single instances, a cycle in RAG = certain deadlock. With multiple instances, the cycle is only necessary, not sufficient."

  - id: q10
    bloom: analyse
    difficulty: hard
    text: "Why can resource 'preemption' be impossible for certain resources?"
    options:
      - "It is always possible"
      - "Some resources (printer mid-print, mutexes) cannot be preempted without corrupting state"
      - "Preemption is too fast"
      - "It requires special hardware"
    correct: 1
    explanation: "Non-preemptable resources: cannot be forcibly taken without losing work or corrupting state."

  - id: q11
    bloom: analyse
    difficulty: hard
    text: "A system uses detection + recovery for deadlock. What is the trade-off?"
    options:
      - "There is no trade-off"
      - "Less overhead in normal operation, but recovery (kill/rollback) can be costly"
      - "It is always better than prevention"
      - "It does not work"
    correct: 1
    explanation: "Detection runs periodically; recovery involves process termination or rollback, both with costs."

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLY (1 question)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: q12
    bloom: apply
    difficulty: hard
    text: "You have 2 processes and 2 locks (A, B). P1 acquires A then B; P2 acquires B then A. How do you prevent deadlock?"
    options:
      - "Use more locks"
      - "Both processes acquire in the same order: A then B"
      - "Remove the locks"
      - "Increase P1's priority"
    correct: 1
    explanation: "Consistent global order (A < B) eliminates circular wait: both request A first, then B."
