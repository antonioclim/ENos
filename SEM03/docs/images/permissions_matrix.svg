<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" xml:lang="en" aria-labelledby="sem03-permissions-matrix-title sem03-permissions-matrix-desc">
  <title id="sem03-permissions-matrix-title">Unix Permissions Matrix</title><desc id="sem03-permissions-matrix-desc">A separate file-type character precedes user, group and other permission triplets. Within each triplet read, write and execute contribute 4, 2 and 1. The example rwx r-x r-- maps to 754. These bits are one part of actual access control.</desc><defs>
    <linearGradient id="sem03-permissions-matrix-headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748"/>
      <stop offset="100%" style="stop-color:#1A202C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0D1117"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="monospace" font-size="22" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-1">Unix Permissions Matrix</text>
  
  <!-- Permission String Visual -->
  <rect x="50" y="55" width="700" height="80" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <!-- Labels under permission string -->
  <text x="250" y="115" font-family="monospace" font-size="10" fill="#b7c1cc" text-anchor="middle" id="sem03-permissions-matrix-text-2">type</text>
  <text x="330" y="115" font-family="monospace" font-size="10" fill="#58A6FF" text-anchor="middle" id="sem03-permissions-matrix-text-3">user</text>
  <text x="430" y="115" font-family="monospace" font-size="10" fill="#3FB950" text-anchor="middle" id="sem03-permissions-matrix-text-4">group</text>
  <text x="530" y="115" font-family="monospace" font-size="10" fill="#F0883E" text-anchor="middle" id="sem03-permissions-matrix-text-5">other</text>
  
  <!-- Brackets -->
  <path d="M 300 90 L 300 100 L 360 100 L 360 90" fill="none" stroke="#58A6FF" stroke-width="1"/>
  <path d="M 400 90 L 400 100 L 460 100 L 460 90" fill="none" stroke="#3FB950" stroke-width="1"/>
  <path d="M 500 90 L 500 100 L 560 100 L 560 90" fill="none" stroke="#F0883E" stroke-width="1"/>
  
  <!-- Main Matrix -->
  <rect x="50" y="145" width="700" height="200" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  
  <!-- Matrix Headers -->
  <text x="210" y="175" font-family="monospace" font-size="14" fill="#58A6FF" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-6">User (u)</text>
  <text x="350" y="175" font-family="monospace" font-size="14" fill="#3FB950" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-7">Group (g)</text>
  <text x="520" y="175" font-family="monospace" font-size="14" fill="#F0883E" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-8">Other (o)</text>
  <text x="680" y="175" font-family="monospace" font-size="14" fill="#A371F7" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-9">Octal</text>
  
  <!-- Row: Read -->
  <text x="70" y="210" font-family="monospace" font-size="13" fill="#E6EDF3" id="sem03-permissions-matrix-text-10">r (read)</text>
  <text x="210" y="210" font-family="monospace" font-size="16" fill="#58A6FF" text-anchor="middle" id="sem03-permissions-matrix-text-11">r = 4</text>
  <text x="350" y="210" font-family="monospace" font-size="16" fill="#3FB950" text-anchor="middle" id="sem03-permissions-matrix-text-12">r = 4</text>
  <text x="520" y="210" font-family="monospace" font-size="16" fill="#F0883E" text-anchor="middle" id="sem03-permissions-matrix-text-13">r = 4</text>
  <text x="680" y="210" font-family="monospace" font-size="14" fill="#A371F7" text-anchor="middle" id="sem03-permissions-matrix-text-14">4</text>
  
  <!-- Row: Write -->
  <text x="70" y="250" font-family="monospace" font-size="13" fill="#E6EDF3" id="sem03-permissions-matrix-text-15">w (write)</text>
  <text x="210" y="250" font-family="monospace" font-size="16" fill="#58A6FF" text-anchor="middle" id="sem03-permissions-matrix-text-16">w = 2</text>
  <text x="350" y="250" font-family="monospace" font-size="16" fill="#3FB950" text-anchor="middle" id="sem03-permissions-matrix-text-17">w = 2</text>
  <text x="520" y="250" font-family="monospace" font-size="16" fill="#F0883E" text-anchor="middle" id="sem03-permissions-matrix-text-18">w = 2</text>
  <text x="680" y="250" font-family="monospace" font-size="14" fill="#A371F7" text-anchor="middle" id="sem03-permissions-matrix-text-19">2</text>
  
  <!-- Row: Execute -->
  <text x="70" y="290" font-family="monospace" font-size="13" fill="#E6EDF3" id="sem03-permissions-matrix-text-20">x (execute)</text>
  <text x="210" y="290" font-family="monospace" font-size="16" fill="#58A6FF" text-anchor="middle" id="sem03-permissions-matrix-text-21">x = 1</text>
  <text x="350" y="290" font-family="monospace" font-size="16" fill="#3FB950" text-anchor="middle" id="sem03-permissions-matrix-text-22">x = 1</text>
  <text x="520" y="290" font-family="monospace" font-size="16" fill="#F0883E" text-anchor="middle" id="sem03-permissions-matrix-text-23">x = 1</text>
  <text x="680" y="290" font-family="monospace" font-size="14" fill="#A371F7" text-anchor="middle" id="sem03-permissions-matrix-text-24">1</text>
  
  <!-- Example Row -->
  <line x1="60" y1="310" x2="740" y2="310" stroke="#30363D" stroke-width="1"/>
  <text x="70" y="335" font-family="monospace" font-size="13" fill="#7EE787" id="sem03-permissions-matrix-text-25">Example</text>
  <text x="210" y="335" font-family="monospace" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-permissions-matrix-text-26">4+2+1=7</text>
  <text x="350" y="335" font-family="monospace" font-size="14" fill="#3FB950" text-anchor="middle" id="sem03-permissions-matrix-text-27">4+0+1=5</text>
  <text x="520" y="335" font-family="monospace" font-size="14" fill="#F0883E" text-anchor="middle" id="sem03-permissions-matrix-text-28">4+0+0=4</text>
  <text x="680" y="335" font-family="monospace" font-size="16" fill="#A371F7" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-29">754</text>
  
  <!-- Common Permissions Table -->
  <rect x="50" y="365" width="340" height="220" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="220" y="395" font-family="monospace" font-size="14" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-30">Common Permission Patterns</text>
  
  <text x="70" y="425" font-family="monospace" font-size="12" fill="#A371F7" id="sem03-permissions-matrix-text-31">755</text>
  <text x="130" y="425" font-family="monospace" font-size="12" fill="#b7c1cc" id="sem03-permissions-matrix-text-32">rwxr-xr-x</text>
  <text x="235" y="425" font-family="monospace" font-size="10" fill="#E6EDF3" id="sem03-permissions-matrix-text-33">Scripts / directories</text>
  
  <text x="70" y="455" font-family="monospace" font-size="12" fill="#A371F7" id="sem03-permissions-matrix-text-34">644</text>
  <text x="130" y="455" font-family="monospace" font-size="12" fill="#b7c1cc" id="sem03-permissions-matrix-text-35">rw-r--r--</text>
  <text x="235" y="455" font-family="monospace" font-size="10" fill="#E6EDF3" id="sem03-permissions-matrix-text-36">Regular files</text>
  
  <text x="70" y="485" font-family="monospace" font-size="12" fill="#A371F7" id="sem03-permissions-matrix-text-37">700</text>
  <text x="130" y="485" font-family="monospace" font-size="12" fill="#b7c1cc" id="sem03-permissions-matrix-text-38">rwx------</text>
  <text x="235" y="485" font-family="monospace" font-size="10" fill="#E6EDF3" id="sem03-permissions-matrix-text-39">Private scripts</text>
  
  <text x="70" y="515" font-family="monospace" font-size="12" fill="#A371F7" id="sem03-permissions-matrix-text-40">600</text>
  <text x="130" y="515" font-family="monospace" font-size="12" fill="#b7c1cc" id="sem03-permissions-matrix-text-41">rw-------</text>
  <text x="235" y="515" font-family="monospace" font-size="10" fill="#E6EDF3" id="sem03-permissions-matrix-text-42">SSH keys, secrets</text>
  
  <text x="70" y="545" font-family="monospace" font-size="12" fill="#F85149" id="sem03-permissions-matrix-text-43">777</text>
  <text x="130" y="545" font-family="monospace" font-size="12" fill="#b7c1cc" id="sem03-permissions-matrix-text-44">rwxrwxrwx</text>
  <text x="235" y="545" font-family="monospace" font-size="10" fill="#F85149" id="sem03-permissions-matrix-text-45">World-writable: review</text>
  
  <!-- chmod Commands -->
  <rect x="410" y="365" width="340" height="220" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="580" y="395" font-family="monospace" font-size="14" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-permissions-matrix-text-46">chmod Syntax</text>
  
  <text x="430" y="430" font-family="monospace" font-size="13" fill="#7EE787" id="sem03-permissions-matrix-text-47">Octal:</text>
  <text x="430" y="455" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-permissions-matrix-text-48">chmod 755 file.sh</text>
  <text x="430" y="480" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-permissions-matrix-text-49">chmod 644 data.txt</text>
  
  <text x="430" y="515" font-family="monospace" font-size="13" fill="#7EE787" id="sem03-permissions-matrix-text-50">Symbolic:</text>
  <text x="430" y="540" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-permissions-matrix-text-51">chmod u+x script.sh</text>
  <text x="430" y="565" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-permissions-matrix-text-52">chmod go-w file.txt</text>
<text x="250" y="85" font-family="monospace" font-size="28" fill="#E6EDF3" text-anchor="middle" id="sem03-permissions-matrix-text-53">-</text><text x="330" y="85" font-family="monospace" font-size="28" fill="#E6EDF3" text-anchor="middle" id="sem03-permissions-matrix-text-54">rwx</text><text x="430" y="85" font-family="monospace" font-size="28" fill="#E6EDF3" text-anchor="middle" id="sem03-permissions-matrix-text-55">r-x</text><text x="530" y="85" font-family="monospace" font-size="28" fill="#E6EDF3" text-anchor="middle" id="sem03-permissions-matrix-text-56">r--</text></svg>
