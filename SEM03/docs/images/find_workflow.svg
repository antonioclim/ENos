<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" xml:lang="en" aria-labelledby="sem03-find-workflow-title sem03-find-workflow-desc">
  <title id="sem03-find-workflow-title">find Command Workflow</title><desc id="sem03-find-workflow-desc">find starts from a path, evaluates tests and performs actions. Separate labels align with the example path, type, name, size, age and print action. GNU find size M units and completed-day mtime semantics must be considered when reading the tests.</desc><defs>
    <marker id="sem03-find-workflow-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <linearGradient id="sem03-find-workflow-boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748"/>
      <stop offset="100%" style="stop-color:#1A202C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0D1117"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="monospace" font-size="24" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-find-workflow-text-1">find Command Workflow</text>
  
  <!-- Start Path Box -->
  <rect x="50" y="80" width="140" height="70" rx="8" fill="url(#sem03-find-workflow-boxGrad)" stroke="#58A6FF" stroke-width="2"/>
  <text x="120" y="110" font-family="monospace" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-2">START_PATH</text>
  <text x="120" y="135" font-family="monospace" font-size="12" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-3">. /home /var</text>
  
  <!-- Arrow 1 -->
  <line x1="190" y1="115" x2="240" y2="115" stroke="#4A90D9" stroke-width="2" marker-end="url(#sem03-find-workflow-arrowhead)"/>
  
  <!-- Tests Box -->
  <rect x="250" y="70" width="180" height="90" rx="8" fill="url(#sem03-find-workflow-boxGrad)" stroke="#F0883E" stroke-width="2"/>
  <text x="340" y="100" font-family="monospace" font-size="14" fill="#F0883E" text-anchor="middle" id="sem03-find-workflow-text-4">TESTS (filters)</text>
  <text x="340" y="125" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-5">-name -type -size</text>
  <text x="340" y="145" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-6">-mtime -perm -user</text>
  
  <!-- Arrow 2 -->
  <line x1="430" y1="115" x2="480" y2="115" stroke="#4A90D9" stroke-width="2" marker-end="url(#sem03-find-workflow-arrowhead)"/>
  
  <!-- Actions Box -->
  <rect x="490" y="70" width="160" height="90" rx="8" fill="url(#sem03-find-workflow-boxGrad)" stroke="#3FB950" stroke-width="2"/>
  <text x="570" y="100" font-family="monospace" font-size="14" fill="#3FB950" text-anchor="middle" id="sem03-find-workflow-text-7">ACTIONS</text>
  <text x="570" y="125" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-8">-print -exec</text>
  <text x="570" y="145" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-9">-delete -printf</text>
  
  <!-- Arrow 3 -->
  <line x1="650" y1="115" x2="700" y2="115" stroke="#4A90D9" stroke-width="2" marker-end="url(#sem03-find-workflow-arrowhead)"/>
  
  <!-- Output Box -->
  <rect x="710" y="80" width="70" height="70" rx="8" fill="url(#sem03-find-workflow-boxGrad)" stroke="#A371F7" stroke-width="2"/>
  <text x="745" y="120" font-family="monospace" font-size="14" fill="#A371F7" text-anchor="middle" id="sem03-find-workflow-text-10">OUT</text>
  
  <!-- Example Section -->
  <rect x="50" y="200" width="700" height="120" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="70" y="230" font-family="monospace" font-size="14" fill="#7EE787" id="sem03-find-workflow-text-11">Example:</text>
  <!-- Logical Operators Section -->
  <rect x="50" y="340" width="340" height="140" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="70" y="370" font-family="monospace" font-size="14" fill="#F0883E" id="sem03-find-workflow-text-12">Logical Operators:</text>
  <text x="70" y="400" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-13">-a / -and   (implicit between tests)</text>
  <text x="70" y="425" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-14">-o / -or    (explicit OR)</text>
  <text x="70" y="450" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-15">! / -not    (negation)</text>
  <text x="70" y="475" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-16">\( \)       (grouping)</text>
  
  <!-- Tips Section -->
  <rect x="410" y="340" width="340" height="140" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="430" y="370" font-family="monospace" font-size="14" fill="#3FB950" id="sem03-find-workflow-text-17">Best Practices:</text>
  <text x="430" y="400" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-find-workflow-text-18">• Quote patterns: -name "*.txt"</text>
  <text x="430" y="425" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-find-workflow-text-19">• Use -type f for files only</text>
  <text x="430" y="450" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-find-workflow-text-20">• Test with -print before -delete</text>
  <text x="430" y="475" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-find-workflow-text-21">• NUL delimiters support arbitrary names</text>
<text x="70" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-22">find</text><text x="122" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-23">/var/log</text><text x="147" y="285" font-family="Arial, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-24">↑</text><text x="147" y="306" font-family="Arial, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-25">path</text><text x="230" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-26">-type f</text><text x="255" y="285" font-family="Arial, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-27">↑</text><text x="255" y="306" font-family="Arial, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-28">type</text><text x="325" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-29">-name "*.log"</text><text x="350" y="285" font-family="Arial, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-30">↑</text><text x="350" y="306" font-family="Arial, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-31">name</text><text x="470" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-32">-size +10M</text><text x="495" y="285" font-family="Arial, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-33">↑</text><text x="495" y="306" font-family="Arial, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-34">size</text><text x="580" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-35">-mtime -7</text><text x="605" y="285" font-family="Arial, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-36">↑</text><text x="605" y="306" font-family="Arial, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-37">age</text><text x="690" y="260" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-find-workflow-text-38">-print</text><text x="715" y="285" font-family="Arial, sans-serif" font-size="14" fill="#58A6FF" text-anchor="middle" id="sem03-find-workflow-text-39">↑</text><text x="715" y="306" font-family="Arial, sans-serif" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-find-workflow-text-40">action</text></svg>
