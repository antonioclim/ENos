<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" xml:lang="en" aria-labelledby="sem03-cron-schedule-title sem03-cron-schedule-desc">
  <title id="sem03-cron-schedule-title">Crontab Schedule Format</title><desc id="sem03-cron-schedule-desc">Five fields select minute, hour, day of month, month and weekday before a user-crontab command. The diagram gives ranges, list, range and step examples. Scheduling depends on the cron implementation and timezone; traditional cron combines restricted day-of-month and weekday fields with OR.</desc><!-- Background -->
  <rect width="800" height="550" fill="#0D1117"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="monospace" font-size="22" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-cron-schedule-text-1">Crontab Schedule Format</text>
  
  <!-- Main Cron Format Display -->
  <rect x="50" y="55" width="700" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  
  <!-- The 5 fields + command -->
  <text x="100" y="95" font-family="monospace" font-size="28" fill="#58A6FF" text-anchor="middle" id="sem03-cron-schedule-text-2">*</text>
  <text x="180" y="95" font-family="monospace" font-size="28" fill="#3FB950" text-anchor="middle" id="sem03-cron-schedule-text-3">*</text>
  <text x="260" y="95" font-family="monospace" font-size="28" fill="#F0883E" text-anchor="middle" id="sem03-cron-schedule-text-4">*</text>
  <text x="340" y="95" font-family="monospace" font-size="28" fill="#A371F7" text-anchor="middle" id="sem03-cron-schedule-text-5">*</text>
  <text x="420" y="95" font-family="monospace" font-size="28" fill="#F85149" text-anchor="middle" id="sem03-cron-schedule-text-6">*</text>
  <text x="580" y="95" font-family="monospace" font-size="20" fill="#E6EDF3" text-anchor="middle" id="sem03-cron-schedule-text-7">/path/to/command</text>
  
  <!-- Labels -->
  <text x="100" y="125" font-family="monospace" font-size="10" fill="#58A6FF" text-anchor="middle" id="sem03-cron-schedule-text-8">minute</text>
  <text x="180" y="125" font-family="monospace" font-size="10" fill="#3FB950" text-anchor="middle" id="sem03-cron-schedule-text-9">hour</text>
  <text x="260" y="125" font-family="monospace" font-size="10" fill="#F0883E" text-anchor="middle" id="sem03-cron-schedule-text-10">day</text>
  <text x="340" y="125" font-family="monospace" font-size="10" fill="#A371F7" text-anchor="middle" id="sem03-cron-schedule-text-11">month</text>
  <text x="420" y="125" font-family="monospace" font-size="10" fill="#F85149" text-anchor="middle" id="sem03-cron-schedule-text-12">weekday</text>
  <text x="580" y="125" font-family="monospace" font-size="10" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-13">command</text>
  
  <!-- Ranges -->
  <text x="100" y="145" font-family="monospace" font-size="9" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-14">0-59</text>
  <text x="180" y="145" font-family="monospace" font-size="9" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-15">0-23</text>
  <text x="260" y="145" font-family="monospace" font-size="9" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-16">1-31</text>
  <text x="340" y="145" font-family="monospace" font-size="9" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-17">1-12</text>
  <text x="420" y="145" font-family="monospace" font-size="9" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-18">0-7</text>
  
  <!-- Special Characters -->
  <rect x="50" y="170" width="340" height="160" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="220" y="195" font-family="monospace" font-size="14" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-cron-schedule-text-19">Special Characters</text>
  
  <text x="70" y="225" font-family="monospace" font-size="13" fill="#58A6FF" id="sem03-cron-schedule-text-20">*</text>
  <text x="100" y="225" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-21">any value</text>
  <text x="250" y="225" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-cron-schedule-text-22">* * * * * (every min)</text>
  
  <text x="70" y="255" font-family="monospace" font-size="13" fill="#3FB950" id="sem03-cron-schedule-text-23">,</text>
  <text x="100" y="255" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-24">list</text>
  <text x="250" y="255" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-cron-schedule-text-25">0,30 * * * *</text>
  
  <text x="70" y="285" font-family="monospace" font-size="13" fill="#F0883E" id="sem03-cron-schedule-text-26">-</text>
  <text x="100" y="285" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-27">range</text>
  <text x="250" y="285" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-cron-schedule-text-28">0 9-17 * * *</text>
  
  <text x="70" y="315" font-family="monospace" font-size="13" fill="#A371F7" id="sem03-cron-schedule-text-29">/</text>
  <text x="100" y="315" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-30">step</text>
  <text x="250" y="315" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-cron-schedule-text-31">*/15 * * * *</text>
  
  <!-- Weekday Reference -->
  <rect x="410" y="170" width="340" height="160" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="580" y="195" font-family="monospace" font-size="14" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-cron-schedule-text-32">Weekday Values</text>
  
  <text x="430" y="225" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-33">0</text>
  <text x="460" y="225" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-34">Sunday</text>
  <text x="560" y="225" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-35">4</text>
  <text x="590" y="225" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-36">Thursday</text>
  
  <text x="430" y="250" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-37">1</text>
  <text x="460" y="250" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-38">Monday</text>
  <text x="560" y="250" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-39">5</text>
  <text x="590" y="250" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-40">Friday</text>
  
  <text x="430" y="275" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-41">2</text>
  <text x="460" y="275" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-42">Tuesday</text>
  <text x="560" y="275" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-43">6</text>
  <text x="590" y="275" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-44">Saturday</text>
  
  <text x="430" y="300" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-45">3</text>
  <text x="460" y="300" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-46">Wednesday</text>
  <text x="560" y="300" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-47">7</text>
  <text x="590" y="300" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-48">Sunday</text>
  
  <text x="580" y="320" font-family="monospace" font-size="10" fill="#b7c1cc" text-anchor="middle" id="sem03-cron-schedule-text-49">(0 and 7 both = Sunday)</text>
  
  <!-- Common Examples -->
  <rect x="50" y="345" width="700" height="190" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="400" y="375" font-family="monospace" font-size="14" fill="#7EE787" text-anchor="middle" font-weight="bold" id="sem03-cron-schedule-text-50">Common Examples</text>
  
  <text x="70" y="405" font-family="monospace" font-size="12" fill="#58A6FF" id="sem03-cron-schedule-text-51">0 * * * *</text>
  <text x="250" y="405" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-52">Every hour (at minute 0)</text>
  
  <text x="70" y="430" font-family="monospace" font-size="12" fill="#3FB950" id="sem03-cron-schedule-text-53">0 0 * * *</text>
  <text x="250" y="430" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-54">Daily at midnight</text>
  
  <text x="70" y="455" font-family="monospace" font-size="12" fill="#F0883E" id="sem03-cron-schedule-text-55">0 3 * * 0</text>
  <text x="250" y="455" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-56">Sunday at 3 AM</text>
  
  <text x="70" y="480" font-family="monospace" font-size="12" fill="#A371F7" id="sem03-cron-schedule-text-57">30 4 1 * *</text>
  <text x="250" y="480" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-58">1st of month at 4:30 AM</text>
  
  <text x="70" y="505" font-family="monospace" font-size="12" fill="#F85149" id="sem03-cron-schedule-text-59">*/5 * * * *</text>
  <text x="250" y="505" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-60">Every 5 minutes</text>
  
  <text x="70" y="530" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-61">0 9-17 * * 1-5</text>
  <text x="250" y="530" font-family="monospace" font-size="12" fill="#E6EDF3" id="sem03-cron-schedule-text-62">Hourly 9AM-5PM, Mon-Fri</text>
  
  <!-- Best Practices -->
  <text x="480" y="405" font-family="monospace" font-size="11" fill="#7EE787" id="sem03-cron-schedule-text-63">✓ Use absolute paths</text>
  <text x="480" y="430" font-family="monospace" font-size="11" fill="#7EE787" id="sem03-cron-schedule-text-64">✓ Example: &gt;&gt; log 2&gt;&amp;1</text>
  <text x="480" y="455" font-family="monospace" font-size="11" fill="#7EE787" id="sem03-cron-schedule-text-65">✓ Escape % as \%</text>
  <text x="480" y="480" font-family="monospace" font-size="11" fill="#F85149" id="sem03-cron-schedule-text-66">✓ Set a working directory</text>
  <text x="480" y="505" font-family="monospace" font-size="11" fill="#F85149" id="sem03-cron-schedule-text-67">✓ Choose an output policy</text>
</svg>
