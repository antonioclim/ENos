<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" width="800" height="630" role="img" xml:lang="en" aria-labelledby="sem03-xargs-vs-exec-title sem03-xargs-vs-exec-desc">
  <title id="sem03-xargs-vs-exec-title">-exec \; vs -exec + vs xargs</title><desc id="sem03-xargs-vs-exec-desc">The semicolon form invokes a command per matched path. The plus form and xargs can batch several paths per invocation, limited by argument and environment size. NUL separation handles arbitrary filenames. The three-file sketch is illustrative, not a fixed process-count guarantee.</desc><defs>
    <marker id="sem03-xargs-vs-exec-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="630" fill="#0D1117"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="monospace" font-size="22" fill="#E6EDF3" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-1">-exec \; vs -exec + vs xargs</text>
  
  <!-- Section 1: -exec \; -->
  <rect x="30" y="60" width="240" height="180" rx="8" fill="#161B22" stroke="#F85149" stroke-width="2"/>
  <text x="150" y="90" font-family="monospace" font-size="14" fill="#F85149" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-2">-exec cmd {} \;</text>
  <text x="150" y="115" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-xargs-vs-exec-text-3">One process per file</text>
  
  <!-- Diagram for \; -->
  <rect x="50" y="130" width="60" height="25" rx="4" fill="#2D3748" stroke="#58A6FF"/>
  <text x="80" y="147" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-4">file1</text>
  <line x1="110" y1="142" x2="140" y2="142" stroke="#4A90D9" stroke-width="1" marker-end="url(#sem03-xargs-vs-exec-arrow)"/>
  <rect x="145" y="130" width="45" height="25" rx="4" fill="#1F4529" stroke="#3FB950"/>
  <text x="167" y="147" font-family="monospace" font-size="9" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-5">rm</text>
  
  <rect x="50" y="160" width="60" height="25" rx="4" fill="#2D3748" stroke="#58A6FF"/>
  <text x="80" y="177" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-6">file2</text>
  <line x1="110" y1="172" x2="140" y2="172" stroke="#4A90D9" stroke-width="1" marker-end="url(#sem03-xargs-vs-exec-arrow)"/>
  <rect x="145" y="160" width="45" height="25" rx="4" fill="#1F4529" stroke="#3FB950"/>
  <text x="167" y="177" font-family="monospace" font-size="9" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-7">rm</text>
  
  <rect x="50" y="190" width="60" height="25" rx="4" fill="#2D3748" stroke="#58A6FF"/>
  <text x="80" y="207" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-8">file3</text>
  <line x1="110" y1="202" x2="140" y2="202" stroke="#4A90D9" stroke-width="1" marker-end="url(#sem03-xargs-vs-exec-arrow)"/>
  <rect x="145" y="190" width="45" height="25" rx="4" fill="#1F4529" stroke="#3FB950"/>
  <text x="167" y="207" font-family="monospace" font-size="9" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-9">rm</text>
  
  <text x="200" y="145" font-family="monospace" font-size="18" fill="#F85149" id="sem03-xargs-vs-exec-text-10">}</text>
  <text x="150" y="225" font-family="monospace" font-size="10" fill="#c9d1d9" text-anchor="middle" id="sem03-xargs-vs-exec-text-11">3-name example</text>
  
  <!-- Section 2: -exec + -->
  <rect x="280" y="60" width="240" height="180" rx="8" fill="#161B22" stroke="#3FB950" stroke-width="2"/>
  <text x="400" y="90" font-family="monospace" font-size="14" fill="#3FB950" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-12">-exec cmd {} +</text>
  <text x="400" y="115" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-xargs-vs-exec-text-13">One invocation per batch</text>
  
  <!-- Diagram for + -->
  <rect x="300" y="130" width="60" height="25" rx="4" fill="#2D3748" stroke="#58A6FF"/>
  <text x="330" y="147" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-14">file1</text>
  
  <rect x="300" y="160" width="60" height="25" rx="4" fill="#2D3748" stroke="#58A6FF"/>
  <text x="330" y="177" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-15">file2</text>
  
  <rect x="300" y="190" width="60" height="25" rx="4" fill="#2D3748" stroke="#58A6FF"/>
  <text x="330" y="207" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-16">file3</text>
  
  <line x1="360" y1="142" x2="420" y2="172" stroke="#4A90D9" stroke-width="1"/>
  <line x1="360" y1="172" x2="420" y2="172" stroke="#4A90D9" stroke-width="1"/>
  <line x1="360" y1="202" x2="420" y2="172" stroke="#4A90D9" stroke-width="1" marker-end="url(#sem03-xargs-vs-exec-arrow)"/>
  
  <rect x="425" y="157" width="80" height="30" rx="4" fill="#1F4529" stroke="#3FB950"/>
  <text x="465" y="177" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-17">rm f1 f2 f3</text>
  
  <text x="400" y="225" font-family="monospace" font-size="10" fill="#c9d1d9" text-anchor="middle" id="sem03-xargs-vs-exec-text-18">3-name example</text>
  
  <!-- Section 3: xargs -->
  <rect x="530" y="60" width="240" height="180" rx="8" fill="#161B22" stroke="#58A6FF" stroke-width="2"/>
  <text x="650" y="90" font-family="monospace" font-size="14" fill="#58A6FF" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-19">| xargs cmd</text>
  <text x="650" y="115" font-family="monospace" font-size="11" fill="#b7c1cc" text-anchor="middle" id="sem03-xargs-vs-exec-text-20">Pipe + batch</text>
  
  <!-- Diagram for xargs -->
  <rect x="550" y="135" width="60" height="70" rx="4" fill="#2D3748" stroke="#F0883E"/>
  <text x="580" y="157" font-family="monospace" font-size="9" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-21">file1</text>
  <text x="580" y="172" font-family="monospace" font-size="9" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-22">file2</text>
  <text x="580" y="187" font-family="monospace" font-size="9" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-23">file3</text>
  <text x="580" y="130" font-family="monospace" font-size="8" fill="#F0883E" text-anchor="middle" id="sem03-xargs-vs-exec-text-24">stdin</text>
  
  <line x1="610" y1="170" x2="660" y2="170" stroke="#4A90D9" stroke-width="2" marker-end="url(#sem03-xargs-vs-exec-arrow)"/>
  <text x="635" y="163" font-family="monospace" font-size="8" fill="#b7c1cc" text-anchor="middle" id="sem03-xargs-vs-exec-text-25">xargs</text>
  
  <rect x="665" y="155" width="90" height="30" rx="4" fill="#1F4529" stroke="#3FB950"/>
  <text x="710" y="175" font-family="monospace" font-size="10" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-26">rm f1 f2 f3</text>
  
  <text x="650" y="225" font-family="monospace" font-size="10" fill="#58A6FF" text-anchor="middle" id="sem03-xargs-vs-exec-text-27">flexible ✓</text>
  
  <!-- Comparison Table -->
  <rect x="30" y="260" width="740" height="170" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  
  <!-- Headers -->
  <text x="175" y="290" font-family="monospace" font-size="12" fill="#F85149" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-28">-exec {} \;</text>
  <text x="400" y="290" font-family="monospace" font-size="12" fill="#3FB950" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-29">-exec {} +</text>
  <text x="650" y="290" font-family="monospace" font-size="12" fill="#58A6FF" text-anchor="middle" font-weight="bold" id="sem03-xargs-vs-exec-text-30">xargs</text>
  
  <line x1="40" y1="300" x2="760" y2="300" stroke="#30363D" stroke-width="1"/>
  
  <!-- Row: Performance -->
  <text x="50" y="325" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-xargs-vs-exec-text-31">Invocations</text>
  <text x="175" y="325" font-family="monospace" font-size="11" fill="#F85149" text-anchor="middle" id="sem03-xargs-vs-exec-text-32">Per file</text>
  <text x="400" y="325" font-family="monospace" font-size="11" fill="#3FB950" text-anchor="middle" id="sem03-xargs-vs-exec-text-33">Per batch</text>
  <text x="650" y="325" font-family="monospace" font-size="11" fill="#3FB950" text-anchor="middle" id="sem03-xargs-vs-exec-text-34">Per batch</text>
  
  <!-- Row: Spaces -->
  <text x="50" y="355" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-xargs-vs-exec-text-35">Filenames</text>
  <text x="175" y="355" font-family="monospace" font-size="11" fill="#3FB950" text-anchor="middle" id="sem03-xargs-vs-exec-text-36">Safe</text>
  <text x="400" y="355" font-family="monospace" font-size="11" fill="#3FB950" text-anchor="middle" id="sem03-xargs-vs-exec-text-37">Safe</text>
  <text x="650" y="355" font-family="monospace" font-size="11" fill="#F0883E" text-anchor="middle" id="sem03-xargs-vs-exec-text-38">Use -print0/-0</text>
  
  <!-- Row: Use case -->
  <text x="50" y="385" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-xargs-vs-exec-text-39">Best for</text>
  <text x="175" y="385" font-family="monospace" font-size="11" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-40">Per-file ops</text>
  <text x="400" y="385" font-family="monospace" font-size="11" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-41">Batch (built-in)</text>
  <text x="650" y="385" font-family="monospace" font-size="11" fill="#E6EDF3" text-anchor="middle" id="sem03-xargs-vs-exec-text-42">Complex pipes</text>
  
  <!-- Row: Parallel -->
  <text x="50" y="415" font-family="monospace" font-size="11" fill="#b7c1cc" id="sem03-xargs-vs-exec-text-43">Parallel</text>
  <text x="175" y="415" font-family="monospace" font-size="11" fill="#F85149" text-anchor="middle" id="sem03-xargs-vs-exec-text-44">No</text>
  <text x="400" y="415" font-family="monospace" font-size="11" fill="#F85149" text-anchor="middle" id="sem03-xargs-vs-exec-text-45">No</text>
  <text x="650" y="415" font-family="monospace" font-size="11" fill="#3FB950" text-anchor="middle" id="sem03-xargs-vs-exec-text-46">-P N</text>
  
  <!-- Examples -->
  <rect x="30" y="445" width="740" height="90" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <rect x="30" y="425" width="740" height="185" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="50" y="450" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3" id="sem03-xargs-vs-exec-text-47">Examples in an owned test directory; preview matches before deletion.</text><text x="50" y="478" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-xargs-vs-exec-text-48">find . -type f -name "*.log" -exec rm -- {} \;</text><text x="50" y="496" font-family="Arial, sans-serif" font-size="10" fill="#c9d1d9" id="sem03-xargs-vs-exec-text-49">One invocation per matched file.</text><text x="50" y="525" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-xargs-vs-exec-text-50">find . -type f -name "*.log" -exec rm -- {} +</text><text x="50" y="543" font-family="Arial, sans-serif" font-size="10" fill="#c9d1d9" id="sem03-xargs-vs-exec-text-51">One or more invocations: limited by total argument/environment size.</text><text x="50" y="572" font-family="monospace" font-size="11" fill="#E6EDF3" id="sem03-xargs-vs-exec-text-52">find . -type f -name "*.log" -print0 | xargs -0 -r rm --</text><text x="50" y="590" font-family="Arial, sans-serif" font-size="10" fill="#c9d1d9" id="sem03-xargs-vs-exec-text-53">GNU xargs: NUL-separated names; -r avoids an empty-input invocation.</text></svg>
