  <title id="sem06-deployment_strategies-title">Deployment Strategies</title>
  <desc id="sem06-deployment_strategies-desc">Rolling updates need spare capacity and compatible versions. Blue-green switching needs tested routing, retained previous state and compatible data. Canary percentages describe traffic, not a fixed amount of infrastructure. No strategy guarantees zero downtime or instant rollback.</desc>
