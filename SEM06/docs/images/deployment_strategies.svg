  <text x="330" y="360" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-105">Needs spare capacity</text>
  <text x="530" y="360" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-106">Depends on routing</text>
  <text x="730" y="360" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-107">Depends on routing</text>
  <text x="150" y="385" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_deployment_strategies-text-108">Rollback action</text>
  <text x="330" y="385" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-109">Redeploy batches</text>
  <text x="530" y="385" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-110">Switch to retained</text>
  <text x="730" y="385" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-111">Remove canary route</text>
  <text x="150" y="410" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_deployment_strategies-text-112">Capacity model</text>
  <text x="330" y="410" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-113">Baseline + spare</text>
  <text x="530" y="410" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-114">Two full fleets*</text>
  <text x="730" y="410" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-115">Traffic ≠ capacity</text>
  <text x="150" y="435" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_deployment_strategies-text-116">Main complexity</text>
  <text x="330" y="435" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-117">Mixed versions</text>
  <text x="530" y="435" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-118">Two environments</text>
  <text x="730" y="435" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_deployment_strategies-text-119">Routing + evidence</text>
  <text x="150" y="460" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_deployment_strategies-text-120">Useful when</text>
  <text x="330" y="460" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_deployment_strategies-text-121">Versions coexist</text>
  <text x="530" y="460" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_deployment_strategies-text-122">Environments coexist</text>
  <text x="730" y="460" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_deployment_strategies-text-123">Changes are measurable</text>
  <text x="450" y="500" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_deployment_strategies-text-124">* Illustrative capacity: equal fleets. Routing, data and health assumptions apply.</text>
