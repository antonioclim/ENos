<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Consolas, monospace" role="img" aria-labelledby="sem06-data_flow_monitor-title sem06-data_flow_monitor-desc" xml:lang="en">
  <title id="sem06-data_flow_monitor-title">Data Flow Monitor</title>
  <desc id="sem06-data_flow_monitor-desc">A conceptual monitoring flow from Linux sources to validated metrics and threshold actions. CPU needs two samples, memory uses MemAvailable and explicit units. Example metrics are illustrative, not the runtime JSON schema. Unavailable metrics are not silently zero.</desc>
  <rect width="800" height="400" fill="#1a1a2e" />
  <text x="400" y="28" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold" id="SEM06_data_flow_monitor-text-4">Monitor Data Flow: /proc → Parsing → Alerting</text>
  <rect x="30" y="60" width="140" height="280" rx="8" fill="#0f3460" stroke="#00d9ff" stroke-width="2" />
  <text x="100" y="85" text-anchor="middle" fill="#00d9ff" font-size="13" font-weight="bold" id="SEM06_data_flow_monitor-text-6">KERNEL</text>
  <rect x="45" y="100" width="110" height="30" rx="4" fill="#1a1a3a" stroke="#4a90d9" />
  <text x="100" y="120" text-anchor="middle" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-8">/proc/stat</text>
  <rect x="45" y="140" width="110" height="30" rx="4" fill="#1a1a3a" stroke="#4a90d9" />
  <text x="100" y="160" text-anchor="middle" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-10">/proc/meminfo</text>
  <rect x="45" y="180" width="110" height="30" rx="4" fill="#1a1a3a" stroke="#4a90d9" />
  <text x="100" y="200" text-anchor="middle" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-12">/proc/diskstats</text>
  <rect x="45" y="220" width="110" height="30" rx="4" fill="#1a1a3a" stroke="#4a90d9" />
  <text x="100" y="240" text-anchor="middle" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-14">/proc/loadavg</text>
  <rect x="45" y="260" width="110" height="30" rx="4" fill="#1a1a3a" stroke="#4a90d9" />
  <text x="100" y="280" text-anchor="middle" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-16">/sys/class/*</text>
  <rect x="45" y="300" width="110" height="30" rx="4" fill="#1a1a3a" stroke="#4a90d9" />
  <text x="100" y="320" text-anchor="middle" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-18">/proc/[pid]/*</text>
  <line x1="170" y1="200" x2="210" y2="200" stroke="#4a90d9" stroke-width="2" />
  <polygon points="220,200 210,195 210,205" fill="#4a90d9" />
  <rect x="230" y="80" width="160" height="240" rx="8" fill="#16213e" stroke="#00ff88" stroke-width="2" />
  <text x="310" y="105" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold" id="SEM06_data_flow_monitor-text-22">PARSING</text>
  <text x="310" y="135" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_data_flow_monitor-text-23">CPU: two snapshots</text>
  <text x="310" y="160" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-24">MemAvailable / MemTotal</text>
  <text x="310" y="185" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_data_flow_monitor-text-25">Memory: explicit KiB</text>
  <text x="310" y="210" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_data_flow_monitor-text-26">Validate parsed fields</text>
  <text x="310" y="235" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_data_flow_monitor-text-27">Finite numeric values</text>
  <rect x="250" y="260" width="120" height="45" rx="4" fill="#1a1a3a" stroke="#ffd93d" />
  <text x="310" y="280" text-anchor="middle" fill="#ffd93d" font-size="10" id="SEM06_data_flow_monitor-text-29">Calculations:</text>
  <text x="310" y="295" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-30">100 × used / total</text>
  <line x1="390" y1="200" x2="430" y2="200" stroke="#00ff88" stroke-width="2" />
  <polygon points="440,200 430,195 430,205" fill="#00ff88" />
  <rect x="450" y="100" width="140" height="200" rx="8" fill="#16213e" stroke="#ffd93d" stroke-width="2" />
  <text x="520" y="125" text-anchor="middle" fill="#ffd93d" font-size="11" font-weight="bold" id="SEM06_data_flow_monitor-text-34">EXAMPLE METRICS</text>
  <text x="520" y="155" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_data_flow_monitor-text-35">cpu_pct=78.5</text>
  <text x="520" y="175" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_data_flow_monitor-text-36">mem_MiB=4096</text>
  <text x="520" y="195" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_data_flow_monitor-text-37">disk_free_GiB=50</text>
  <text x="520" y="215" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_data_flow_monitor-text-38">load_1min=2.5</text>
  <text x="520" y="235" text-anchor="middle" fill="#aaa" font-size="10" id="SEM06_data_flow_monitor-text-39">swap_pct=15</text>
  <rect x="465" y="255" width="110" height="35" rx="4" fill="#1a1a3a" stroke="#6c757d" />
  <text x="520" y="278" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-41">associative array</text>
  <line x1="590" y1="200" x2="630" y2="200" stroke="#ffd93d" stroke-width="2" />
  <polygon points="640,200 630,195 630,205" fill="#ffd93d" />
  <rect x="650" y="80" width="120" height="240" rx="8" fill="#16213e" stroke="#ff6b6b" stroke-width="2" />
  <text x="710" y="105" text-anchor="middle" fill="#ff9696" font-size="13" font-weight="bold" id="SEM06_data_flow_monitor-text-45">ALERTING</text>
  <polygon points="710,140 680,170 710,200 740,170" fill="#2d2d44" stroke="#ff6b6b" />
  <text x="710" y="173" text-anchor="middle" fill="#ff9696" font-size="9" id="SEM06_data_flow_monitor-text-47">&gt;thresh?</text>
  <rect x="665" y="220" width="90" height="25" rx="4" fill="#3d1f1f" stroke="#ff6b6b" />
  <text x="710" y="237" text-anchor="middle" fill="#ff9696" font-size="9" id="SEM06_data_flow_monitor-text-49">log_warn()</text>
  <rect x="665" y="255" width="90" height="25" rx="4" fill="#3d1f1f" stroke="#ff6b6b" />
  <text x="710" y="272" text-anchor="middle" fill="#ff9696" font-size="9" id="SEM06_data_flow_monitor-text-51">send_alert()</text>
  <rect x="665" y="290" width="90" height="25" rx="4" fill="#1f3d1f" stroke="#00ff88" />
  <text x="710" y="307" text-anchor="middle" fill="#00ff88" font-size="9" id="SEM06_data_flow_monitor-text-53">log_info()</text>
  <rect x="230" y="345" width="340" height="40" rx="5" fill="#0f0f1a" stroke="#3a3a5a" />
  <text x="250" y="365" fill="#80bfff" font-size="10" id="SEM06_data_flow_monitor-text-55">■</text>
  <text x="265" y="365" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-56">Kernel source</text>
  <text x="350" y="365" fill="#00ff88" font-size="10" id="SEM06_data_flow_monitor-text-57">■</text>
  <text x="365" y="365" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-58">Text processing</text>
  <text x="460" y="365" fill="#ff9696" font-size="10" id="SEM06_data_flow_monitor-text-59">■</text>
  <text x="475" y="365" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-60">Threshold check</text>
  <text x="400" y="390" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_data_flow_monitor-text-61">SEM06 — System Monitor Data Pipeline</text>
</svg>
