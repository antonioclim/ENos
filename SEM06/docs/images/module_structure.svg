<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Consolas, monospace" role="img" aria-labelledby="sem06-module_structure-title sem06-module_structure-desc" xml:lang="en">
  <title id="sem06-module_structure-title">Module Structure</title>
  <desc id="sem06-module_structure-desc">Each project entry point sources its own core, configuration and utility modules. Literal file settings are combined with defaults, environment and explicit command line overrides before validation and main work. The bottom sequence is a conceptual guide.</desc>
  <rect width="700" height="450" fill="#1a1a2e" />
  <text x="350" y="30" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold" id="SEM06_module_structure-text-4">Modular Script Architecture</text>
  <rect x="230" y="55" width="240" height="60" rx="8" fill="#0f3460" stroke="#00d9ff" stroke-width="2" />
  <text x="350" y="82" text-anchor="middle" fill="#00d9ff" font-size="14" font-weight="bold" id="SEM06_module_structure-text-6">ENTRY POINT</text>
  <text x="350" y="102" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_module_structure-text-7">monitor.sh | backup.sh | deployer.sh</text>
  <line x1="350" y1="115" x2="350" y2="140" stroke="#4a90d9" stroke-width="2" />
  <polygon points="350,150 345,140 355,140" fill="#4a90d9" />
  <text x="365" y="137" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-10">source</text>
  <rect x="50" y="155" width="600" height="130" rx="10" fill="#16213e" stroke="#ffd93d" stroke-width="2" />
  <text x="350" y="180" text-anchor="middle" fill="#ffd93d" font-size="13" font-weight="bold" id="SEM06_module_structure-text-12">LIBRARY LAYER (lib/)</text>
  <rect x="80" y="195" width="160" height="70" rx="6" fill="#1a1a3a" stroke="#00ff88" stroke-width="1.5" />
  <text x="160" y="218" text-anchor="middle" fill="#00ff88" font-size="12" font-weight="bold" id="SEM06_module_structure-text-14">core.sh</text>
  <text x="160" y="238" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-15">• log_info/warn/error</text>
  <text x="160" y="253" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-16">• die(), cleanup()</text>
  <rect x="270" y="195" width="160" height="70" rx="6" fill="#1a1a3a" stroke="#ff6b6b" stroke-width="1.5" />
  <text x="350" y="218" text-anchor="middle" fill="#ff9696" font-size="12" font-weight="bold" id="SEM06_module_structure-text-18">config.sh</text>
  <text x="350" y="238" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-19">• load_config()</text>
  <text x="350" y="253" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-20">• validate_config()</text>
  <rect x="460" y="195" width="160" height="70" rx="6" fill="#1a1a3a" stroke="#a78bfa" stroke-width="1.5" />
  <text x="540" y="218" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold" id="SEM06_module_structure-text-22">utils.sh</text>
  <text x="540" y="238" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-23">• get_cpu_usage()</text>
  <text x="540" y="253" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-24">• check_health()</text>
  <path d="M240 230 L270 230" fill="none" stroke="#99a9c5" stroke-width="1" marker-end="url(#sem06-module_structure-smallarrow)" />
  <path d="M430 230 L460 230" fill="none" stroke="#99a9c5" stroke-width="1" marker-end="url(#sem06-module_structure-smallarrow)" />
  <text x="255" y="224" fill="#c4cddd" font-size="8" text-anchor="middle" id="SEM06_module_structure-text-27">1st</text>
  <text x="445" y="224" fill="#c4cddd" font-size="8" text-anchor="middle" id="SEM06_module_structure-text-28">2nd</text>
  <defs>
    <marker id="sem06-module_structure-smallarrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#99a9c5" />
    </marker>
  </defs>
  <rect x="150" y="310" width="180" height="55" rx="6" fill="#2d2d44" stroke="#6c757d" stroke-width="1.5" />
  <text x="240" y="333" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold" id="SEM06_module_structure-text-33">etc/*.conf</text>
  <text x="240" y="353" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-34">Literal configuration data</text>
  <rect x="370" y="310" width="180" height="55" rx="6" fill="#2d2d44" stroke="#6c757d" stroke-width="1.5" />
  <text x="460" y="333" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold" id="SEM06_module_structure-text-36">var/log/, var/run/</text>
  <text x="460" y="353" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-37">Runtime data</text>
  <line x1="160" y1="265" x2="200" y2="310" stroke="#99a9c5" stroke-width="1" stroke-dasharray="4,2" />
  <line x1="540" y1="265" x2="500" y2="310" stroke="#99a9c5" stroke-width="1" stroke-dasharray="4,2" />
  <rect x="50" y="385" width="600" height="45" rx="6" fill="#0f0f1a" stroke="#3a3a5a" />
  <text x="350" y="405" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_module_structure-text-41">LOAD LIBS → DEFAULTS → FILE → ENV / CLI</text>
  <text x="350" y="420" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-42">VALIDATE → MAIN → OUTPUT → CLEANUP (conceptual sequence)</text>
  <text x="350" y="442" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_module_structure-text-43">SEM06 — Modular Bash Architecture</text>
</svg>
