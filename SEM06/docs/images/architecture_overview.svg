<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Consolas, monospace" role="img" aria-labelledby="sem06-architecture_overview-title sem06-architecture_overview-desc" xml:lang="en">
  <title id="sem06-architecture_overview-title">Architecture Overview</title>
  <desc id="sem06-architecture_overview-desc">Monitor, Backup and Deployer use a common modular pattern, with separate lib directories in each project. Integration arrows are design relationships, not automatically activated hooks. Strategy adapters require implementation and target-environment validation.</desc>
  <rect width="800" height="500" fill="#1a1a2e" />
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold" id="SEM06_architecture_overview-text-4">CAPSTONE Architecture Overview</text>
  <rect x="50" y="60" width="700" height="380" rx="10" fill="#16213e" stroke="#4a4a6a" stroke-width="2" />
  <text x="400" y="90" text-anchor="middle" fill="#8892b0" font-size="14" id="SEM06_architecture_overview-text-6">INFRASTRUCTURE LAYER</text>
  <rect x="80" y="120" width="180" height="140" rx="8" fill="#0f3460" stroke="#00d9ff" stroke-width="2" />
  <text x="170" y="150" text-anchor="middle" fill="#00d9ff" font-size="16" font-weight="bold" id="SEM06_architecture_overview-text-8">MONITOR</text>
  <text x="170" y="175" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-9">• CPU/Memory metrics</text>
  <text x="170" y="195" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-10">• Disk usage checks</text>
  <text x="170" y="215" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-11">• Process monitoring</text>
  <text x="170" y="235" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-12">• Alerting system</text>
  <rect x="310" y="120" width="180" height="140" rx="8" fill="#0f3460" stroke="#00ff88" stroke-width="2" />
  <text x="400" y="150" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="bold" id="SEM06_architecture_overview-text-14">BACKUP</text>
  <text x="400" y="175" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-15">• Full/incremental</text>
  <text x="400" y="195" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-16">• Compression</text>
  <text x="400" y="215" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-17">• Checksum verify</text>
  <text x="400" y="235" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-18">• Rotation policy</text>
  <rect x="540" y="120" width="180" height="140" rx="8" fill="#0f3460" stroke="#ff6b6b" stroke-width="2" />
  <text x="630" y="150" text-anchor="middle" fill="#ff9696" font-size="16" font-weight="bold" id="SEM06_architecture_overview-text-20">DEPLOYER</text>
  <text x="630" y="175" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-21">• Rolling deploy</text>
  <text x="630" y="195" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-22">• Strategy adapters</text>
  <text x="630" y="215" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-23">• Health checks</text>
  <text x="630" y="235" text-anchor="middle" fill="#c4cddd" font-size="11" id="SEM06_architecture_overview-text-24">• Rollback</text>
  <rect x="180" y="300" width="440" height="80" rx="8" fill="#1a1a3a" stroke="#ffd93d" stroke-width="2" />
  <text x="400" y="330" text-anchor="middle" fill="#ffd93d" font-size="14" font-weight="bold" id="SEM06_architecture_overview-text-26">COMMON MODULE PATTERN</text>
  <text x="250" y="355" text-anchor="middle" fill="#c0c0c0" font-size="12" id="SEM06_architecture_overview-text-27">lib/core.sh</text>
  <text x="400" y="355" text-anchor="middle" fill="#c0c0c0" font-size="12" id="SEM06_architecture_overview-text-28">lib/config.sh</text>
  <text x="550" y="355" text-anchor="middle" fill="#c0c0c0" font-size="12" id="SEM06_architecture_overview-text-29">lib/utils.sh</text>
  <line x1="170" y1="260" x2="170" y2="285" stroke="#00d9ff" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="170" y1="285" x2="200" y2="300" stroke="#00d9ff" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="400" y1="260" x2="400" y2="300" stroke="#00ff88" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="630" y1="260" x2="630" y2="285" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="630" y1="285" x2="600" y2="300" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,3" />
  <path d="M260 190 Q285 190 310 190" fill="none" stroke="#99a9c5" stroke-width="1.5" marker-end="url(#sem06-architecture_overview-arrow)" />
  <path d="M490 190 Q515 190 540 190" fill="none" stroke="#99a9c5" stroke-width="1.5" marker-end="url(#sem06-architecture_overview-arrow)" />
  <defs>
    <marker id="sem06-architecture_overview-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#99a9c5" />
    </marker>
  </defs>
  <text x="285" y="180" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_architecture_overview-text-40">alerts</text>
  <text x="515" y="180" text-anchor="middle" fill="#c4cddd" font-size="9" id="SEM06_architecture_overview-text-41">backup</text>
  <rect x="80" y="400" width="640" height="30" rx="5" fill="#2d2d44" stroke="#4a4a6a" />
  <text x="400" y="420" text-anchor="middle" fill="#c4cddd" font-size="12" id="SEM06_architecture_overview-text-43">Linux sources: /proc • /sys • signals • processes</text>
  <text x="400" y="475" text-anchor="middle" fill="#c4cddd" font-size="10" id="SEM06_architecture_overview-text-44">SEM06 CAPSTONE — Operating Systems — ASE Bucharest</text>
</svg>
