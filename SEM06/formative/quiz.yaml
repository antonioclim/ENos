questions:
- id: q01
  type: mcq
  bloom: remember
  points: 5
  subject: Error handling
  text: Which command enables errexit, nounset and pipefail together in Bash? Their documented context-dependent
    exceptions still apply.
  options:
    a: set -e
    b: set -euo pipefail
    c: set -x
    d: set -v
  correct: b
  explanation: 'set -euo pipefail enables three distinct options: errexit for unguarded failures subject
    to exceptions, nounset for relevant unset-variable expansions, and the rightmost non-zero pipeline
    status (or zero if every component succeeds). It is not a universal exception handler. Parenthesised
    subshells and command substitutions have different errexit rules; ERR inheritance is controlled separately.'
  misconceptions:
    a: -e enables only errexit, with documented exceptions; it does not enable nounset or pipefail.
    c: -x activates debug mode (prints commands), not error handling
    d: -v displays lines read, doesn't manage errors
- id: q02
  type: mcq
  bloom: remember
  points: 5
  subject: Trap and signals
  text: In a terminal with the usual Ctrl+C interrupt character and ISIG enabled, which signal is sent
    to the foreground process group when Ctrl+C is pressed?
  options:
    a: SIGTERM
    b: SIGKILL
    c: SIGINT
    d: SIGHUP
  correct: c
  explanation: The terminal driver sends SIGINT to the foreground process group under the stated terminal
    settings. A process can handle it; the effect depends on its handler and terminal mode.
  misconceptions:
    a: SIGTERM is the default signal of kill command, not Ctrl+C
    b: SIGKILL cannot be caught and terminates process immediately
    d: SIGHUP is sent when terminal closes
- id: q03
  type: mcq
  bloom: remember
  points: 5
  subject: Exit codes
  text: |
    Which exit code indicates successful execution in Unix convention?
  options:
    a: '1'
    b: '-1'
    c: '0'
    d: '255'
  correct: c
  explanation: Zero conventionally means success. Non-zero statuses can distinguish errors or documented
    non-success outcomes such as grep finding no match. Bash exposes an 8-bit status; check it immediately
    or use a tested command.
  misconceptions:
    a: 1 indicates generic error
    b: -1 is not success; Bash exit -1 yields status 255 rather than a negative externally visible status.
    d: 255 indicates error, not success
- id: q19
  type: mcq
  bloom: remember
  points: 5
  subject: Signal listing
  text: |
    Which command displays the complete list of signals available in the system?
  options:
    a: kill -l
    b: signal --list
    c: trap -p
    d: ps -s
  correct: a
  explanation: |
    `kill -l` lists all available signals with their numbers.
    Example output: 1) SIGHUP  2) SIGINT  3) SIGQUIT ...

    `trap -p` shows currently active traps, not the signal list.
  misconceptions:
    b: There is no 'signal' command in standard Unix
    c: trap -p shows active traps, not the signal list
    d: ps -s is not the command for listing available signal names.
- id: q20
  type: mcq
  bloom: remember
  points: 5
  subject: Compression algorithms
  text: Which listed compression tool normally uses the LZMA2 codec in the .xz container? This identifies
    a format; it does not assume a universal performance ranking.
  options:
    a: gzip
    b: bzip2
    c: xz
    d: lz4
  correct: c
  explanation: xz commonly uses LZMA2 in the .xz container. Compression ratio, CPU time, decompression
    cost and memory depend on data, preset, threads and implementation. A universal ordering by speed
    or output size cannot be inferred from an algorithm name.
  misconceptions:
    a: gzip uses a different format/codec.
    b: bzip2 uses a different compression pipeline, not the .xz/LZMA2 pairing.
    d: lz4 is not the .xz/LZMA2 pairing.
- id: q04
  type: mcq
  bloom: understand
  points: 6
  subject: Modular architecture
  text: |
    Why do we separate code into lib/core.sh, lib/utils.sh, lib/config.sh
    instead of writing everything in a single file?
  options:
    a: Because Bash doesn't allow files larger than 1000 lines
    b: For reuse, isolated testing, and easy maintenance
    c: Because `source` only works with small files
    d: To make the script harder for others to understand
  correct: b
  explanation: Clear module interfaces can support reuse, focused testing and maintenance. Changes may
    still affect callers and require integration checks. source executes code in the current shell; it
    is not an isolation boundary.
  misconceptions:
    a: Bash has no fixed 1000-line source limit; resource limits still exist.
    c: source has no small-file-only rule; it executes the selected code in the current shell.
    d: Modularisation increases clarity, doesn't reduce it
- id: q05
  type: mcq
  bloom: understand
  points: 6
  subject: Incremental backup
  text: |
    How does an incremental backup work compared to a full one?
  options:
    a: Copies all files on each run
    b: Records changes relative to an earlier successful backup, according to the backup format
    c: Compresses files more than full backup
    d: Deletes old files automatically
  correct: b
  explanation: Incremental backups depend on a suitable full/base backup and the required increment chain.
    A usable format must represent the intended data and metadata changes, including deletions when exact
    restoration is required. find -newer alone selects modification times and cannot provide a complete
    deletion-aware incremental restore contract.
  misconceptions:
    a: This is the definition of full backup
    c: Compression doesn't define backup type
    d: Rotation/deletion is separate from backup type
- id: q06
  type: mcq
  bloom: understand
  points: 6
  subject: Health checks
  text: For a simplified HTTP health check configured to require a 2xx response from a named endpoint,
    what is directly checked?
  options:
    a: Whether port 22 SSH is open
    b: Whether application responds with 2xx code to a specific endpoint
    c: Whether server CPU is below 50%
    d: Whether admin user can login
  correct: b
  explanation: The check requests the named HTTP endpoint and applies the explicitly configured status/body
    expectations. A2xx response alone does not establish correctness of every application function, database
    state or deployment.
  misconceptions:
    a: SSH is for administration, not for application health check
    c: CPU monitoring is separate from application health check
    d: A separate authenticated probe could test login; that is not the stated endpoint/status check.
- id: q07
  type: mcq
  bloom: understand
  points: 6
  subject: Logging
  text: In the logging convention used by these projects, which order runs from least to most severe among
    the four listed levels?
  options:
    a: ERROR, WARN, INFO, DEBUG
    b: DEBUG, INFO, WARN, ERROR
    c: INFO, DEBUG, ERROR, WARN
    d: WARN, ERROR, DEBUG, INFO
  correct: b
  explanation: |
    Standard order of logging levels:
    DEBUG < INFO < WARN < ERROR < FATAL
    - DEBUG: detailed information for debugging
    - INFO: normal execution events
    - WARN: unexpected but recoverable situations
    - ERROR: errors affecting functionality
  misconceptions:
    a: Order is reversed
    c: DEBUG is less severe than INFO
    d: Order is completely incorrect
- id: q08
  type: mcq
  bloom: understand
  points: 6
  subject: Deployment strategies
  text: |
    What is the main advantage of Blue-Green deployment strategy?
  options:
    a: Requires less memory than Rolling deployment
    b: Can switch traffic back quickly if the old environment remains healthy and state-compatible
    c: Doesn't require load balancer
    d: Works without downtime ever
  correct: b
  explanation: Blue-green keeps separate old and new serving environments. Rollback can switch routing
    back if capacity, health and application/data compatibility permit it. DNS caches, connection/session
    behaviour and migrations mean neither switching nor rollback is universally instant.
  misconceptions:
    a: Maintaining two serving environments normally needs additional capacity; no fixed memory ratio
      is assumed.
    c: Some explicit routing mechanism is required; its form depends on the deployment.
    d: Switch itself can cause micro-downtime
- id: q22
  type: mcq
  bloom: understand
  points: 5
  subject: Cron scheduling
  text: |
    What does the cron expression "0 3 * * 0" schedule?
  options:
    a: Every day at 03:00
    b: Every Sunday at 03:00
    c: Every hour on the 3rd day
    d: Every 3 minutes on Sunday
  correct: b
  explanation: |
    Cron format: minute hour day month weekday
    0 3 * * 0 = minute 0, hour 3, any day, any month, Sunday (0)
    Result: Every Sunday at 03:00

    Weekday field: 0=Sunday, 1=Monday, ..., 6=Saturday
  misconceptions:
    a: Would be 0 3 * * * (all weekdays)
    c: Would be 0 * 3 * *
    d: '*/3 would mean every 3 minutes'
- id: q09
  type: mcq
  bloom: apply
  points: 6
  subject: Trap cleanup
  text: In Bash, compare trap cleanup EXIT SIGINT and trap 'cleanup' EXIT INT. Which statement is correct?
  options:
    a: Only the SIGINT spelling is accepted
    b: Both spellings install EXIT and interrupt actions; they do not guarantee exactly-once cleanup
    c: Both execute cleanup immediately when registered
    d: Either form makes cleanup run after SIGKILL
  correct: b
  explanation: Bash accepts INT and SIGINT. The action is stored for later execution. An INT handler that
    returns can allow the script to continue, followed by EXIT cleanup later; choose explicit handler
    exit behaviour and idempotent cleanup if exactly-once effects matter. SIGKILL cannot be caught.
  misconceptions:
    a: Bash also accepts INT.
    c: The action runs when the event occurs, not at registration.
    d: SIGKILL cannot be trapped.
- id: q10
  type: mcq
  bloom: apply
  points: 6
  subject: Find with timestamp
  text: |
    Which command finds files modified after timestamp.txt?
  options:
    a: find /data -newer timestamp.txt -type f
    b: find /data -mtime +timestamp.txt
    c: find /data --after timestamp.txt
    d: find /data -modified > timestamp.txt
  correct: a
  explanation: find -newer compares modification times with the reference; -type f restricts results to
    regular files. It is useful for selecting changes, but it alone neither represents deletions nor proves
    a complete incremental backup.
  misconceptions:
    b: -mtime uses days, not reference file
    c: --after is not a valid option for find
    d: Invalid syntax, wrong redirection
- id: q11
  type: mcq
  bloom: apply
  points: 6
  subject: Functions with return
  text: Which statement correctly distinguishes a Bash function status from arbitrary numeric output?
  options:
    a: return can convey an arbitrarily large result without status wrapping
    b: Command substitution captures the exit status as text automatically
    c: return sets status; quoted printf output can be captured with command substitution for data
    d: export from a command-substitution child updates the parent shell
  correct: c
  explanation: Use an explicit non-zero/zero status for the function contract. Use printf "%s\n" "$value"
    for numeric/string output and capture it with result=$(function_name), while checking that command's
    status when required. Command substitution strips trailing newlines and cannot update the parent's
    environment.
  misconceptions:
    a: An externally observed status is 8-bit, not an arbitrary result channel.
    b: Command substitution captures stdout, not status.
    d: The child cannot export changes back into its parent.
- id: q12
  type: mcq
  bloom: apply
  points: 6
  subject: HTTP verification
  text: Which listed command makes an HTTP request to /health and enables curl failure status for ordinary
    HTTP 4xx/5xx responses, rather than only probing a TCP port?
  options:
    a: ping localhost:8080
    b: curl -sf http://localhost:8080/health
    c: wget --check localhost:8080
    d: nc -z localhost 8080
  correct: b
  explanation: curl -sf makes the HTTP request and enables --fail handling. It does not by itself require
    exactly 2xx, validate the response body or impose a timeout. A deployment health policy should state
    accepted status/body conditions and connect/overall timeouts. nc -z checks a TCP connection only.
  misconceptions:
    a: ping verifies ICMP, not HTTP, and doesn't accept port
    c: --check is not a valid wget option
    d: nc -z only checks open TCP port, not HTTP
- id: q13
  type: mcq
  bloom: apply
  points: 6
  subject: Arrays in Bash
  text: Which syntax preserves every element of an indexed Bash array during iteration, including spaces,
    glob characters and empty elements?
  options:
    a: for item in $ARRAY; do
    b: for item in ${ARRAY[@]}; do
    c: for item in "${ARRAY[@]}"; do
    d: foreach item in ARRAY; do
  correct: c
  explanation: |
    `"${ARRAY[@]}"` - correct form:
    - `[@]` expands all elements
    - Double quotes preserve elements with spaces as units
    - Without quotes, "hello world" becomes two elements
  misconceptions:
    a: $ARRAY without [@] returns only first element
    b: Without quotes, spaces in elements cause problems
    d: foreach doesn't exist in Bash
- id: q14
  type: mcq
  bloom: apply
  points: 6
  subject: Checksum verification
  text: Which command checks files against an existing SHA-256 checksum manifest? The manifest must come
    from a trusted source if authenticity is required.
  options:
    a: sha256sum -c backup.sha256
    b: sha256sum backup.tar.gz
    c: diff backup.sha256 backup.tar.gz
    d: cmp --checksum backup.tar.gz
  correct: a
  explanation: sha256sum -c reads the stored hashes and filenames and checks the corresponding file bytes.
    Running sha256sum without -c computes a digest. Matching a locally changeable checksum is not a signature
    or proof of authorship.
  misconceptions:
    b: Calculates hash, doesn't verify existing one
    c: diff compares content, doesn't verify checksum
    d: --checksum is not a valid option for cmp
- id: q21
  type: mcq
  bloom: apply
  points: 6
  subject: Bash testing
  text: A test runs under set -e and must report an assertion even if my_function explicitly returns non-zero.
    Assume assertEquals EXPECTED ACTUAL is defined. Which pattern captures the status without an unguarded
    expected failure exiting first?
  options:
    a: test $(my_function) -eq 0
    b: status=0; my_function || status=$?; assertEquals 0 "$status"
    c: my_function && printf success
    d: assert my_function returns 0
  correct: b
  explanation: The OR-list guards the invocation and captures its status immediately. The assertion then
    runs for either outcome. A function invoked in a tested context can have errexit ignored inside its
    body, so it must implement its error contract explicitly; this harness is not equivalent to an unguarded
    call relying on implicit errexit.
  misconceptions:
    a: This tests stdout content, not exit code
    c: The message is skipped on failure and no failure assertion is made.
    d: This syntax doesn't exist in Bash testing
- id: q23
  type: mcq
  bloom: apply
  points: 6
  subject: Systemd timers
  text: Which statement about systemd calendar timers scheduling daily 02:30 is correct?
  options:
    a: Only OnCalendar=02:30 is valid
    b: OnCalendar=02:30 and OnCalendar=*-*-* 02:30:00 are equivalent daily calendar forms
    c: OnUnitActiveSec=24h always runs at wall-clock 02:30
    d: OnBootSec=02:30 repeats at 02:30 every day
  correct: b
  explanation: The short and full OnCalendar forms normalise to the same daily 02:30 calendar expression.
    Relative activation/boot timers have different semantics. Check the target system's time zone, DST
    and timer accuracy requirements; parsing the expression does not start a service.
  misconceptions:
    a: Both the short and complete calendar form are valid.
    c: This runs 24h after last activation, not at fixed time
    d: OnBootSec runs relative to boot, not daily
- id: q15
  type: mcq
  bloom: analyse
  points: 8
  subject: Debug script
  text: |-
    With errexit off, BACKUP_FILE and SOURCE_DIR set, and tar returning non-zero, why can this code still print a false success message?

    ```bash
    tar czf "$BACKUP_FILE" "$SOURCE_DIR" 2>/dev/null
    echo "Backup completed"
    ```
  options:
    a: The tar status is not tested and its stderr is discarded
    b: echo doesn't work after tar
    c: The code proves that BACKUP_FILE is undefined
    d: SOURCE_DIR contains only empty directories
  correct: a
  explanation: The unconditional echo is independent of the previous status. Keep diagnostic evidence
    and branch on the tar result before reporting success. This snippet does not establish a particular
    reason for failure or a particular archive size.
  misconceptions:
    b: echo works independently of previous commands
    c: The question explicitly states that the variable is set; it does not identify a missing-variable
      cause.
    d: tar would include directories, even empty ones
- id: q16
  type: mcq
  bloom: analyse
  points: 8
  subject: Race condition
  text: |-
    Assume two independent top-level Bash processes use the same owned PID_FILE. Why is this check-then-write pattern racy?

    ```bash
    if [[ ! -f "$PID_FILE" ]]; then
        echo $$ > "$PID_FILE"
    fi
    ```
  options:
    a: $$ doesn't contain the correct PID
    b: Two instances can check simultaneously and both write
    c: PID_FILE must be in /var/run
    d: Echo cannot write to files
  correct: b
  explanation: |
    Race condition (TOCTOU - Time Of Check To Time Of Use):
    - Instance A checks: file doesn't exist
    - Instance B checks: file doesn't exist
    - Both write their PID

    Fix: use atomic `mkdir` or `flock`:
    ```bash
    exec 200>"$LOCK_FILE"
    flock -n 200 || exit 1
    ```

    Use an owned lock directory/file and retain the descriptor lock for the complete critical section. Do not unlink a live flock lock path, which could allow another inode to be locked independently.
  misconceptions:
    a: $$ correctly contains current process PID
    c: Location doesn't affect race condition
    d: echo can write to files with redirection
- id: q17
  type: mcq
  bloom: evaluate
  points: 8
  subject: Deployment strategy
  text: An application requires zero downtime and instant rollback but cannot duplicate its infrastructure.
    Without further capacity, routing and data-compatibility assumptions, which conclusion is justified?
  options:
    a: Blue-green automatically satisfies all requirements without extra capacity
    b: No named strategy alone guarantees all requirements; the deployment contract needs more information
    c: Recreate guarantees zero downtime
    d: Big bang guarantees instantaneous safe rollback
  correct: b
  explanation: Rolling may reduce additional capacity but usually needs gradual reversal/redeployment
    and does not guarantee instant rollback. Blue-green needs retained serving capacity and compatible
    state. Zero downtime and rollback guarantees require explicit workload, capacity, routing and migration
    assumptions.
  misconceptions:
    a: Separate serving environments have capacity costs and state/routing requirements.
    c: Stopping/replacing the service can cause an outage.
    d: A one-step rollout does not by itself create a safe rollback contract.
- id: q18
  type: mcq
  bloom: evaluate
  points: 8
  subject: Compression choice
  text: A server has limited CPU and ample storage, but no workload, transfer-time or restore measurements
    are provided. What is a justified compression decision?
  options:
    a: Always choose xz because it is universally smallest
    b: Always choose gzip because it is universally fastest
    c: Benchmark candidate codecs/settings and no compression against explicit backup/restore constraints
    d: Always choose no compression because it is universally fastest end to end
  correct: c
  explanation: There is no universal winner from those two facts alone. Data compressibility, CPU, I/O/transfer
    limits, memory, backup window and restore latency matter. Retain measured inputs/results, including
    unfavourable results, before selecting an empirical optimum. No benchmark is invented here.
  misconceptions:
    a: The ratio and cost depend on data and preset.
    b: Speed depends on implementation, configuration and workload.
    d: Reduced I/O can change end-to-end time; the result needs measurement.
configuration:
  show_explanations: true
  show_misconceptions: true
  random_order: false
  allow_return: true
  time_limit: false
  messages:
    welcome: CAPSTONE Quiz - Integrated Bash Projects
    final_pass: You have demonstrated understanding of CAPSTONE concepts!
    final_fail: Review the materials and try again.
  feedback_level:
    90: Excellent! You're ready for advanced projects.
    75: Good! Consolidate deployment concepts.
    60: Sufficient. Focus on error handling and testing.
    0: Requires additional study. Start with modular architecture.
