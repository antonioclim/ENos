# Template only. Enabling a workflow is a separate repository action.
name: SEM06 CAPSTONE CI
on:
  push:
    paths: ['SEM06/**', 'lib/**', 'scripts/build_formative_exports.py', 'pyproject.toml', '.github/workflows/sem06_ci.yml']
  pull_request:
    paths: ['SEM06/**', 'lib/**', 'scripts/build_formative_exports.py', 'pyproject.toml', '.github/workflows/sem06_ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Provision CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install pytest pyyaml "markdown-it-py>=3,<5"
      - name: Check Bash version and syntax
        shell: bash
        run: |
          set -euo pipefail
          ((BASH_VERSINFO[0] > 4 || BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 4))
          mapfile -d '' files < <(find SEM06/scripts SEM06/resources/templates -type f -name '*.sh' -print0)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do bash -n "$file"; done
          shellcheck -S warning "${files[@]}"
      - name: Python syntax and semantic tests
        run: |
          python -m compileall -q SEM06/scripts SEM06/formative SEM06/tests
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest SEM06/tests lib/test_regressions.py -q
      - name: Native local project tests
        shell: bash
        run: |
          set -euo pipefail
          for project in monitor backup deployer; do
            bash "SEM06/scripts/projects/$project/tests/test_$project.sh"
          done
      - name: Formative schema and current export
        run: |
          python SEM06/formative/quiz_runner.py --test
          python scripts/build_formative_exports.py --check
      - name: Required sources and local links
        shell: bash
        run: |
          set -euo pipefail
          for file in SEM06/README.md SEM06/docs/lo_traceability.md SEM06/docs/TEACHING_CONTRACT.md SEM06/homework/S06_01_HOMEWORK_CAPSTONE.md; do
            test -s "$file"
          done
          python scripts/link_check.py SEM06
